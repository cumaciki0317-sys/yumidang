<!DOCTYPE html><html class="h-full" lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>유미당 - 취소 사유 선택</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Plus Jakarta Sans & Noto Sans KR -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-primary-fixed-variant": "#5100ce",
            "primary": "#5300d1",
            "on-secondary-fixed": "#1a1a27",
            "surface-container-lowest": "#ffffff",
            "error-container": "#ffdad6",
            "on-tertiary-container": "#ffd1bd",
            "on-tertiary-fixed": "#351000",
            "on-tertiary-fixed-variant": "#7b2f00",
            "surface": "#f9f9ff",
            "surface-container-highest": "#dce2f7",
            "on-secondary": "#ffffff",
            "primary-fixed-dim": "#cebdff",
            "outline-variant": "#cbc3d9",
            "surface-dim": "#d3daef",
            "surface-container-low": "#f1f3ff",
            "secondary-container": "#e3e0f2",
            "outline": "#7a7488",
            "on-error-container": "#93000a",
            "on-surface-variant": "#494456",
            "inverse-surface": "#293040",
            "on-surface": "#141b2b",
            "on-tertiary": "#ffffff",
            "secondary-fixed": "#e3e0f2",
            "surface-variant": "#dce2f7",
            "primary-container": "#6c2cf5",
            "on-primary": "#ffffff",
            "tertiary-fixed-dim": "#ffb694",
            "surface-tint": "#6b2af4",
            "primary-fixed": "#e8ddff",
            "on-secondary-fixed-variant": "#464553",
            "secondary-fixed-dim": "#c7c5d6",
            "tertiary-container": "#a34100",
            "on-error": "#ffffff",
            "secondary": "#5e5d6c",
            "surface-container": "#e9edff",
            "background": "#f9f9ff",
            "inverse-on-surface": "#edf0ff",
            "on-primary-fixed": "#21005e",
            "on-primary-container": "#e1d4ff",
            "on-secondary-container": "#646372",
            "surface-bright": "#f9f9ff",
            "tertiary": "#7d3000",
            "tertiary-fixed": "#ffdbcc",
            "inverse-primary": "#cebdff",
            "on-background": "#141b2b",
            "surface-container-high": "#e1e8fd",
            "error": "#ba1a1a"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-xl": "2rem",
            "margin": "1.25rem",
            "gutter": "1rem"
          },
          "fontFamily": {
            "label-sm": ["Noto Sans KR", "Plus Jakarta Sans"],
            "headline-md": ["Noto Sans KR", "Plus Jakarta Sans"],
            "body-sm": ["Noto Sans KR", "Plus Jakarta Sans"],
            "body-md": ["Noto Sans KR", "Plus Jakarta Sans"],
            "headline-sm": ["Noto Sans KR", "Plus Jakarta Sans"],
            "caption": ["Noto Sans KR", "Plus Jakarta Sans"],
            "label-md": ["Noto Sans KR", "Plus Jakarta Sans"],
            "headline-lg": ["Noto Sans KR", "Plus Jakarta Sans"],
            "body-lg": ["Noto Sans KR", "Plus Jakarta Sans"]
          },
          "fontSize": {
            "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
            "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "700" }],
            "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "body-md": ["15px", { "lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "400" }],
            "headline-sm": ["18px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "caption": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
            "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "600" }],
            "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "500" }]
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Noto Sans KR', 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex justify-center selection:bg-primary-fixed selection:text-primary">
<!-- Mobile Viewport Frame (Max width 440px standard mobile container) -->
<div class="w-full max-w-md min-h-screen flex flex-col bg-surface relative shadow-xl">
<!-- Top App Bar (Task-oriented Cancel Flow: Back + Title + Step Tracker) -->
<header class="sticky top-0 z-40 bg-surface/95 backdrop-blur-md px-margin h-14 flex items-center justify-between shadow-[0_1px_0_rgba(203,195,217,0.3)]">
<button aria-label="뒤로가기" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">
        취소 사유 선택
      </h1>
<div class="flex items-center space-x-1 bg-surface-container-high/80 px-2.5 py-1 rounded-full border border-outline-variant/30">
<span class="font-label-sm text-label-sm text-primary font-bold">1</span>
<span class="font-label-sm text-label-sm text-secondary">/</span>
<span class="font-label-sm text-label-sm text-secondary">2</span>
</div>
</header>
<!-- Main Scrollable Canvas -->
<main class="flex-1 px-margin pt-space-lg pb-32 overflow-y-auto">
<!-- Header Informative Text Block -->
<section class="mb-space-lg">
<div class="flex items-center gap-space-xs mb-1.5">
<span class="font-label-sm text-label-sm text-primary-container tracking-wider font-semibold">동행 약속 취소</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface font-bold mb-space-xs leading-tight">
          취소 사유를 알려주세요
        </h2>
<p class="font-body-sm text-body-sm text-secondary leading-relaxed">
          더 나은 매칭 서비스 제공과 메이트 상호 존중을 위해 취소 사유를 솔직하게 남겨주세요.
        </p>
</section>
<!-- Cancel Reasons Single Select (Radio List) -->
<section aria-labelledby="cancel-reasons-group" class="space-y-2.5 mb-space-xl" role="radiogroup">
<h3 class="sr-only" id="cancel-reasons-group">취소 사유 옵션 목록</h3>
<!-- Option 1 (Selected State) -->
<label class="group relative flex items-center p-4 bg-surface-container-lowest rounded-xl border-2 border-primary-container shadow-[0_2px_8px_rgba(108,44,245,0.06)] cursor-pointer transition-all duration-200">
<input checked="" class="sr-only peer" name="cancel_reason" type="radio" value="personal_schedule">
<div class="w-5 h-5 rounded-full border-2 border-primary-container bg-primary-container flex items-center justify-center mr-3.5 flex-shrink-0 transition-colors">
<span class="w-2 h-2 rounded-full bg-surface-container-lowest"></span>
</div>
<div class="flex-1">
<span class="font-body-md text-body-md font-semibold text-on-surface block">
              개인 일정 변경 / 급한 사정 발생
            </span>
</div>
<span class="material-symbols-outlined text-primary-container text-[20px] opacity-100 peer-checked:opacity-100 transition-opacity">
            check
          </span>
</label>
<!-- Option 2 -->
<label class="group relative flex items-center p-4 bg-surface-container-lowest rounded-xl border border-outline-variant/50 hover:border-outline hover:bg-surface-container-low cursor-pointer transition-all duration-150">
<input class="sr-only peer" name="cancel_reason" type="radio" value="communication_issue">
<div class="w-5 h-5 rounded-full border border-outline flex items-center justify-center mr-3.5 flex-shrink-0 transition-colors group-hover:border-primary">
<span class="w-2 h-2 rounded-full bg-transparent"></span>
</div>
<div class="flex-1">
<span class="font-body-md text-body-md font-normal text-on-surface block">
              동행 상대와의 소통 및 시간 조율 어려움
            </span>
</div>
</label>
<!-- Option 3 -->
<label class="group relative flex items-center p-4 bg-surface-container-lowest rounded-xl border border-outline-variant/50 hover:border-outline hover:bg-surface-container-low cursor-pointer transition-all duration-150">
<input class="sr-only peer" name="cancel_reason" type="radio" value="event_altered">
<div class="w-5 h-5 rounded-full border border-outline flex items-center justify-center mr-3.5 flex-shrink-0 transition-colors group-hover:border-primary">
<span class="w-2 h-2 rounded-full bg-transparent"></span>
</div>
<div class="flex-1">
<span class="font-body-md text-body-md font-normal text-on-surface block">
              행사/전시 일정 취소 또는 변동
            </span>
</div>
</label>
<!-- Option 4 -->
<label class="group relative flex items-center p-4 bg-surface-container-lowest rounded-xl border border-outline-variant/50 hover:border-outline hover:bg-surface-container-low cursor-pointer transition-all duration-150">
<input class="sr-only peer" name="cancel_reason" type="radio" value="other_confirmed">
<div class="w-5 h-5 rounded-full border border-outline flex items-center justify-center mr-3.5 flex-shrink-0 transition-colors group-hover:border-primary">
<span class="w-2 h-2 rounded-full bg-transparent"></span>
</div>
<div class="flex-1">
<span class="font-body-md text-body-md font-normal text-on-surface block">
              다른 동행 일정이 먼저 확정됨
            </span>
</div>
</label>
<!-- Option 5 -->
<label class="group relative flex items-center p-4 bg-surface-container-lowest rounded-xl border border-outline-variant/50 hover:border-outline hover:bg-surface-container-low cursor-pointer transition-all duration-150">
<input class="sr-only peer" name="cancel_reason" type="radio" value="custom_input">
<div class="w-5 h-5 rounded-full border border-outline flex items-center justify-center mr-3.5 flex-shrink-0 transition-colors group-hover:border-primary">
<span class="w-2 h-2 rounded-full bg-transparent"></span>
</div>
<div class="flex-1">
<span class="font-body-md text-body-md font-normal text-on-surface block">
              기타 사유 직접 입력
            </span>
</div>
</label>
</section>
<!-- Message to Companion Textarea (Optional Feedback) -->
<section class="mb-space-xl">
<div class="flex items-center justify-between mb-2">
<label class="font-headline-sm text-headline-sm font-semibold text-on-surface" for="companion-message">
            상대 메이트에게 전달할 정중한 메시지
            <span class="font-label-sm text-label-sm text-secondary font-normal ml-1">(선택)</span>
</label>
</div>
<p class="font-caption text-caption text-secondary mb-2.5">
          입력하신 메시지는 상대방에게 알림과 함께 배려 깊은 문구로 전달됩니다.
        </p>
<div class="relative bg-surface-container-lowest rounded-xl border border-outline-variant/60 focus-within:border-primary-container focus-within:ring-2 focus-within:ring-primary-container/20 transition-all p-3.5">
<textarea class="w-full bg-transparent border-0 resize-none p-0 font-body-sm text-body-sm text-on-surface placeholder:text-outline-variant focus:ring-0 leading-relaxed" id="companion-message" maxlength="100" placeholder="상대방이 안심할 수 있도록 취소 사유를 따뜻하게 전해주세요." rows="3">갑작스러운 야근으로 인해 약속을 지키지 못하게 되었습니다. 기다려주셨는데 정말 죄송합니다.</textarea>
<div class="flex justify-end items-center pt-2 mt-1 border-t border-surface-container-high">
<span class="font-caption text-caption text-secondary font-medium">
<span class="text-primary-container font-semibold">54</span>/100자
            </span>
</div>
</div>
</section>
<!-- Safety & Support Notice Card (안심 안내 박스) -->
<section class="bg-primary-fixed/30 rounded-xl p-4 border border-primary-fixed-dim/40 flex items-start gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-lowest flex items-center justify-center flex-shrink-0 text-primary-container shadow-sm mt-0.5">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
</div>
<div class="flex-1">
<p class="font-body-sm text-body-sm text-on-surface font-medium leading-snug">
            상대방의 비매너나 노쇼 우려로 인한 취소인가요?
          </p>
<p class="font-body-sm text-body-sm text-secondary mt-1 leading-snug">
            신고하기는 <a class="text-primary font-semibold underline underline-offset-2 hover:text-on-primary-fixed-variant transition-colors" href="#support">고객센터 안심 접수</a>를 이용해 주세요.
          </p>
</div>
</section>
</main>
<!-- Bottom Sticky Action Bar (Linear/Transactional Destination: Nav Shell Suppressed) -->
<footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 bg-surface/95 backdrop-blur-md px-margin py-3.5 border-t border-outline-variant/30 shadow-[0_-4px_20px_rgba(17,24,39,0.06)]">
<div class="flex items-center gap-space-sm">
<button class="flex-1 h-12 bg-primary-container text-on-primary font-body-lg text-body-lg font-semibold rounded-xl flex items-center justify-center shadow-sm hover:opacity-95 active:scale-[0.98] transition-all duration-150" type="button">
          취소 완료하기
        </button>
</div>
</footer>
</div>
</body></html>

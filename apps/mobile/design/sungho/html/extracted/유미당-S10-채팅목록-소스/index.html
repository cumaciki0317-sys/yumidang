<script>

let filter='전체';const rows=[{name:'김*미',age:27,sweetness:17,unread:1,timeLabel:"오후 2:30",state:'대화 중',kind:'active',post:'삼청동 미술관 천천히 같이 볼 분',message:'네, 토요일 오후 2시에 만나요!',photo:'companion-profile.webp'},{name:'이민정',age:31,sweetness:19,unread:12,timeLabel:"어제",state:'확정',kind:'confirmed',post:'가을 전시 보고 차 한 잔 함께해요',message:'미술관 입구에서 뵐게요.',photo:'provided-profile-display.webp'},{generatedPhoto:true,name:'박*연',age:25,sweetness:15,unread:0,timeLabel:"10월 11일",state:'종료',kind:'',post:'주말에 한강 산책 함께하실 분',message:'함께해서 즐거웠어요. 감사합니다!',photo:'companion-profile.webp'}];
function unreadCount(r,scene){if(scene==='read')return 0;return scene==='unread'&&r.unread>1?108:r.unread;}
function render(){const scene=document.querySelector('#scene').value;const bell=document.querySelector('.top .icon');const hasUnread=['default','unread','missing','long'].includes(scene)&&rows.some(r=>r.unread>0);bell.classList.toggle('has-unread',hasUnread);bell.setAttribute('aria-label',hasUnread?'알림, 새 알림 있음':'알림');document.querySelector('.filters').hidden=scene==='guest';document.querySelector('.top .icon').hidden=scene==='guest';document.querySelector('.filters').innerHTML=['전체','대화 중','확정','종료'].map(v=>'<button class="filter" aria-pressed="'+(filter===v)+'">'+v+'</button>').join('');let content='';if(['guest','empty','error'].includes(scene)){const texts={guest:['로그인 후 대화를 확인해요','동행과의 대화를 이어가 보세요.','로그인'],empty:['아직 대화가 없어요','마음에 드는 공고에 첫 메시지를 보내면 대화가 시작돼요.','동행 둘러보기'],error:['대화를 불러오지 못했어요','잠시 후 다시 시도해 주세요.','다시 시도']}[scene];content='<section class="empty">'+svg('chat')+'<h2>'+texts[0]+'</h2><p>'+texts[1]+'</p><button class="cta">'+texts[2]+'</button></section>';}else if(scene==='loading'){content='<div role="status" aria-label="대화를 불러오는 중">'+Array(4).fill('<div class="loading" aria-hidden="true"><i></i><span></span></div>').join('')+'</div>';}else{content=rows.filter(r=>filter==='전체'||r.state===filter).map((r,i)=>'<button class="chat-row" aria-label="'+(scene==='missing'?'탈퇴한 사용자':r.name)+' 대화방'+(unreadCount(r,scene)?', 안 읽은 메시지 '+unreadCount(r,scene)+'개':'')+'">'+(r.generatedPhoto?'<span class="avatar generated-avatar" role="img" aria-label="상대 프로필 사진" '+(scene==='missing'?'hidden':'')+'></span>':'<img class="avatar" src="../유미당-홈-소스/yumidang-home/assets/'+r.photo+'" alt="상대 프로필 사진" '+(scene==='missing'?'hidden':'')+'>')+'<span class="copy"><span class="post-heading"><p class="post">'+(scene==='missing'?'삭제된 공고':scene==='long'?'삼청동 국립현대미술관 기획전을 천천히 둘러보고 근처 카페에서 이야기 나눠요':r.post)+'</p><span class="badge '+r.kind+'">'+({confirmed:'동행 확정',active:'대화 중'}[r.kind]||'모집 종료')+'</span></span><span class="row-top"><span class="name">'+(scene==='missing'?'탈퇴한 사용자입니다.':r.name)+'</span>'+(scene==='missing'?'':'<span class="age">(만 '+r.age+'세)</span><span class="sweetness">당도 '+r.sweetness+'</span>')+'</span><span class="message-line"><p class="message">'+(scene==='long'?'전시를 모두 둘러본 뒤에 근처 카페에서 만나서 이야기 나누면 좋겠어요. 토요일에 뵙겠습니다.':r.message)+'</p><span class="message-meta"><span class="message-time">'+r.timeLabel+'</span>'+(unreadCount(r,scene)?'<span class="unread-count" aria-hidden="true">'+(unreadCount(r,scene)>99?'99+':unreadCount(r,scene))+'</span>':'')+'</span>'+'</span></span></button>').join('');}document.querySelector('#content').innerHTML=content;}
document.querySelector('#scene').addEventListener('change',render);document.querySelector('.filters').addEventListener('click',e=>{if(e.target.matches('button')){filter=e.target.textContent;render();}});render();

<script>
(()=>{
const list=document.querySelector('#content'),menu=document.querySelector('#room-actions'),confirm=document.querySelector('#room-confirm');let timer=null,press=null,selected=null,suppress=false;
const status=document.createElement('p');status.className='note';status.setAttribute('role','status');document.querySelector('.review-panel').append(status);
const clear=()=>{clearTimeout(timer);timer=null;press=null;};
function open(row){selected=row;suppress=true;menu.querySelector('h2').textContent=row.querySelector('.name').textContent;menu.showModal();const p=document.querySelector('.phone').getBoundingClientRect();menu.style.left=(p.left+p.width/2)+'px';menu.style.top=((Math.max(0,p.top)+Math.min(innerHeight,p.bottom))/2)+'px';}
list.addEventListener('pointerdown',e=>{const row=e.target.closest('.chat-row');if(!row||e.button!==0)return;clear();suppress=false;press={x:e.clientX,y:e.clientY};timer=setTimeout(()=>{clear();open(row);},500);});
list.addEventListener('pointermove',e=>{if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>10)clear();});
for(const type of ['pointerup','pointercancel'])document.addEventListener(type,clear);
list.addEventListener('scroll',clear,{passive:true});window.addEventListener('blur',clear);
list.addEventListener('click',e=>{if(suppress){e.preventDefault();e.stopImmediatePropagation();suppress=false;}},true);
list.addEventListener('contextmenu',e=>{const row=e.target.closest('.chat-row');if(row){e.preventDefault();clear();if(!menu.open)open(row);}});
list.addEventListener('keydown',e=>{if(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10')){const row=e.target.closest('.chat-row');if(row){e.preventDefault();open(row);}}});
menu.addEventListener('click',e=>{const b=e.target.closest('[data-room-action]');if(!b){if(e.target===menu)menu.close();return;}const action=b.dataset.roomAction;if(action==='알림 끄기'){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.textContent=on?'대화방 알림켜기':'대화방 알림끄기';status.textContent=selected.getAttribute('aria-label')+' · '+b.textContent+' 전환 예시입니다. 실제 알림 설정은 변경하지 않습니다.';return;}menu.close();const texts={'신고':'상황 설명과 제출 가능한 캡처를 준비해 주세요. 신고 접수 후 내용을 검토해요.','차단':'차단은 접촉을 막고 확정 약속 취소와 별개입니다. 해제해도 종료된 신청은 자동 복원되지 않습니다.','대화방 나가기':'내 목록만 숨기며 상대 목록과 대화 기록은 유지합니다.'};confirm.querySelector('h2').textContent=action;confirm.querySelector('p').textContent=texts[action];confirm.querySelector('[data-room-close]').textContent=action==='대화방 나가기'?'대화방 유지':'닫기';confirm.querySelector('[data-room-confirm]').textContent=action==='대화방 나가기'?'나가기':action;confirm.showModal();const r=document.querySelector('.phone').getBoundingClientRect();confirm.style.left=(r.left+r.width/2)+'px';confirm.style.top=((Math.max(0,r.top)+Math.min(innerHeight,r.bottom))/2)+'px';});
confirm.querySelector('[data-room-close]').onclick=()=>confirm.close();confirm.querySelector('[data-room-confirm]').onclick=()=>{status.textContent=selected.getAttribute('aria-label')+' · '+confirm.querySelector('h2').textContent+' 이벤트 연결 예시입니다. 실제 처리하지 않습니다.';confirm.close();};
for(const d of [menu,confirm])d.addEventListener('close',()=>{if(!menu.open&&!confirm.open)selected?.focus();});
})();

<script id="nav-unread-preview">
(()=>{

const control=document.createElement('input');control.type='checkbox';control.checked=true;
label.append(control,document.createTextNode(' 읽지 않은 채팅 메시지 있음'));panel.append(label);
const hint=document.createElement('p');hint.textContent='바텀바 알림 점의 표시 예시입니다. 실제 메시지 수신·읽음 상태는 Expo에서 연결합니다.';panel.append(hint);
function update(){
const guest=document.querySelector('#scene')?.value==='guest';
const allRead=document.querySelector('#scene')?.value==='read';
control.disabled=guest||allRead;
const visible=control.checked&&!guest&&!allRead;
chat.classList.toggle('has-unread',visible);
chat.setAttribute('aria-description',visible?'읽지 않은 메시지 있음':'');
}
control.addEventListener('change',update);document.addEventListener('change',update);update();
})();
</script>
</html>

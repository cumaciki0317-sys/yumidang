<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"><title>유미당 · 확정 정책과 구현 대조</title><style>
:root{--ink:#252235;--muted:#676176;--paper:#f6f4f9;--line:#ded8e8;--accent:#673eb1;--soft:#eee6fa;--warn:#7b4d00;--ok:#256550}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui,-apple-system,sans-serif}a{color:var(--accent);overflow-wrap:anywhere}header{background:#fff;border-bottom:1px solid var(--line);padding:30px max(20px,calc((100% - 1120px)/2))}h1{font-size:28px;line-height:1.35;margin:7px 0 13px}h2{font-size:21px}h3{font-size:18px;line-height:1.5;margin:3px 0 10px}p{margin:8px 0}.eyebrow{font-weight:700;color:var(--accent);font-size:13px}.sub{color:var(--muted);max-width:920px}.toolbar{max-width:1160px;margin:auto;padding:16px 20px 8px;position:sticky;top:0;background:var(--paper);z-index:2;border-bottom:1px solid var(--line)}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}button,select,input{font:inherit}button,select{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b694ee;outline-offset:2px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:9px}.filters select{max-width:100%}main{max-width:1160px;margin:0 auto;padding:18px 20px 60px}.count{color:var(--muted);font-size:14px;margin:0 0 14px}.cards{display:grid;gap:14px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;overflow-wrap:anywhere}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.pill{background:var(--soft);color:#54368e;border-radius:6px;padding:2px 8px;font-size:12px}.warn{background:#fff1d2;color:var(--warn)}.good{background:#e1f1e8;color:var(--ok)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:10px}.callout{border-left:4px solid var(--accent);padding:12px 15px;background:#f4effb;border-radius:5px;margin:12px 0}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.fact{padding:18px;background:white;border:1px solid var(--line);border-radius:12px}.fact strong{display:block;font-size:28px;color:var(--accent)}ul,ol{padding-left:22px}li{margin:4px 0}details{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}summary{cursor:pointer;color:var(--accent)}.option{display:block;padding:13px;margin:9px 0;border:1px solid var(--line);border-radius:9px;cursor:pointer}.option:has(input:checked){background:var(--soft);border-color:var(--accent)}textarea{width:100%;min-height:100px;padding:12px;font:inherit;border:1px solid var(--line);border-radius:8px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.small{font-size:13px;color:var(--muted)}code{font-size:13px;background:#f1eef5;padding:2px 4px;border-radius:4px}pre{white-space:pre-wrap;font:13px/1.6 system-ui}.empty{padding:30px;background:white;border:1px dashed var(--line);border-radius:12px}@media(max-width:700px){header{padding:22px 18px}h1{font-size:23px}.toolbar{position:static}.cols{grid-template-columns:1fr;gap:0}.facts{grid-template-columns:1fr 1fr}.card{padding:16px}main{padding:16px 12px}nav{gap:5px}nav button{padding:7px 9px;font-size:13px}}
</style></head><body><aside aria-label="감사 기록 적용 범위" style="padding:16px 24px;background:#fff1d2;color:#573a00"><strong>통합 전 감사 기록</strong> — 이 화면의 원장·소스 참조·PASS는 종현 브랜치 당시 범위입니다. 현재 main 전체 검증이나 최신 정책을 대신하지 않습니다. 일반 신고 대체 담당 종현 등 현재 결정은 <a href="../../../../../정책.md">정책.md</a>, 이번 문서 검증은 <a href="../2026-10-20-main-policy-sync/README.md">main 정책 동기화 기록</a>을 확인하세요.</aside><header><span class="eyebrow">유미당 / WBS 1.1 · 1.2 · 1.3 · 1.4 · 6.1</span><h1>확정 정책은 어디까지 구현됐을까요?</h1><p class="sub">현재 정책 · 실제 코드 · 기존 검증 · 남은 작업을 연결했습니다. 정책이 정해진 것, 화면에서 보이는 것, 서버와 기기에서 검증된 것은 서로 다른 상태입니다.</p><p class="small" id="baseline"></p></header><div class="toolbar"><nav aria-label="검토 영역" id="tabs"></nav><div class="filters"><input id="search" aria-label="항목 검색" placeholder="예: 선택 동의, 직접 입력, 읽음, P025"><select id="owner" aria-label="담당 필터"><option value="">모든 담당</option><option>jonghyun</option><option>minkyu</option><option>yumi</option><option>공통</option></select><select id="kind" aria-label="상태 필터"><option value="">모든 상태</option><option>일치</option><option>부분 구현</option><option>미구현</option><option>연동 대기</option><option>확인 불가</option><option>제외/보류</option><option>NOT_RUN</option><option>HOLD</option></select></div></div><main><p class="count" id="count" aria-live="polite"></p><section id="content"></section></main><script id="audit-data" type="application/json">__AUDIT_DATA__</script><script id="saved-answers" type="application/json">null</script><script>
const model=JSON.parse(document.getElementById('audit-data').textContent),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='overview',answers={};const storageKey='yumidang-policy-audit-'+model.fingerprint;
try{const embedded=JSON.parse($('saved-answers').textContent);const local=JSON.parse(localStorage.getItem(storageKey)||'null');const saved=embedded||local;if(saved&&saved.fingerprint===model.fingerprint)answers=saved.answers||{};}catch{}
const tabs=[['overview','먼저 보기'],['groups','구현 차이'],['units','전체 정책'],['gates','출시 조건'],['cases','QA 설계'],['decisions','결정 근거'],['documents','문서 동기화'],['questions','마지막 질문']];
$('baseline').textContent=model.date+' 기준 · 코드 '+model.baseline.slice(0,7)+' · 실제 서버·회원·기기·운영 검증을 새로 실행한 결과가 아닙니다.';
function ref(r){const p=typeof r==='string'?r:r.path;return '<li><a href="../../../../../'+esc(p)+'">'+esc(p)+'</a>'+((r.note)?' — '+esc(r.note):'')+'</li>';}
function refs(arr){return arr?.length?'<ul>'+arr.map(ref).join('')+'</ul>':'<p class="small">연결된 기존 증거 없음 · 새 검증 필요</p>';}
function list(a){return a?.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';}
function pill(s,cls=''){return '<span class="pill '+cls+'">'+esc(s)+'</span>';}
function group(x){return '<article class="card" id="'+esc(x.id)+'"><div class="meta">'+pill(x.id)+pill(x.classification,x.classification==='일치'?'good':'warn')+pill(x.owner)+pill((x.wbs||[]).join(' · '))+'</div><h3>'+esc(x.title)+'</h3><div class="cols"><div><span class="label">확정 정책</span><p>'+esc(x.policy_summary)+'</p></div><div><span class="label">실제 소스에서 확인한 내용</span><p>'+esc(x.actual)+'</p></div></div><span class="label">다음 작업</span><p>'+esc(x.next_action)+'</p><span class="label">해결 후 확인 기준</span><p>'+esc(x.acceptance)+'</p><details><summary>정책 항목과 구현·기존 검증 근거</summary><p>'+esc((x.policy_ids||[]).join(' · '))+'</p>'+refs(x.source_refs)+refs(x.evidence_refs)+'</details></article>';}
function unit(x){return '<article class="card"><div class="meta">'+pill(x.id)+pill(x.section)+'</div><p>'+esc(x.text)+'</p><span class="label">연결된 대조·검증</span><p>'+esc((x.group_ids||[]).join(' · ')||'해당 영역 직접 실행 경로 없음 — 정책/운영 조건으로 관리')+'</p><p class="small">QA: '+esc((x.case_ids||[]).join(' · ')||'관련 출시 조건의 증빙 점검으로 확인')+'</p></article>';}
function gate(x){return '<article class="card"><div class="meta">'+pill(x.id)+pill(x.scope)+pill(x.current_status,'warn')+pill(x.owner)+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.requirement)+'</p><span class="label">필요한 증거</span>'+list(x.required_evidence)+'<span class="label">남은 조건</span><p>'+esc(x.missing)+'</p><p class="small">'+esc(x.agreement)+'</p><details><summary>기존 근거와 적용 범위</summary>'+refs(x.existing_evidence)+'</details></article>';}
function tc(x){return '<article class="card"><div class="meta">'+pill(x.id)+pill(x.gate_id)+pill(x.environment)+pill(x.result,'warn')+pill(x.owner)+'</div><h3>'+esc(x.title)+'</h3><p class="small">역할: '+esc(x.actor)+'</p><div class="cols"><div><span class="label">사전 조건</span>'+list(x.preconditions)+'<span class="label">실행 순서</span>'+list(x.steps)+'</div><div><span class="label">기대 결과</span>'+list(x.expected)+'<span class="label">일어나면 안 되는 일</span>'+list(x.forbidden)+'</div></div><details><summary>증빙·정리 방법과 기존 검사</summary>'+list(x.evidence_required)+'<p>'+esc(x.cleanup)+'</p>'+refs(x.existing_evidence)+'</details></article>';}
function decision(x){return '<article class="card"><div class="meta">'+pill(x.original_id||x.id)+pill(x.status)+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.current_decision||x.policy_at_time||'후속 사용자 결정과 현재 정책을 함께 적용합니다.')+'</p>'+(x.original_choice?'<p class="small">당시 선택: '+esc(x.original_choice)+'</p>':'')+(x.original_user_text?'<span class="label">사용자 원문</span><pre>'+esc(x.original_user_text)+'</pre>':'')+(x.original_note?'<p>'+esc(x.original_note)+'</p>':'')+refs([{path:x.source,note:'원본 선택·후속 결정 근거. 현재 기준은 정책 원장 우선.'}])+'</article>';}
function documentRow(x){return '<article class="card"><div class="meta">'+pill(x.kind||x.status)+pill(x.owner||'문서')+'</div><h3>'+esc(x.path)+'</h3><p>'+esc(x.reason||x.note||'현재 정책·역사 기록 경계를 대조했습니다.')+'</p>'+(x.topics?.length?'<p class="small">'+esc(x.topics.join(' · '))+'</p>':'')+'</article>';}
function q(x){const a=answers[x.id]||{};return '<article class="card"><div class="meta">'+pill(x.id)+pill(a.choice?'작성됨':'미선택',a.choice?'good':'warn')+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.context)+'</p><div class="callout"><strong>예시</strong><p>'+esc(x.example)+'</p></div>'+(x.options||[]).map((o,i)=>{const title=typeof o==='string'?o:(o.title||o.label||o.text), detail=typeof o==='string'?'':o.detail;return '<label class="option"><input type="radio" name="'+esc(x.id)+'" value="'+String.fromCharCode(65+i)+'" '+(a.choice===String.fromCharCode(65+i)?'checked':'')+'> <strong>'+String.fromCharCode(65+i)+'. '+esc(title)+(i===0?' · 추천':'')+'</strong>'+ (detail?'<p>'+esc(detail)+'</p>':'')+'</label>';}).join('')+'<label class="option"><input type="radio" name="'+esc(x.id)+'" value="other" '+(a.choice==='other'?'checked':'')+'> D. 기타 — 직접 작성</label><textarea data-question="'+esc(x.id)+'" aria-label="'+esc(x.title)+' 기타 의견">'+esc(a.other||'')+'</textarea><p class="small">추천 이유: '+esc(x.recommendation)+'</p></article>';}
function overview(){return '<div class="facts"><div class="fact"><strong>'+model.units.length+'</strong>원문 정책 대조 항목</div><div class="fact"><strong>'+model.groups.length+'</strong>클라이언트·서버 대조 묶음</div><div class="fact"><strong>'+model.cases.length+'</strong>후속 QA 설계 사례</div><div class="fact"><strong>'+model.questions.length+'</strong>새 정책 선택 질문</div></div><article class="card" style="margin-top:16px"><h2>이번 검토에서 구분한 것</h2><p>정책 전체를 읽어 현재 포함·제외·보류 범위와 구현 차이를 연결했습니다. 실제 서버·DB 운영 상태나 회원·기기 검증은 별도 확인이 필요합니다.</p><div class="callout">가입 AI 선택 동의, 직접 입력 행사 서버 저장, KOPIS14분류·공식 대조 같은 확정 정책의 미구현은 다시 선택할 질문으로 돌리지 않습니다. 구현 담당과 완료 조건을 연결합니다.</div>'+list(model.summary||[])+'<p><a href="README.md">인수인계 Markdown</a> · <a href="audit.json">전체 원장 JSON</a> · <a href="../../../../../정책.md">현재 정책.md</a></p></article>';}
function render(){for(const [id,title]of tabs){const b=document.querySelector('[data-tab="'+id+'"]');b.setAttribute('aria-pressed',String(id===tab));}const data={groups:model.groups,units:model.units,gates:model.gates,cases:model.cases,decisions:model.decisions,documents:model.documents,questions:model.questions};let rows=data[tab]||[];const query=$('search').value.trim().toLowerCase(),owner=$('owner').value,kind=$('kind').value;rows=rows.filter(x=>(!query||JSON.stringify(x).toLowerCase().includes(query))&&(!owner||JSON.stringify(x.owner||'').includes(owner))&&(!kind||JSON.stringify(x).includes(kind)));$('count').textContent=tab==='overview'?'현재 기준과 남은 조건을 먼저 확인하세요.':rows.length+'개 항목 표시';if(tab==='overview'){$('content').innerHTML=overview();return;}const draw={groups:group,units:unit,gates:gate,cases:tc,decisions:decision,documents:documentRow,questions:q}[tab];let header=tab==='questions'?'<div class="actions"><button id="save-json">답변 JSON 저장</button><button id="save-html">작성본 HTML 저장</button></div><p class="small">선택은 이 브라우저에 보관되며 외부로 전송되지 않습니다. 자동 적용·승인이 아닙니다.</p>':'';$('content').innerHTML=header+(rows.length?'<div class="cards">'+rows.map(draw).join('')+'</div>':'<p class="empty">'+(tab==='questions'&&model.questions.length===0?'새로 선택할 정책 충돌은 없습니다. 구현·외부 확인 후속은 구현 차이와 출시 조건에서 확인할 수 있습니다.':'조건에 맞는 항목이 없습니다. 검색·필터를 초기화해 주세요.')+'</p>');if(tab==='questions'){$('save-json').onclick=()=>download('유미당_정책구현_답변.json',JSON.stringify({fingerprint:model.fingerprint,answers,savedAt:new Date().toISOString()},null,2),'application/json');$('save-html').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#saved-answers').textContent=JSON.stringify({fingerprint:model.fingerprint,answers,savedAt:new Date().toISOString()}).replace(/</g,'\u003c');download('유미당_정책구현_작성본.html','<!doctype html>'+clone.outerHTML,'text/html');};}}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({fingerprint:model.fingerprint,answers}));}catch{}}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('tabs').innerHTML=tabs.map(([id,title])=>'<button data-tab="'+id+'" aria-pressed="false">'+title+'</button>').join('');$('tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render();}};for(const id of ['search','owner','kind'])$(id).oninput=render;$('content').onchange=e=>{if(e.target.type==='radio'){const id=e.target.name;answers[id]={...(answers[id]||{}),choice:e.target.value,updatedAt:new Date().toISOString()};persist();}};$('content').oninput=e=>{const id=e.target.dataset.question;if(id){answers[id]={...(answers[id]||{}),other:e.target.value,updatedAt:new Date().toISOString()};persist();}};render();
</script></body></html>

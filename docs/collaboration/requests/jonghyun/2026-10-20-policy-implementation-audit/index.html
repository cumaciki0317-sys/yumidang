_ids":["C47","B45"],"case_ids":["TC007","TC057","TC069"],"gate_ids":["G24"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P261","chapter":"10","section":"10. 알림·안심 수칙","line":371,"text":"안심 수칙은 공공장소 첫 만남, 강요 금지, 금전·민감정보 요구 주의, 일정·귀가 공유, 위급 시 도움 요청을 포함한다.","group_ids":["C47","B46"],"case_ids":["TC057"],"gate_ids":["G24"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P262","chapter":"11","section":"11. 외부 연동과 구현 경계","line":375,"text":"| 연동 | 목적 | 현재 상태 |","group_ids":["B46"],"case_ids":[],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"상위 출시 조건의 자료·범위 점검으로 연결; 독립 실행 통과를 뜻하지 않음"},{"id":"P263","chapter":"11","section":"11. 외부 연동과 구현 경계","line":377,"text":"| 네이버 | 로그인·성인/본인 정보 | 화면 예시, 실제 OAuth·필수 정보 수신 검증 필요 |","group_ids":["C48","B46"],"case_ids":[],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"상위 출시 조건의 자료·범위 점검으로 연결; 독립 실행 통과를 뜻하지 않음"},{"id":"P264","chapter":"11","section":"11. 외부 연동과 구현 경계","line":378,"text":"| Kakao Local·우편번호 | 장소명·주소 검색 | 화면 예시, 실제 키·검색 결과·실패 처리 검증 필요 |","group_ids":["C48","B46"],"case_ids":["TC010"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P265","chapter":"11","section":"11. 외부 연동과 구현 경계","line":379,"text":"| KOPIS·TourAPI·서울 열린데이터 | 행사·공식 순위 | 출시 시 실제 연동 목표. 현재 연결 성공은 별도 확인하며 제공처의 실제 유형·데이터 범위만 노출 |","group_ids":["C48","B46"],"case_ids":["TC044"],"gate_ids":["G19"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P266","chapter":"11","section":"11. 외부 연동과 구현 경계","line":380,"text":"| AI 모델 제공사 | 동행·행사 추천, 후기 요약 | 화면 예시, 외부 전송·보관·비용·품질 승인 필요 |","group_ids":["C48","B46"],"case_ids":[],"gate_ids":["G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"상위 출시 조건의 자료·범위 점검으로 연결; 독립 실행 통과를 뜻하지 않음"},{"id":"P267","chapter":"11","section":"11. 외부 연동과 구현 경계","line":381,"text":"| IndexedDB | 프로필 사진 미리보기·보존 | 프로토타입 구현, 실서비스 업로드·보안 검증 필요 |","group_ids":["C48","B46"],"case_ids":["TC003"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P268","chapter":"12","section":"12. 현재 화면에서 제외된 범위","line":387,"text":"학교·직장 이메일 인증","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 제외","qa_note":"직접 사례에 연결"},{"id":"P269","chapter":"12","section":"12. 현재 화면에서 제외된 범위","line":388,"text":"1원 계좌 인증","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 제외","qa_note":"직접 사례에 연결"},{"id":"P270","chapter":"12","section":"12. 현재 화면에서 제외된 범위","line":389,"text":"유료 동행, 결제·정산·수수료·환불·취소 보상","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 제외","qa_note":"직접 사례에 연결"},{"id":"P271","chapter":"12","section":"12. 현재 화면에서 제외된 범위","line":390,"text":"관심 친구·초대·알림 설정","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 제외","qa_note":"직접 사례에 연결"},{"id":"P272","chapter":"12","section":"12. 현재 화면에서 제외된 범위","line":391,"text":"관리자 행사 수동 등록·중복 관리 화면","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 제외","qa_note":"직접 사례에 연결"},{"id":"P273","chapter":"12","section":"12. 현재 화면에서 제외된 범위","line":392,"text":"안심 통화·외부 캘린더 연동. 작성용 날짜 선택 달력과 연결 행사 진행일 강조는 현재 범위다","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 제외","qa_note":"직접 사례에 연결"},{"id":"P274","chapter":"13","section":"13. 보관·삭제·고객지원","line":402,"text":"| 프로필·사진 | 탈퇴 처리 때 즉시 비공개·접근 회수와 활성 저장소 삭제 완료. 7일 유예 없음 |","group_ids":["C49","B47"],"case_ids":["TC058","TC060"],"gate_ids":["G25","G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P275","chapter":"13","section":"13. 보관·삭제·고객지원","line":403,"text":"| 탈퇴 공고 | 공개 목록에서 숨기고 작성자 영역을 `탈퇴한 사용자입니다.`로 표시. 기존 당사자용 일반 본문은 탈퇴 시점부터 1년, 사진·연락처·비공개 상세 위치 등 식별정보는 삭제·가림 |","group_ids":["C49","B47"],"case_ids":["TC058","TC060"],"gate_ids":["G25","G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P276","chapter":"13","section":"13. 보관·삭제·고객지원","line":404,"text":"| 채팅 | 마지막 활동·관련 절차 종료 중 늦은 시점부터 1년. 상대방의 읽기 권한은 이 기간 내 유지하고 종료 시 삭제 |","group_ids":["C49","B47"],"case_ids":["TC058","TC060"],"gate_ids":["G25","G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P277","chapter":"13","section":"13. 보관·삭제·고객지원","line":406,"text":"| 신고자의 본인 화면 숨김 최소 기록 | 신고 자료 삭제와 분리해 본인이 숨김을 해제할 때까지 유지. 숨김에 필요한 최소 식별 기록만 보관하고 설명·캡처·증거는 포함하지 않음 |","group_ids":["C21","B47"],"case_ids":["TC021","TC060"],"gate_ids":["G09","G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P278","chapter":"13","section":"13. 보관·삭제·고객지원","line":407,"text":"| 종료 제재의 상세 기록·증거 | 제재 종료·이의 종결 중 늦은 시점부터 90일 후 삭제 |","group_ids":["C49","B47"],"case_ids":["TC060"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P279","chapter":"13","section":"13. 보관·삭제·고객지원","line":408,"text":"| 제재·경고·연속취소 최소 연결 기록 | 유효한 동일 네이버 계정의 경고·연속취소·기간제/영구 제재 승계 목적이 유지되는 동안 최소 연결 기록을 유지하며 자동 고정 만료를 두지 않음. 최종 무효 또는 승계 상태의 확정 종료 시 불필요한 연결 기록 제거. 연 1회 필요성·접근권한 점검, 단순 점검·탈퇴·기간 경과로 유효 영구 제재 자동 해제 금지. 상세 증거 90일과 구분하며 보관 근거 확인 후 시행 |","group_ids":["C49","B47"],"case_ids":["TC059","TC060","TC061"],"gate_ids":["G25","G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P280","chapter":"13","section":"13. 보관·삭제·고객지원","line":409,"text":"| 네이버 가입 정보 | 이름·성별·생일·출생연도 구조화 저장, 네이버 응답 원문은 저장하지 않음 |","group_ids":["C49","B47"],"case_ids":["TC002","TC060"],"gate_ids":["G02","G25","G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P281","chapter":"13","section":"13. 보관·삭제·고객지원","line":410,"text":"| 진단·보안 기록 | 원문·비밀값을 제외한 일반 진단 30일, 보안 90일 |","group_ids":["C49","B48"],"case_ids":["TC060"],"gate_ids":["G22","G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P282","chapter":"13","section":"13. 보관·삭제·고객지원","line":411,"text":"| 작업 처리 세부 내역 | 작업 종료 후 30일. 중복방지 최소키는 재요청 가능기간에 맞춘 별도 삭제 조건을 개발 검증 |","group_ids":["C49","B48"],"case_ids":["TC060"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P283","chapter":"13","section":"13. 보관·삭제·고객지원","line":412,"text":"| AI 비용·사용량 원장 | 공급사 한도 기간 종료 후 90일. 미정산 건은 해결할 때까지 접근을 제한해 별도 보관 |","group_ids":["C49","B48"],"case_ids":["TC060"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P284","chapter":"13","section":"13. 보관·삭제·고객지원","line":414,"text":"삭제된 자료를 새 백업에 넣지 않는다. 기존 백업의 실제 만료·파기 조건은 제공처에서 확인해 안내하고, 백업 복구 시 삭제 처리를 다시 적용한다. 활성 자료 삭제만으로 기존 백업까지 즉시 삭제됐다고 안내하지 않는다.","group_ids":["C49","B48"],"case_ids":["TC060","TC063"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P285","chapter":"13","section":"13. 보관·삭제·고객지원","line":415,"text":"신고 증거·제재 최소 기록의 책임 열람자는 대표 유미(조유미)이며 허용된 제출 증거에만 접근하고 접근 기록을 남긴다. 추가·대체 담당은 지정·승인 전 접근하지 않는다. 이름·사진·신고 캡처·채팅 원문을 최소 연결 기록에 포함하지 않으며 최종 무효 판정의 제재 기여는 즉시 제거한다. 필요한 무효·정정 감사 기록은 별도 기준을 따른다. 기술 운영 민규의 역할 배정은 회원 DB 채팅 원문 열람 허용을 뜻하지 않는다.","group_ids":["C49","B49"],"case_ids":["TC061"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P286","chapter":"13","section":"13. 보관·삭제·고객지원","line":416,"text":"개인정보 문의·일반 지원은 서비스명 유미당, 실제 개인 운영자·책임자 대표 조유미(유미), 공개 메일 `cumaciki0317@gmail.com`, 운영시간 한국시간 평일 09~18시로 안내한다. 현재 별도 등록 사업자는 없으며 브랜드와 개인 운영 주체를 구분한다. 일반 신고 실무·허용 증거 접근·AI 비용 관리 책임자는 유미, 기술 서버 운영은 민규다. 별도 대체자는 지정되지 않았으며 실제 메일 처리·권한 설정·공개 방침 게시를 검증한다.","group_ids":["C49","B49"],"case_ids":["TC061","TC062"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P287","chapter":"13","section":"13. 보관·삭제·고객지원","line":417,"text":"앱 내 탈퇴 경로와 함께 공개 개인정보처리방침 페이지에 눈에 잘 띄는 삭제 요청 구역을 두고 그 구역으로 직접 연결한다. 앱·운영자명, 삭제 범위·보관 항목·본인 확인 절차와 `cumaciki0317@gmail.com` 접수를 안내한다. 앱을 지운 회원도 재설치 없이 메일로 요청할 수 있어야 한다. 운영자명과 아래 삭제 요청 시간 목표를 게시하고 실제 메일 처리 체계를 검증한다. 전체 웹 서비스를 먼저 만들 필요는 없다. [Google Play 계정 삭제 요건](https://support.google.com/googleplay/android-developer/answer/13327111?hl=en-EN)","group_ids":["C49","B49"],"case_ids":["TC062"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P288","chapter":"13","section":"13. 보관·삭제·고객지원","line":418,"text":"수동 메일 삭제 요청의 첫 답변 목표는 도착 다음 영업일부터 계산해 2영업일째 18시까지다. 접수 확인·필요한 최소 본인 확인 방법·예상 일정을 안내하며 첫 답변을 삭제 완료로 표시하지 않는다.","group_ids":["C49","B49"],"case_ids":["TC062"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P289","chapter":"13","section":"13. 보관·삭제·고객지원","line":419,"text":"본인 확인이 완료된 수동 삭제 요청은 확인 완료 다음 영업일부터 계산해 3영업일째 18시까지 처리·결과를 안내하는 목표다. 영업일은 한국시간 평일이며 토·일·대한민국 공휴일을 제외한다. 이 계산은 메일 삭제 요청 목표이며 기존 일반 신고의 영업일 계산을 임의로 변경하지 않는다.","group_ids":["C49","B49"],"case_ids":["TC062"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P290","chapter":"13","section":"13. 보관·삭제·고객지원","line":420,"text":"위 목표는 법정 기한·현재 보장 중인 서비스 수준·활성 자료 삭제 유예가 아니다. 탈퇴 처리가 실행되면 프로필·사진 활성본은 즉시 삭제한다. 진행 중 확정 동행·별도 보관·백업 만료·외부 사본 삭제 미확인은 이유·남은 범위·다음 안내일을 구분하고 목표 내 완료가 어려우면 기한 전에 지연과 새 예정일을 안내한다.","group_ids":["C49","B49"],"case_ids":["TC062"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P291","chapter":"13","section":"13. 보관·삭제·고객지원","line":421,"text":"네이버 단독 로그인은 iOS 공식 요구와 예외를 먼저 확인한다. 충돌하면 iOS 출시를 보류한 채 대안을 설계하며 다른 로그인 수단을 임의로 추가하지 않는다.","group_ids":["C49","B50"],"case_ids":["TC067"],"gate_ids":["G28"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P292","chapter":"13","section":"13. 보관·삭제·고객지원","line":422,"text":"후기 요약의 가입 시 선택하는 세 동의와 AI 탐색 첫 사용 동의는 제품 선택이며 적합성 검토를 대신하지 않는다. 개인정보 동의 항목 구분과 선택 사항 거부에 따른 서비스 제한, 동의 철회 권리·법정 예외를 함께 검토한다. 예외 해당 여부 없이 일괄 철회 불가를 시행하지 않는다. [개인정보 보호법 제22조](https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1006184067), [제37조](https://www.law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033216383)","group_ids":["C49","B50"],"case_ids":["TC005"],"gate_ids":["G03"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P293","chapter":"13","section":"13. 보관·삭제·고객지원","line":427,"text":"개인정보처리방침에는 실제 운영 주체, 수집 항목·목적·근거, 네이버·외부 공급사와의 관계, 보관·파기·백업, 안전조치, 동의 철회·열람·정정·삭제 요청과 문의 경로를 실제 설계에 맞춰 기재한다. 문서 작성만으로 삭제·철회·외부 계약 이행이 완료됐다고 판단하지 않는다.","group_ids":["C49","B50"],"case_ids":["TC063","TC067"],"gate_ids":["G26"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P294","chapter":"13","section":"13. 보관·삭제·고객지원","line":428,"text":"제출 시점의 Google Play·Apple 공식 정책과 제출 양식에서 로그인 예외, 사용자 콘텐츠의 신고·차단, 계정 삭제, AI 콘텐츠 조건을 확인한다. 앱 소개·스크린샷·카테고리·연령등급·개인정보 및 AI 공개 답변은 실제 기능과 일치시킨다. 여성·만 19세 이상 가입 조건을 스토어의 공식 연령등급과 동일시하거나 신원·안전을 보증한다고 안내하지 않는다.","group_ids":["C49","B50"],"case_ids":["TC067"],"gate_ids":["G28"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P295","chapter":"13","section":"13. 보관·삭제·고객지원","line":429,"text":"출시 수용 기준은 PRD의 출시 전 필수 검증에 정리하고 실제 증거는 기존 배포·복구 체크리스트에 연결한다. IA·USERFLOW에는 실제 화면 진입·상태만 연결하며 체크리스트의 과거 기록을 현재 완료 근거로 대신하지 않는다.","group_ids":["C49","B50"],"case_ids":["TC067","TC070"],"gate_ids":["G28"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P296","chapter":"13","section":"13. 보관·삭제·고객지원","line":430,"text":"실제 환경에서 공개 권한·신고·차단·탈퇴·제재·후기·요약을 검증하고, 외부 삭제 구역의 직접 링크·메일 접수·본인 확인·처리 결과 안내를 확인한다. 위 항목은 제출 전 확인 과제이며 정책 확정이나 로컬 시안 검사만으로 스토어 승인·운영 준비 완료로 처리하지 않는다.","group_ids":["C49","B50"],"case_ids":["TC063","TC067","TC070"],"gate_ids":["G26","G28"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P297","chapter":"14","section":"14. 작업 실행·AI 비용 관리의 선택값","line":436,"text":"행사 수집과 후기 요약은 매일 한국시간 00:01에 등록한 뒤 분리 실행하고 실패 영역만 재시도한다. 자동 완료·후기 공개는 이 배치를 기다리지 않는다.","group_ids":["C50","B51"],"case_ids":["TC045","TC064"],"gate_ids":["G19","G27"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P298","chapter":"14","section":"14. 작업 실행·AI 비용 관리의 선택값","line":437,"text":"요약 작업의 실제 실패는 최대 3회, 재시도 간격은 10분부터 늘려 최대 6시간이다. 예산 부족은 실패로 세지 않고 1시간 뒤 확인한다.","group_ids":["C50","B51"],"case_ids":["TC064"],"gate_ids":["G27"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P299","chapter":"14","section":"14. 작업 실행·AI 비용 관리의 선택값","line":438,"text":"요약 실행은 최대 10작업·60초, 점유 시간 180초, 입력 12,000자·후기 20개씩, 중간 요약 4개 병합, 단계당 최대 3호출·출력 800토큰이다. 모든 적격 근거를 분할 처리하며 일부만 처리한 것을 전체 요약으로 표시하지 않는다.","group_ids":["C50","B51"],"case_ids":["TC064"],"gate_ids":["G27"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P300","chapter":"14","section":"14. 작업 실행·AI 비용 관리의 선택값","line":439,"text":"탐색 해석은 출력 800토큰, 성향 비교는 5후보씩 최대 3호출·호출당 출력 600토큰이다. 합성 검증 예산 50,000은 기술 원장 단위이며 원화나 공급사 포함량으로 환산하지 않는다. 충분하지 않으면 중단하며 합성 10회를 보장하지 않는다.","group_ids":["C50","B52"],"case_ids":["TC055","TC056","TC064"],"gate_ids":["G23","G27"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P301","chapter":"14","section":"14. 작업 실행·AI 비용 관리의 선택값","line":440,"text":"공급사 한도 초기화 주기에 맞춰 비용을 계산하되 미정산 예약을 지우지 않는다. 불일치는 운영 알림과 공급사 기록 대조로 처리하고 자동 환불·한도 초기화를 하지 않는다. 비용 책임자 유미와 기술 운영 민규만 역할에 필요한 범위에서 원장을 열람하고 접근·변경을 기록한다.","group_ids":["C50","B52"],"case_ids":["TC055"],"gate_ids":["G23","G27"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P302","chapter":"14","section":"14. 작업 실행·AI 비용 관리의 선택값","line":441,"text":"장소는 10개/쪽, 행사 요청은 31일 구간·100건/쪽·최대 5쪽·쪽당 15초다. 일일 요약 실행 호출은 최대 1회·75초, 내부 정리는 20건, 동시 작업 실행기는 1개·점유 자동 연장은 없다. 부족한 작업은 보존해 재개한다.","group_ids":["C50","B52"],"case_ids":["TC045","TC065"],"gate_ids":["G19","G27"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P303","chapter":"14","section":"14. 작업 실행·AI 비용 관리의 선택값","line":442,"text":"네이버 로그인 요청은 10분, 일반 외부 요청은 15초, 일반 JSON 본문은 64KiB, 자동 완료 재접속은 5초·DB 쿼리는 10초다. 사진 업로드는 일반 JSON 상한과 구분한다.","group_ids":["C50","B52"],"case_ids":["TC045","TC065"],"gate_ids":["G19","G27"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P304","chapter":"14","section":"14. 작업 실행·AI 비용 관리의 선택값","line":443,"text":"모델 출력 상한이 실제 공급사 요청에 전달되어 강제되는지, 계정 한도·호스팅 시간 제한과 위 값이 맞는지는 구현 전에 검증한다. 현재 코드가 이미 이 기준을 만족한다고 보고하지 않는다.","group_ids":["C50","B52"],"case_ids":["TC056"],"gate_ids":["G23","G27"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P305","chapter":"14","section":"14. 작업 실행·AI 비용 관리의 선택값","line":445,"text":"다계정 원자 예산을 사용하는 프로토타입에서도 기존 내부 모델 호출 수 제한·회원 하루20회·포텐스닷 계정별320만 기술 토큰/전체 상한을 함께 검사한다. 이 수치는 Gemini 월 원화 지출 한도가 아니며 공급사·계정 전환을 이유로 한도·총예산을 늘리거나 우회하지 않는다.","group_ids":["C50","B52"],"case_ids":["TC055"],"gate_ids":["G23","G27"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P306","chapter":"14","section":"14. 작업 실행·AI 비용 관리의 선택값","line":446,"text":"실행기 최대20은 같은 전역 실행의 고유 큐 작업 ID20개다. 같은 작업 재조회·첨부 처리·완료 기록은 추가 차감하지 않으며, terminal 유지관리는 기존 별도 한도를 유지한다. DB·Storage 호출 합계20회를 의미하지 않는다. 작업의 복수 첨부를 별도 작업으로 임의 계산하지 않는다. 종류별 배정과 재시작은 같은 전역 점유·작업 원장을 사용하며 자동 연장이나 토큰 재취득으로 상한을 우회하지 않는다. 호출 수는 별도 기술 제한으로 관리하되 새 숫자를 임의 정책으로 확정하지 않는다.","group_ids":["C50","B53"],"case_ids":["TC065"],"gate_ids":["G27"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"}],"groups":[{"id":"C01","title":"현재 무료 MVP와 제외 기능","policy_ids":["P014","P015","P016","P017","P018","P019","P268","P269","P270","P271","P272","P273"],"policy_summary":"여성 성인 회원을 위한 무료 1:1 동행 서비스다. 결제, 계좌·이메일 인증, 친구, 외부 캘린더, 관리자 행사 등록은 현재 범위에서 제외한다.","actual":"새 공고는 costType=free, amount=0으로 전송한다. 다만 서비스 응답 검사기는 과거 유료 유형인 paid_request와 paid_offer도 허용하므로 코드 전체에서 유료 유형이 제거된 상태는 아니다. 외부 캘린더를 제공하지 않는 것과 작성용 날짜 달력이 아직 없는 것은 별개의 항목이다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/BrowseScreens.tsx","line":2211,"note":"신규 공고 무료 전송"},{"path":"apps/mobile/src/service.ts","line":1253,"note":"과거 DTO 허용 경계"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서비스 목록·상세와 서버에서 유료 데이터가 노출되지 않는지 확인한다. 제외한 기능으로 이동하거나 실행할 수 있는 경로도 함께 검사한다.","acceptance":"무료 공고의 생성·조회만 제공한다. 현재 제외한 기능을 실행할 수 있는 진입점이 없어야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C02","title":"네이버 인증·자격·목적지 복귀","policy_ids":["P020","P021","P022","P023","P024","P025","P026","P027"],"policy_summary":"네이버 로그인만 사용한다. 필수 정보가 누락되거나 여성·성인 자격을 충족하지 않으면 가입을 보류한다. 네이버 계정 하나에 유미당 계정 하나만 연결하고, 로그인 전 목적 화면으로 복귀한다.","actual":"웹 로그인과 인증 후 복귀를 연결하는 포트, NAVER_INFORMATION_REQUIRED 안내가 있다. RootLayout은 신뢰할 호스트 설정이 있을 때만 인증을 연결한다. 이번 소스 감사에서는 실제 네이버 계정의 자격 충족·미충족이나 신규·기존 회원의 복귀를 실행하지 않았다. 네이티브 앱의 인증 포트도 별도다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/screens/AuthAiScreens.tsx","line":308,"note":"서비스 로그인"},{"path":"apps/mobile/src/screens/AuthAiScreens.tsx","line":337,"note":"콜백"},{"path":"apps/mobile/src/app/_layout.tsx","line":83,"note":"호스트 포트 설치"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"승인된 웹·네이티브 설정을 받은 뒤 필수 정보 누락, 미성년, 신규·기존 회원, 로그인 취소 사례의 복귀 동작을 대조한다.","acceptance":"실제 인증 결과와 서버의 가입 자격 판정이 일치해야 한다. 잘못된 복귀 경로와 가입 미완료 계정의 공고 작성은 차단해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C03","title":"사진 필수·가입 완료·사진 업로드","policy_ids":["P028","P029","P033"],"policy_summary":"10MB 이하의 JPG·JPEG·PNG 프로필 사진이 필수다. 사진 선택만으로 가입되지 않는다. 가입 완료 안내 팝업을 확인하면 현재 접근 가능한 보존 목적 화면으로 복귀한다. 행사 연결 작성도 여기에 포함하며, 복귀할 수 없으면 홈으로 이동한다.","actual":"프리뷰는 사진 검사와 가입 완료 팝업을 제공하지만 확인 뒤 S00 홈으로 고정 이동하여 보존한 목적 화면으로 복귀하는 예외가 빠져 있다. 서비스는 사진 검사(validateOriginalPhoto), Storage 업로드, 가입 완료 요청(session.complete) 순으로 처리한다. 서버의 ready 응답 뒤에는 authDestination으로 바로 이동하므로 완료 안내 팝업이 없다. 실제 Storage 업로드 성공은 미확인이다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/AuthAiScreens.tsx","line":133,"note":"프리뷰 완료 팝업"},{"path":"apps/mobile/src/screens/AuthAiScreens.tsx","line":354,"note":"서비스 사진/가입 처리"},{"path":"apps/mobile/src/avatar-service.ts","line":16,"note":"원본 사진 규격 검사"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서비스의 가입 완료 안내 팝업과 현재 접근 가능한 목적 화면 복귀를 연결한다. 중복 요청, 응답 유실, 사진 처리 실패와 실제 Storage 업로드를 검증한다.","acceptance":"사진 선택만으로 가입되지 않아야 한다. 검증된 ready 응답 뒤 안내를 확인하고, 접근 가능한 목적 화면으로 복귀해야 한다. 목적 화면이 없거나 접근할 수 없으면 홈으로 이동해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C04","title":"선택 성향·MBTI 입력","policy_ids":["P030","P031","P032"],"policy_summary":"관심사와 대화 방식은 각각 최대 20개, 항목당 최대 40자다. MBTI는 네 쌍으로 선택하거나 비워 둘 수 있다.","actual":"프리뷰와 서비스가 TagsEditor를 함께 사용한다. 프리뷰는 MBTI를 네 쌍의 선택 버튼으로 제공하지만 서비스는 네 글자 텍스트 입력란을 사용해 선택 방식이 다르다. 서버 응답 검사와 실제 저장 성공도 구분해야 한다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/CommunityScreens.tsx","line":1451,"note":"공통 선택/직접 입력"},{"path":"apps/mobile/src/screens/AuthAiScreens.tsx","line":354,"note":"서비스 MBTI 자유입력"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서비스 가입의 MBTI를 확정된 네 쌍 선택 방식에 맞춘다. 성향의 20개·40자 경계와 빈 값 저장을 검증한다.","acceptance":"가입·편집 화면의 선택과 직접 입력 한도가 같아야 한다. 비워 둘 수 있는 항목을 실제로 비운 상태로 저장할 수 있어야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C05","title":"계정 상태와 계정 변경 제외","policy_ids":["P034","P035","P054"],"policy_summary":"S21에서 본인·성인 확인 상태, 실명과 마스킹 이름, 성별·나이, 가입일, 제재 상태를 제공한다. 다른 계정으로의 활동 이전은 제공하지 않는다.","actual":"RemoteAccount에는 계정, 취소 판정, 운영 판정, 차단, 숨김, 탈퇴 연결이 있다. 다만 필수 계정 정보 전체를 표시할 명확한 서버 응답 구조와 화면이 부족하다. 다른 네이버 계정으로 변경하는 버튼은 이 화면에 없다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":610,"note":"현재 서비스 계정 화면"},{"path":"apps/mobile/src/screens/CommunityScreens.tsx","line":2183,"note":"예시 계정 정보와 구분"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"S21의 계정 상태 응답과 필수 표시 항목을 맞춘다. 프리뷰에 정보가 보이는 것을 실제 서버 검증 근거로 사용하지 않는다.","acceptance":"필수 계정 정보와 제재 상태가 실제 서버 상태와 일치해야 한다. 계정 간 활동 이전 메뉴는 없어야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C06","title":"연속 취소·정정·제재 안내 소비","policy_ids":["P036","P037","P038","P039","P040","P041","P042","P043","P044","P045","P046","P047","P048"],"policy_summary":"서버가 예정 시작 시각 순으로 취소 결과를 집계한다. 연속 3회 취소의 첫 경고와 이후 반복 시 7일 제한, 취소 후 24시간 이의 대기, 정정과 제재 승계를 적용한다.","actual":"RemoteNotices는 서버의 취소 처리 상태(planState), 횟수, 제한 종료 시각, 이의 상태를 표시한다. 안내 제공 확인 뒤 일반 이의 마감을 표시하며 취소 이의는 별도 양식을 사용한다. 취소 집계, 재계산, 탈퇴 후 제재는 클라이언트만으로 확인할 수 없는 서버 조건이다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":565,"note":"판정·마감 표시"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":545,"note":"취소 이의 전용 요청"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"minkyu","next_action":"민규의 집계 순서·경계 시각·정정 사례 결과를 받은 뒤 앱의 상태 표시와 기능 제한을 함께 대조한다.","acceptance":"중간 사건의 판정이 남은 경우, 마감과 같은 시각, 제재 중복, 정정, 재가입 사례에서 서버 처리와 앱 안내가 일치해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C07","title":"탈퇴·재가입·보관 안내","policy_ids":["P049","P050","P051","P052","P053","P055","P056","P057"],"policy_summary":"탈퇴 전에는 진행 중인 확정 약속만 먼저 정리한다. 프로필은 즉시 삭제하고 재가입은 새 프로필로 시작하며 공개 후기는 익명으로 유지한다. 기존 탈퇴 화면에는 보관 안내 세 묶음과 자세히 보기를 제공한다.","actual":"서비스 탈퇴는 연결 포트가 있어야 활성화하며 성공 영수증을 검사한다. 현재 확인 카드에는 짧은 설명만 있어 즉시 삭제·조건부 보관·백업 별도 안내와 공개 상세 링크가 부족하다. 프리뷰의 보관 안내가 서비스 탈퇴 화면에 자동으로 적용되지는 않는다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":638,"note":"서비스 간단 확인"},{"path":"apps/mobile/src/remote.tsx","line":132,"note":"별도 영수증 상태 경계"},{"path":"apps/mobile/src/screens/CommunityScreens.tsx","line":2363,"note":"프리뷰 상세 안내"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서버의 탈퇴·제재 승계 검증과 별개로 서비스 S21에 보관 안내 세 묶음, 펼침, 공개 삭제 안내 링크를 연결한다.","acceptance":"실제 삭제를 확인하기 전에 완료로 안내하지 않아야 한다. 분쟁만 남은 회원의 탈퇴, 익명 후기 유지, 재가입 초기값을 검증해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C08","title":"가입 AI 선택3종·전체 동의","policy_ids":["P012","P058","P059","P060","P061","P062"],"policy_summary":"후기 AI의 열람, 본인 요약 생성·노출, 작성 후기 활용을 서로 독립된 세 선택 항목으로 받는다. 기본은 미선택이며 전체 동의와 개별 동의를 연결한다. 동의하지 않아도 가입할 수 있다.","actual":"프리뷰에는 AI 가입 동의 방식을 확인 중이라는 설명만 있다. 서비스 가입에는 사진·성향·MBTI만 있다. 세 선택 항목, 자세히 보기, 전체 동의와 새 동의 전송 계약은 연결되지 않았다. 이 가입 폼에 AI 동의를 필수로 강제하는 코드는 없다.","classification":"미구현","source_refs":[{"path":"apps/mobile/src/screens/AuthAiScreens.tsx","line":279,"note":"프리뷰는 설명만"},{"path":"apps/mobile/src/screens/AuthAiScreens.tsx","line":354,"note":"서비스 동의체크 부재"},{"path":"apps/mobile/src/member-session.ts","line":6,"note":"가입 포트 범위"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"민규의 동의별 저장·조회 계약에 맞춰 세 선택 항목, 자세히 보기, 전체 동의를 구현한다. 테스트 계정의 동의 간주를 실제 회원의 동의 증거 생성으로 확대하지 않는다.","acceptance":"동의가 0~3개인 모든 조합에서 가입할 수 있어야 한다. 전체·개별 체크가 연동되고 탐색 동의는 제외되어야 한다. 세 동의는 서버에도 독립적으로 저장되어야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C09","title":"비로그인·관계별 개인정보 공개","policy_ids":["P063","P064","P065","P066","P067","P068","P069","P072"],"policy_summary":"비로그인 응답과 화면 내부에 개인정보를 넣지 않는다. 회원 관계에 따라 실명·마스킹 이름·상세 위치를 구분하며 취소가 성립하면 민감정보 공개를 즉시 회수한다.","actual":"서비스 getPost는 비로그인 응답의 authorDisplayName이 null이고 privateDetails가 없는지 검사한다. 상세 화면에는 중립적인 자리표시자를 그린다. 회원에게 제공되는 상세 정보는 서버가 허용한 응답을 따른다. 실제 취소 후 다른 열린 화면이 즉시 갱신되는지, 진행 중인 읽음 확인 요청이 무효화되는지는 실제 서버에서 검증하지 않았다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/service.ts","line":1222,"note":"익명 정확 필드검사"},{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":535,"note":"조건부 가드/상세표시"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":132,"note":"권한 재조회 중 채팅 숨김"}],"evidence_refs":[{"path":"docs/collaboration/requests/jonghyun/2026-10-20-night-error-ai-result.md","note":"채팅캐시/지연 응답 합성검사이며 실제 서버 권한 증거 아님"}],"wbs":["3.6","6.3"],"owner":"jonghyun","next_action":"권한 변경, 여러 열린 화면, 뒤로가기, 읽음 확인 요청의 응답 순서를 독립적으로 검사한다. 이후 실제 취소·차단 서버 응답과 통합 검증한다.","acceptance":"비로그인 응답과 DOM에 실명·사진·세부 주소가 없어야 한다. 권한 회수 후 늦은 응답이나 캐시 때문에 개인정보가 다시 나타나면 안 된다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C10","title":"공고 검색·필터·더보기·최근검색","policy_ids":["P070","P071","P073","P074","P075","P076","P077","P078","P079","P080","P081"],"policy_summary":"등록 장소·주소·연결 행사명을 검색하고 나이는 19~99세 범위를 제공한다. 비로그인의 상세 필터를 제한하고 적용 버튼으로 필터를 반영한다. 기본은 전체 상태이며 공고는 10개, 후기는 5개씩 조회한다. 최근 검색어는 10개를 7일 보관한다.","actual":"공통 BrowseList와 서비스 공개 검색 연결이 있다. storage는 최근 검색어 10개와 7일 만료를 정리한다. 서비스 모드는 viewerId가 null인 별도 상태를 사용하므로 최근 검색어의 계정별 소유 구분과 로그아웃 시 저장소 삭제를 추가 확인해야 한다. 서버의 검색 대상과 필터 집행은 앱 소스만으로 확정하지 않는다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/BrowseScreens.tsx","line":472,"note":"공통 필터 UI"},{"path":"apps/mobile/src/storage.ts","line":45,"note":"최근검색 한도/만료"},{"path":"apps/mobile/src/state.tsx","line":1212,"note":"서비스 로그아웃 상태초기화"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"비로그인·회원의 필터 적용, 전체 연령, 삭제·숨김, 최근 검색어 소유 구분과 로그아웃 정리를 서비스 사례로 대조한다.","acceptance":"비공개 상세 위치·소개·후기가 검색 대상에 포함되면 안 된다. 조회 실패와 0건을 구분하고 더보기와 기기 저장소 정리가 정확해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C11","title":"공고 작성·장소·입력 한도","policy_ids":["P082","P083","P084","P085","P086","P087","P088","P089","P091"],"policy_summary":"필수 입력 여섯 항목과 선택 모집 마감을 제공한다. 장소·우편번호 검색을 사용하고 공개 지역과 상세 위치를 구분한다. 개인정보를 검사하며 제목 50자, 소개 2,000자, 상세 만남 지점 300자를 제한한다.","actual":"CreateForm은 공통 입력 검사(validateDraft)와 장소 선택창을 사용한다. PublishForm은 무료 공고 정보로 서버에 생성을 요청하고 성공 뒤 상세로 이동한다. 로컬 개인정보 검사는 전화·계좌 패턴 중심이며 전체 금지 콘텐츠 검사는 서버의 별도 처리다. 검증된 응답 뒤 등록 성공을 처리하지만 초안 삭제는 별도 부족분이다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/domain.ts","line":144,"note":"필수/한도/개인정보 검사"},{"path":"apps/mobile/src/screens/BrowseScreens.tsx","line":1686,"note":"작성"},{"path":"apps/mobile/src/screens/BrowseScreens.tsx","line":2169,"note":"서비스 등록"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서버 검사와 일치하는 입력 경계, 이름이 같은 장소, 오탐, 응답 유실을 검증한다.","acceptance":"실제 생성된 공고로만 이동해야 한다. 공개 지역과 상세 위치가 분리되고 필수 입력·글자 수 한도를 어긴 공고가 등록되지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C12","title":"서비스 초안 영속보관·등록 후삭제","policy_ids":["P090"],"policy_summary":"기기에 최근 초안 한 개를 보관하고 새 초안으로 대체하기 전에 알린다. 마지막 수정 후 7일에 만료하며 만료 시각을 표시한다. 등록 성공과 로그아웃 시 삭제한다.","actual":"프리뷰의 storage는 초안을 7일 저장한다. 서비스 saveDraft는 현재 세션의 메모리만 사용하므로 앱 재시작 뒤 보관을 보장하지 않는다. 서비스 등록 성공 뒤에는 상세로 이동할 뿐 clearDraft를 호출하지 않는다. 정책 자체를 메모리 보관으로 변경한 것은 아니다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/storage.ts","line":20,"note":"프리뷰7일"},{"path":"apps/mobile/src/state.tsx","line":1202,"note":"서비스 메모리전용"},{"path":"apps/mobile/src/screens/BrowseScreens.tsx","line":2216,"note":"등록 후 초안 삭제 호출부재"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서비스 계정별로 안전한 기기 초안 저장, 만료, 등록 후 삭제를 구현한다. 메모리 보관 안내도 실제 제공 범위에 맞춰 갱신한다.","acceptance":"앱 재시작, 계정 교체, 등록 응답 유실, 정상 등록 사례에서 오래된 초안이 잘못 노출되거나 복원되지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C13","title":"공고 수정·마감·삭제","policy_ids":["P092","P093","P094","P095","P096"],"policy_summary":"수동 마감은 새 신청만 막는다. 핵심 조건을 변경하면 알리고 기존 확정 요청을 무효화한다. 공고 삭제로 확정 약속의 취소를 대신하지 않는다.","actual":"RemotePostManagement는 소유권을 조회한 뒤 수정·마감·재개·삭제 요청을 보낸다. PostEditor는 제목·소개·일정·장소 수정만 제공하고 행사 변경 UI는 없다. 기존 요청을 함께 무효화하거나 채팅을 읽기 전용으로 전환하는 처리는 서버 범위다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":287,"note":"소유권과 관리액션"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":316,"note":"현재수정필드"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서버의 핵심 조건 버전과 기존 요청 무효화를 검증하고 행사 수정 범위를 연결한다.","acceptance":"확정 전 조건 변경 후에는 이전 요청을 수락할 수 없어야 한다. 삭제한 공고는 공개되지 않고 채팅은 보존되어야 한다. 확정 약속은 별도 취소 절차를 사용해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C14","title":"첫 메시지 신청·재신청·입력이탈","policy_ids":["P097","P098","P099","P100","P101","P102","P103","P104","P105"],"policy_summary":"첫 메시지 전송 성공으로만 신청이 성립한다. 재신청은 같은 대화방을 사용하며 철회 후 1분을 기다린다. 거절된 공고에는 재신청할 수 없다. 미전송 입력을 두고 이탈할 때에는 삭제를 안내한다.","actual":"RemoteChat은 postId로 첫 메시지를 요청하고 검증된 성공 뒤 requestId를 설정한다. 재시도에는 같은 messageId를 사용한다. 미전송 입력은 메모리에만 둔다. 프리뷰에는 이탈 확인 문구가 있지만 서비스 RemoteChat에는 화면 이탈 확인 장치가 확인되지 않는다. 재신청 대기와 거절 이력 제한은 서버에 의존한다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":106,"note":"첫메시지/입력"},{"path":"apps/mobile/src/member-service.ts","line":223,"note":"정확한 성공응답검사"},{"path":"apps/mobile/src/screens/CommunityScreens.tsx","line":522,"note":"프리뷰이탈안내"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서비스의 미전송 입력 이탈 확인을 연결한다. 전송 실패·중복 요청·철회 후 1분·작성자 거절 사례를 검증한다.","acceptance":"실패하거나 첫 전송 전에 이탈하면 신청이 없어야 한다. 성공 시 신청은 하나만 생성되고 같은 방을 재사용해야 한다. 작성자 알림이 중복되지 않으며 입력 삭제 전 안내가 있어야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C15","title":"최종 확정·만료·모집 복원","policy_ids":["P106","P107","P108","P109","P110","P111"],"policy_summary":"작성자의 요청과 신청자의 수락으로 확정한다. 한 번에 한 명에게 요청하며 요청 후 6시간과 약속 시작 중 빠른 시각에 만료한다. 다른 신청의 채팅은 읽기 전용이 된다. 모집은 명시적으로 재개하고 기존 확정 일정과의 겹침은 차단한다.","actual":"RemoteChat은 동의 조건 버전, 무료 조건, 일정을 검사하고 expiresAt과 현재 시각을 비교한 뒤 수락을 요청한다. 모집 재개는 별도 동작이다. 다른 신청의 상태 전환·복원, 중복 수락, 서버 접수 시각의 경계는 앱 구현만으로 보장하지 않는다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":194,"note":"수락전조건검사"},{"path":"apps/mobile/src/member-service.ts","line":235,"note":"버전포함요청"},{"path":"apps/mobile/src/domain.ts","line":36,"note":"프리뷰만료계산"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서버의 동시 수락, 정확한 만료, 재모집 시 복원을 검증한다. 합성 검증과 실제 회원 검증은 단계별로 구분한다.","acceptance":"마감과 같은 시각의 수락은 거부하고 한 명만 확정되어야 한다. 거절·철회한 신청은 복원하지 않으며 기존 약속을 자동 취소하지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C16","title":"채팅 오류·읽기전용·나가기·읽음","policy_ids":["P112","P113","P114"],"policy_summary":"전송 실패 시 입력을 유지한다. 종료된 채팅은 읽기 전용으로 보존하고 대화방 나가기는 본인 목록에서만 숨긴다.","actual":"useMemberAction은 화면 이탈, 세션 변경, 요청 취소를 구분하고 권한 확인 중에는 받은 정보를 캐시에서도 숨긴다. 나가기 확인 문구는 상대 기록과 약속이 유지됨을 설명한다. 읽음 처리는 실제 본문이 화면과 겹친 메시지 집합을 사용한다. 다만 canDisplayMessages가 바뀔 때 진행 중인 읽음 확인 요청과 visibleIds를 즉시 무효화하는 연결이 없다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":56,"note":"오류/세대관리"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":143,"note":"읽음ACK수명"},{"path":"apps/mobile/src/chat-read-state.ts","line":13,"note":"집합읽음포트"}],"evidence_refs":[{"path":"docs/collaboration/requests/jonghyun/2026-10-20-night-error-ai-result.md","note":"회원16건·브라우저합성검증만;ACK후속남음"}],"wbs":["3.6","6.3"],"owner":"jonghyun","next_action":"권한 상실 직후 읽음 요청을 정리하는 합성 검사를 추가한다. 읽기 전용 채팅과 나가기의 적용 범위도 검증한다.","acceptance":"권한 회수 뒤 새 읽음 확인 요청을 보내지 않아야 한다. 늦은 응답은 적용하지 않고 본인의 입력, 상대 채팅 기록, 약속은 정책에 맞게 보존해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C17","title":"약속 변경·정확한 마감","policy_ids":["P115","P116","P117","P118"],"policy_summary":"양쪽 모두 변경을 제안할 수 있지만 상대 수락 전에는 기존 약속을 유지한다. 제안 후 6시간, 기존 시작, 변경 시작 중 가장 빠른 시각에 만료한다. 마감보다 빠른 서버 접수만 허용한다.","actual":"RemoteAppointment는 새 일정·장소와 conditionVersion을 전송하고 상대방의 제안에만 수락을 표시한다. 클라이언트의 날짜 비교는 보조 검사다. 서버 접수 시각, 일정 충돌, 현재 버전 검사는 별도다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":340,"note":"변경제안/수락"},{"path":"apps/mobile/src/domain.ts","line":40,"note":"프리뷰빠른만료"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서버 버전 충돌, 마감과 같은 시각, 양쪽의 동시 제안, 최신 약속 표시를 연결해 검증한다.","acceptance":"거절·미응답이면 기존 약속을 유지해야 한다. 만료된 제안의 수락을 거부하고 확정 일정이 겹치지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C18","title":"철회·시작전취소·시작후신고","policy_ids":["P119","P120","P121","P122","P123","P124"],"policy_summary":"확정 전 철회와 확정 후 취소를 구분한다. 취소가 성립하면 민감정보를 즉시 숨긴다. 시작 후에는 일방 취소 대신 상황 설명이 있는 중단·불발 신고를 받는다.","actual":"RemoteCancel은 서버 시각을 관측한 값을 기준으로 취소 가능 여부를 다시 확인하고 시작 후에는 신고를 제공한다. 실제 취소 영수증과 다른 화면의 권한 회수는 서버 연결 검증이 남아 있다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/member-service.ts","line":149,"note":"서버시각기준gate"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":395,"note":"시작전/후분기"}],"evidence_refs":[],"wbs":["3.6","6.3"],"owner":"jonghyun","next_action":"실제 서버에서 취소한 뒤 다른 열린 화면에서도 민감정보가 회수되는지 함께 확인한다.","acceptance":"약속 시작 시각, 시각 미확인, 응답 유실, 재조회 상황에서 일방 취소 가능 여부를 잘못 판단하지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C19","title":"차단·해제와 필수 약속관리","policy_ids":["P125","P126","P127","P128"],"policy_summary":"차단하면 접촉과 새 신청·확정을 막고 로그인 상태의 상대 콘텐츠를 숨긴다. 기존 약속의 필수 관리는 유지한다. 해제해도 종료된 신청이나 별도로 숨긴 콘텐츠를 자동 복원하지 않는다.","actual":"RemoteBlockControls와 계정의 차단 해제 기능, 숨김과 차단을 구분하는 안내가 있다. 다만 차단 직후 다른 목록·열린 채팅·상대 프로필에 서버 필터가 적용되는지는 클라이언트 소스 확인만으로 증명할 수 없다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":299,"note":"차단요청"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":626,"note":"해제안내"}],"evidence_refs":[],"wbs":["6.3"],"owner":"jonghyun","next_action":"신고 숨김과 차단을 독립적으로 조합한다. 기존 확정 약속 관리, 연락 차단, 비로그인 공개 접근의 한계를 검증한다.","acceptance":"차단 효과는 즉시 적용되고 필수 관리 경로는 남아야 한다. 해제 후에도 별도 숨김은 유지하며 신청·약속 상태를 자동 복원하지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C20","title":"일반 신고 양식·설명/자료 조건","policy_ids":["P129","P130"],"policy_summary":"온라인 신고에는 설명과 캡처가 필수다. 대면 위협·노쇼는 설명과 제출 가능한 자료로 받는다. 여러 사유를 선택할 수 있으며 운영자가 DB의 채팅 원문을 직접 열람하지 않는다.","actual":"RemoteReport는 신고 사유가 아니라 targetType이 appointment인지로 대면/온라인을 나눈다. 약속 대상은 가용 자료로 접수하지만, 회원 대상에서 대면 위협·노쇼를 골라도 온라인 캡처가 필수여서 자료가 없는 대면 신고 연결이 부족하다. 업로드 포트·설명·복수 사유 입력은 있다. 운영 권한·원문 미열람은 별도 검증이 필요하다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":429,"note":"약속 대상 여부에 고정된 대면 분기와 캡처 필수 조건"},{"path":"apps/mobile/src/avatar-service.ts","line":220,"note":"캡처업로드포트"}],"evidence_refs":[],"wbs":["6.3"],"owner":"jonghyun","next_action":"신고 대상과 실제 상황을 구분한다. 대면 위협·노쇼는 자료가 없어도 접수할 수 있도록 기존 서버 계약을 연결한다. 업로드 취소, 응답 유실, 접근 권한도 검증한다.","acceptance":"온라인 신고는 캡처가 없으면 제출을 막아야 한다. 대면 신고는 설명과 제출 가능한 자료로 받을 수 있어야 한다. 접수 안내를 위반 확정 안내와 구분해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C21","title":"신고 본인숨김·해제·필수관리 예외","policy_ids":["P002","P131","P132","P277"],"policy_summary":"본인 숨김은 필요한 최소 기록으로 해제할 때까지 유지한다. 서버의 처리 확인 뒤 반영하고 확정 약속의 필수 관리 경로는 남긴다.","actual":"RemoteReport는 hideTarget 선택과 일치하는 처리 영수증을 확인한 뒤 화면을 이동한다. 계정에서 숨김 목록을 조회하고 해제할 수 있다. 신고 자료를 90일 후 파기해도 숨김이 유지되는지, 모든 목록·검색·상세에 필터가 적용되는지, 필수 관리가 남는지는 실제 통합 검증이 아니다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":439,"note":"신고 숨김선택"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":455,"note":"서버 확인후반영"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":627,"note":"목록/해제"}],"evidence_refs":[],"wbs":["6.3"],"owner":"jonghyun","next_action":"민규의 지속 필터·최소 기록 구현과 함께 신고 자료 파기, 차단 해제, 재로그인 이후의 동작을 검증한다.","acceptance":"실패를 성공으로 143","P144","P145","P146","P147","P148","P149","P150"],"policy_summary":"예상 종료 후 본인이 완료를 확인한다. 양쪽 확인 또는 종료 후 24시간에 실제 완료하며 취소·분쟁은 제외한다. 정정·탈퇴의 특수 조건을 적용하고 완료 횟수는 실제 완료 즉시 반영한다.","actual":"RemoteAppointment는 서버의 can_confirm_completion과 현재 상태를 사용하고 본인 확인 후 후기 진입을 제공한다. 프리뷰는 24시간 자동 완료를 계산하지만 서버의 실제 자동 실행, 정정, 탈퇴 조건을 증명하지 않는다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":355,"note":"서버완료 권한"},{"path":"apps/mobile/src/domain.ts","line":71,"note":"프리뷰 자동 완료 계산"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"minkyu","next_action":"서버의 자동 완료·분쟁·탈퇴 후 정정 결과와 앱의 완료 횟수·안내를 대조한다.","acceptance":"예상 종료 전에는 완료를 확인할 수 없어야 한다. 개인 확인과 실제 완료를 구분하고 취소·분쟁을 제외해야 한다. 횟수는 실제 완료에 반영해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C25","title":"후기 선제출·분쟁·재개","policy_ids":["P151","P152","P153","P154"],"policy_summary":"실제 완료 전에는 후기 기한을 시작하지 않는다. 본인 완료 확인 후 먼저 제출한 후기는 비공개다. 분쟁 중 작성·기한·새 공개를 보류하고 재개할 때에는 최소 24시간을 보장한다.","actual":"RemoteReview는 서버의 can_write, deadline_at, disputed, released를 받아 표시한다. 프리뷰는 선제출과 분쟁 중 공개 조건을 계산한다. 이미 공개된 후기의 운영 숨김과 기한 재개를 실제 서버에서 검증한 것은 아니다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":379,"note":"후기서버 상태소비"},{"path":"apps/mobile/src/domain.ts","line":49,"note":"프리뷰작성권한"},{"path":"apps/mobile/src/domain.ts","line":57,"note":"프리뷰공개계산"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"minkyu","next_action":"서버의 후기 공개, 분쟁, 남은 기한 상태를 앱 표시와 대조한다.","acceptance":"선제출 후기는 비공개로 유지하고 분쟁 중에는 새로 공개하지 않아야 한다. 이미 공개한 후기를 자동으로 숨기지 않으며 재개 후 최소 24시간을 보장해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C26","title":"후기 평가·칭찬 제한·AI 안내","policy_ids":["P155","P156","P157","P158","P159","P160"],"policy_summary":"경험은 좋아요·보통이에요·별로예요 중 하나를 선택한다. 별점은 필수, 한마디는 선택이다. 좋아요일 때만 공식 칭찬을 최대 세 개 고른다. 제출 후 수정은 불가하며 후기 AI 활용을 짧게 안내한다.","actual":"프리뷰는 좋아요일 때 칭찬을 최대 세 개로 제한한다. 서비스 RemoteReview는 세 경험 상태 모두에서 칭찬 목록을 표시하고 선택 개수 제한이 없다. 문구도 좋았어요·아쉬웠어요여서 확정 문구와 다르다. 후기 AI 활용 안내는 현재 서비스 폼에 없다. 서버가 거절하더라도 이 화면 차이는 남는다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":379,"note":"서비스칭찬 선택무제한"},{"path":"apps/mobile/src/screens/CommunityScreens.tsx","line":1937,"note":"프리뷰칭찬 상한"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서비스의 경험 문구, 칭찬 표시 조건과 최대 세 개 제한, 현재 동의 상태에 맞는 안내를 확정 정책에 맞춘다.","acceptance":"좋아요 외에는 칭찬을 보내지 않아야 하고 네 번째 칭찬은 선택할 수 없어야 한다. 경험을 바꾸면 칭찬을 정리하고 중복 제출·수정을 막아야 한다. AI 동의를 매번 다시 체크하지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C27","title":"후기 공개·7일 마감·당도 시점","policy_ids":["P161","P162","P163"],"policy_summary":"후기 마감은 실제 완료 후 7일이다. 양쪽 제출은 실제 완료 후 즉시, 한쪽 제출은 마감에 공개한다. 당도는 상대 후기를 열람할 수 있을 때 반영한다.","actual":"서비스는 서버의 deadline_at, released, peer_review를 사용한다. 프리뷰의 reviewVisible·sweetness 함수는 별개이므로 실제 공개와 점수 원장의 반영 시점은 서버와 함께 검증해야 한다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":384,"note":"실제공개상태소비"},{"path":"apps/mobile/src/domain.ts","line":44,"note":"프리뷰마감"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"minkyu","next_action":"한쪽 제출, 양쪽 제출, 마감과 같은 시각, 분쟁 사례에서 실제 서버의 공개와 당도 반영을 대조한다.","acceptance":"공개 전에는 상대 후기와 해당 당도 기여가 노출되지 않아야 한다. 기한은 실제 완료부터 7일이며 정확한 서버 마감을 사용해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C28","title":"공개 프로필·칭찬·원문과 요약 실패 분리","policy_ids":["P164","P165","P168","P169","P170","P171"],"policy_summary":"허용된 프로필 정보를 제공하고 칭찬 상위 다섯 개를 표시한다. 숨긴 후기의 칭찬은 제외하고 유효하게 복원하면 되돌린다. 요약이 실패해도 공개 가능한 원문은 유지한다.","actual":"RemoteProfileScreen은 프로필·후기·요약을 각각 요청해 실패를 구분한다. 후기를 다섯 개씩 더 조회하고 서버의 칭찬 정보를 사용한다. 실제 숨김·복원·최종 무효 조건과 요약 근거의 유효성은 서버 범위다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":747,"note":"독립요청"},{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":798,"note":"후기페이징"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"숨김·분쟁·차단 사례에서 프로필, 칭찬, 원문 상태를 실제 서버와 대조한다.","acceptance":"요약 실패가 원문을 가리지 않아야 한다. 숨긴 후기의 칭찬만 제외하고 현재 열람 권한에 맞는 이름·성향을 표시해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C29","title":"후기 요약 공개 조건·재조회","policy_ids":["P166","P167","P172"],"policy_summary":"열람 회원, 프로필 대상자, 원문 작성자의 동의를 각각 확인한다. 활용 가능한 공개 텍스트 후기 세 개 이상일 때 최대 300자의 요약을 제공한다. 표시하거나 펼칠 때 현재 조건을 다시 조회한다.","actual":"profileSummary는 sourceCount가 3 이상인지, 300자 이하인지, 응답이 정확한 summary 구조인지 검사한다. RemoteProfileSummary는 화면 복귀와 펼침 때 다시 조회한다. 다만 세 동의의 상태가 서비스 계약에 없으며 null 응답의 구체적인 이유를 추정하지 않는다. 현재 세 동의를 검증한 것은 아니다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/service.ts","line":1188,"note":"요약필드/최소 근거 검사"},{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":686,"note":"펼침/초점재조회"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"독립 동의 계약을 연결한 뒤 후기 세 개·두 개, 철회, 숨김, 재생성 실패를 검증한다. 재조회 중 이전 텍스트가 노출되는지도 확인한다.","acceptance":"허용되지 않은 원문은 사용하지 않아야 한다. 요약은 최대 300자이며 표시·펼침 때 최신 권한을 확인해야 한다. 캐시 때문에 무단 노출되면 안 된다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C30","title":"후기 AI 동의 독립 철회","policy_ids":["P173","P174","P175","P176","P177"],"policy_summary":"후기 AI 세 동의는 독립적으로 철회한다. 일반 후기 원문·별점·당도는 유지한다. 작성 후기 활용을 철회하면 관련 요약을 숨기고 조건을 충족할 때만 재생성한다. 필요한 외부 사본 삭제도 추적한다.","actual":"서비스 withdrawAi는 exploration·review_summary 두 종류만 받는다. 계정 버튼도 후기 요약 처리 철회 하나이므로 열람, 본인 요약 생성, 작성 후기 활용을 각각 선택할 수 없다. 현재 두 종류의 서버 계약으로 세 동의의 독립 처리를 완료했다고 표시하면 안 된다.","classification":"미구현","source_refs":[{"path":"apps/mobile/src/member-service.ts","line":301,"note":"기존두종철회"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":621,"note":"현재철회UI"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"민규의 동의별 조회·철회·재생성·삭제 계약에 연결해 세 동의를 독립적으로 관리하는 UI를 추가한다.","acceptance":"한 항목의 철회가 나머지 두 항목이나 일반 동행을 바꾸지 않아야 한다. 철회한 원문을 사용한 요약은 즉시 숨기며 외부 삭제 미확인은 별도로 알려야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C31","title":"당도 산식·효력·정정","policy_ids":["P178","P179","P180","P181","P182","P183","P184","P185"],"policy_summary":"당도는 15에서 시작해 경험·별점·확정 제재를 합산하고 마지막 값만 0~100으로 제한한다. 후기 공개 시 반영하며 임시 숨김 중에는 유지하고 최종 무효 때 해당 기여를 제거한다.","actual":"프리뷰 sweetness는 경험·별점·운영 기여를 합산하고 마지막에 상·하한을 적용한다. 서비스는 서버의 sweetness를 표시하며 프리뷰 함수로 회원 당도를 다시 계산하지 않는다. 실제 원장, 반영 시점, 같은 사건에서 가장 큰 운영 감점 하나만 적용하는 처리는 서버 검증 대상이다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/domain.ts","line":76,"note":"프리뷰산식"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":249,"note":"서비스프로필소비"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"minkyu","next_action":"서버의 당도 원장과 최종 무효·임시 숨김·정정 시점을 검증한다.","acceptance":"초기값과 상·하한이 맞고 좋아요·별점 5점은 17, 별로·별점 1점은 11이어야 한다. 무효 기여는 제거하며 칭찬·완료 횟수를 가산하지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C32","title":"일반 행사 주간 범위·월별 주차","policy_ids":["P186","P187","P188","P189","P190","P191","P192","P193","P194"],"policy_summary":"한국시간 월요일에 주를 시작하고 목요일이 속한 달로 월별 주차를 정한다. 기본 목록은 이번 주에 시작한 미종료 행사이며 진행 중 포함과 과거 조회를 제공한다.","actual":"domain의 currentWeek·monthWeek는 한국시간의 월요일 범위와 목요일 귀속을 계산한다. 서비스 목록은 기준 안내, 진행 중 포함, 과거 필터를 제공한다. 서버의 기본 정렬과 주간 범위 응답은 이번 소스 감사에서 실행하지 않았다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/domain.ts","line":20,"note":"한국 주간 경계"},{"path":"apps/mobile/src/domain.ts","line":28,"note":"월별 표시 규칙"},{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":861,"note":"서비스필터"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서버의 주간 기본 목록, 월 경계, 연말 사례를 기존 테스트 근거에 연결한다.","acceptance":"월초·월말에서 주간 범위를 자르지 않아야 한다. 기본 목록에서 종료 행사를 제외하되 과거 조회는 가능해야 한다. 월별 주차를 ISO가 직접 정의했다고 표현하지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C33","title":"행사 유형·작성용 전체검색·수집범위","policy_ids":["P195","P196","P197","P198","P204"],"policy_summary":"원천이 제공한 실제 행사 유형과 공연 하위 필터를 사용한다. 종료 행사는 새로 연결하지 않는다. 작성용 검색은 예정·진행 중 전체를 대상으로 한다. 초기 수집 범위는 최근 한 달과 앞으로 31일이다.","actual":"RemoteEventPicker는 mode=post_selection과 검색어만 보내 동행 일정에 따라 검색 범위를 자동으로 좁히지 않는다. canSelectEvent는 active 상태의 미종료 행사만 선택한다. 수집 기간, 진행 중 행사 갱신, 페이지 재개는 서버 작업이므로 앱에서 증명할 수 없다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":1025,"note":"작성용10개검색"},{"path":"apps/mobile/src/presentation/events/event-selection.ts","line":8,"note":"일정필터없음"},{"path":"apps/mobile/src/presentation/events/event-selection.ts","line":2,"note":"현재active만허용"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"서버의 수집 재개와 확장 상태 계약을 받은 뒤 목록 범위·필터를 대조한다.","acceptance":"예정·진행 중 행사 전체를 검색할 수 있어야 한다. 종료 행사는 조회할 수 있지만 새 연결은 막아야 한다. 아직 수집하지 못한 범위를 결과 0건으로 오해시키지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C34","title":"행사 카드·상세·요금·이미지·명칭","policy_ids":["P199","P200","P211","P212","P213","P214","P215","P216"],"policy_summary":"행사 이름·분류·상태·날짜·지역·장소·요금·출처와 공식 링크를 표시한다. 이미지가 없거나 로딩에 실패하면 이미지 영역을 생략한다. 원천 값과 날짜 정밀도를 보존한다.","actual":"EventPresentation은 이미지를 자르지 않는 contain 방식, 로딩 실패 시 영역 생략, 제목 두 줄, 날짜 정밀도와 요금 미확인 구분을 구현한다. 상세에는 시간·공개 주소·원래 요금 안내·소개·출처와 sourceUrl을 표시한다. 추가 관람 안내와 별도 예매 링크를 받을 확장 응답 구조는 부족하다. TourAPI 관광 타입 수집은 서버 범위다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/presentation/events/EventPresentation.tsx","line":13,"note":"이미지실패영역생략"},{"path":"apps/mobile/src/presentation/events/event-display.ts","line":52,"note":"요금/명칭/날짜"},{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":608,"note":"서비스상세"}],"evidence_refs":[{"path":"docs/collaboration/requests/jonghyun/2026-10-20-event-flow-night-result.md","note":"UI합성·프리뷰검증;공급사데이터통합성공아님"}],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"확장 응답 구조에 실제 확보한 관람 정보와 공식·예매 링크만 연결한다. 프리뷰와 서비스 화면을 대조한다.","acceptance":"이미지 실패 뒤 빈 영역이 남으면 안 된다. 미확인 요금을 무료로 안내하지 않고 날짜 정밀도·출처를 보존해야 한다. 제공되지 않은 선택 정보는 생략해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C35","title":"KOPIS 14분류·공식 대조·검증기간","policy_ids":["P001","P201","P202","P203","P232"],"policy_summary":"전체 공연과 13개 분류 각각을 공식 사이트의 실제 7일 기간·공연 ID·순서와 대조한 뒤 공개한다. 동률은 공식 순서를 따른다. 갱신 실패 시 기존 기간을 유지하고 최초 미검증이면 공식 링크로 안내한다.","actual":"서비스 UI와 타입은 all·musical 두 개뿐이며 performanceRankings는 조회 조건 없이 not_enabled 응답만 허용한다. 화면은 최근 7일이라는 목표와 공급사 확인 후 제공한다는 문구를 고정 표시한다. 14개 분류, 검증 목록, 실제 확인 기간, 갱신 지연, 공식 링크 계약은 연결되지 않았다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":640,"note":"일괄 보류 문구"},{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":876,"note":"두선택항목"},{"path":"apps/mobile/src/service.ts","line":1194,"note":"not_enabled만수용"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"민규의 분류별 검증 상태·기간·링크 계약을 연결한 뒤 14개 분류 UI를 구현한다. 대조가 진행되는 동안 일반 행사 개발도 병행한다.","acceptance":"분류별로 독립 처리하고 검증한 목록만 공개해야 한다. 목표 기간을 실제 확인 기간처럼 표시하면 안 된다. 미검증 분류에는 공식 링크를 제공하고 과거 검증 목록의 기간은 보존해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C36","title":"행사 연결 작성 위치·일정 보존·로그인복귀","policy_ids":["P205","P206","P207","P218"],"policy_summary":"일반 작성은 행사 영역을 아래에, 행사 상세에서 시작하면 위에 둔다. 행사 연결은 선택이며 일정을 강제하거나 자동 변경하지 않는다. 달력에서 행사 진행일을 색으로 표시한다. 신규 가입도 안내 확인 후 접근 가능한 원행사 작성 화면으로 복귀하고, 복귀할 수 없으면 홈으로 이동한다.","actual":"CreateForm은 행사 영역 위치(eventSectionPosition)와 기존 초안을 보존하며 행사 선택창은 별도로 검색한다. eventCreateReturnPath는 고정된 작성 복귀 경로를 만든다. 날짜는 텍스트 입력란이므로 달력의 색 강조는 아직 없다. 실제 OAuth와 신규 가입 후 복귀는 검증하지 않았다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/BrowseScreens.tsx","line":1836,"note":"행사영역위치"},{"path":"apps/mobile/src/screens/BrowseScreens.tsx","line":1890,"note":"일정입력"},{"path":"apps/mobile/src/presentation/events/event-selection.ts","line":23,"note":"원행사복귀경로"}],"evidence_refs":[{"path":"docs/collaboration/requests/jonghyun/2026-10-20-event-flow-night-result.md","note":"입력/연결로컬완료;날짜달력후속"}],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"날짜 입력 UX 후속은 기존 보류대로 유지한다. 로그인 후 복귀와 행사 연결 가능 상태의 재확인을 검증한다.","acceptance":"행사 선택으로 작성 일정이 바뀌지 않고 영역 위치가 기준에 맞아야 한다. 안내 후 원행사 작성으로 복귀할 때 연결 가능 상태를 다시 확인해야 한다. 취소 로그인에는 작성 권한을 주지 않고 달력 미완료도 구분해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C37","title":"직접 입력 행사·변경/삭제","policy_ids":["P208","P209","P210"],"policy_summary":"직접 입력 행사는 이름이 필수이며 공개 장소·주소는 선택이다. 개인 주소를 금지한다. 해당 공고에만 표시하고 공용 행사나 별도 상세를 만들지 않는다. 연결 카드 버튼은 변경·삭제다.","actual":"직접 입력, 주소 검색, 공개 확인과 검사 기능이 있다. API 행사와 직접 입력을 동시에 연결하지 않으며 프리뷰에서는 해당 공고에만 저장한다. 서비스 등록은 manualEvent가 있으면 준비 중 안내로 멈추고 입력을 유지한다. 소개에 합쳐서 전송하는 우회는 없다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/presentation/events/event-draft.ts","line":5,"note":"직접 입력검사"},{"path":"apps/mobile/src/screens/BrowseScreens.tsx","line":2203,"note":"실제 서버저장차단"}],"evidence_refs":[{"path":"docs/collaboration/requests/jonghyun/2026-10-20-event-flow-night-result.md","note":"프리뷰/클라이언트검증이며실제 저장은대기"}],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"민규의 저장·수정·검색·공개 응답 계약이 준비되면 서비스 요청과 등록 후 상세 표시를 연결한다.","acceptance":"직접 입력 행사는 해당 공고에만 보이고 주소를 생략할 수 있어야 한다. 공용 목록을 만들지 않으며 같은 수정·삭제를 재요청해도 중복 처리하지 않아야 한다. 저장 실패 시 입력을 보존해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C38","title":"행사 연결공고·공고 연결행사 상세","policy_ids":["P217","P219"],"policy_summary":"행사 상세에는 내부 행사 관계로 연결된 공고를 전체 상태·최신순으로 조회하고 모집 중 필터와 10개씩 더보기를 제공한다. 공고 상세에는 연결 행사의 종류·기간·장소·이미지와 상세 이동을 제공한다.","actual":"RemoteEventDetail에는 연결 공고 조회·목록이 없다. RemotePostDetail의 linkedEvent는 제목과 상세 이동만 표시해 기간·행사장·종류·이미지가 부족하다. 직접 입력 행사의 서버 응답 구조도 없으므로 공고 상세 표시는 연결 대기다.","classification":"미구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":608,"note":"현재행사상세"},{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":584,"note":"공고상세제목만"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"민규의 내부 관계 조회 계약과 직접 입력 행사 응답 구조를 받은 뒤 연결 공고 목록과 연결 행사 카드를 연결한다.","acceptance":"외부 API의 행사 정보를 동행 정보로 오해시키지 않아야 한다. 모집 필터·페이징·0건 안내와 삭제·차단·숨김·비로그인 공개 권한을 유지해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C39","title":"행사 새 연결 조건·등록 직전 확인","policy_ids":["P220","P221","P222","P223"],"policy_summary":"종료·취소·일정 미정 연기·비표출 행사는 새로 연결하지 않는다. 상태 미제공과 오류를 구분한다. 등록 직전 내부 서버에서 연결 가능 여부를 확인하고 실패하면 입력을 보존한다.","actual":"canSelectEvent는 active 상태의 예정·진행 행사만 허용하며 취소·종료 안내 문구가 있다. 서비스 행사 검사기는 active·cancelled 중심이어서 일정 미정, 비표출, 공식 상태 미제공을 다룰 수 없다. 등록 직전 별도의 연결 가능 확인 흐름은 없고 서버의 생성 검사에 의존한다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/presentation/events/event-selection.ts","line":16,"note":"취소/종료표시"},{"path":"apps/mobile/src/service.ts","line":329,"note":"현재DTO제약"},{"path":"apps/mobile/src/screens/BrowseScreens.tsx","line":2213,"note":"바로create호출"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"민규의 확장 행사 응답과 내부 등록 검사를 연결한다. 클라이언트에서 재확인하거나 사용자가 연결을 삭제하는 선택을 제공한다.","acceptance":"검색 누락을 취소로 오해하지 않아야 한다. 상태 미제공과 오류를 구분하고 연결을 자동 삭제하지 않아야 한다. 확인 실패 시 초안을 보존해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C40","title":"행사 변경 합의·자동 원천 변경 알림","policy_ids":["P224","P225"],"policy_summary":"작성자가 행사를 교체·삭제하거나 실질 정보를 바꾸면 핵심 조건 변경이다. 확정 후에는 상대 수락을 받는다. 기관의 자동 갱신과 구분하며 필요한 대상에게만 중복 없이 앱 안 알림을 제공한다.","actual":"프리뷰의 state.publish는 eventId·manualEvent 변경을 핵심 조건으로 검사한다. 서비스 PostEditor에는 행사 변경 필드가 없고 약속 변경 제안은 일정·장소 중심이다. 행사 변경 합의와 원천 상태 변경 알림은 서버 계약과 추가 연결이 필요하다.","classification":"미구현","source_refs":[{"path":"apps/mobile/src/state.tsx","line":406,"note":"프리뷰핵심조건"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":316,"note":"행사편집없음"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":519,"note":"행사갱신전용표시없음"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"민규의 변경 합의·알림 계약이 준비되면 서비스 편집과 기존 약속 유지 상태를 연결한다.","acceptance":"수락 전에는 기존 행사·약속을 유지해야 한다. 기존 최종 동의를 무효화하고 대상자에게만 앱 안 알림을 제공해야 한다. 기관 갱신을 작성자의 변경과 구분해야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C41","title":"비표출·재표출·동일행사 통합/분리","policy_ids":["P226","P227","P228","P229","P230","P231"],"policy_summary":"비표출 원천의 값을 숨기고 중립 안내 카드로 바꾼다. 검증 후 복원하며 확실한 근거가 있을 때만 대표 행사로 통합한다. 필드 출처·관계·되돌리기를 보존하고 핵심 충돌 시 새 연결을 제한한다.","actual":"PublicEventItem과 연결 행사 검사기는 단일 행사 응답을 사용한다. 비표출 대체, 여러 원천 중 대표 선택, 정보 충돌 관계를 표현하지 않는다. EventDetail은 받은 단일 title·address를 표시하므로 새 서버 응답 구조 없이 모든 조건을 충족한다고 볼 수 없다.","classification":"미구현","source_refs":[{"path":"apps/mobile/src/service.ts","line":304,"note":"원천단일DTO파서"},{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":608,"note":"현재 단일 상세"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"민규의 안전한 행사 응답, 통합 근거·대표 전환·분리 계약을 받은 뒤 중립 카드와 새 선택 제한을 연결한다.","acceptance":"비표출 원천의 이름·이미지·주소·상세 이동을 노출하지 않아야 한다. 다른 유효 원천과 기존 연결은 유지해야 한다. 근거 없는 자동 병합은 없어야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C42","title":"AI 탐색 첫 사용 동의·거절·철회","policy_ids":["P233","P234","P235"],"policy_summary":"로그인 회원의 첫 탐색 사용 때 동의를 받는다. 동의 전에 모델 처리나 질문 전송을 하지 않는다. 거절하면 일반 검색을 유지하며 가입의 후기 동의와 분리한다. 탐색 동의를 철회하면 새 전송을 중단한다.","actual":"RemoteAiScreen에는 로그인 제한이 있다. 그러나 RemoteAiSession의 전송 함수는 명시적인 첫 사용 동의 화면이나 동의 상태 확인 없이 askAi를 호출한다. 서버의 consent_required 응답을 받을 수 있지만 이것이 동의 수집 UI와 계약의 완료를 뜻하지는 않는다. 계정에는 탐색 철회 버튼이 있다.","classification":"미구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":261,"note":"전송진입"},{"path":"apps/mobile/src/screens/RemoteMemberScreens.tsx","line":622,"note":"탐색철회UI"}],"evidence_refs":[],"wbs":["1.2","6.1"],"owner":"jonghyun","next_action":"민규와 탐색 동의 조회·저장 계약을 먼저 맞춘다. 거절, 자세히 보기, 첫 사용 동의를 연결한다.","acceptance":"동의 전 모델 처리·질문 외부 전송이 없어야 한다. 거절 후 일반 검색을 유지하고 후기 동의를 탐색 허가로 대신 사용하지 않아야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C43","title":"AI 개인정보·지역·카드·메모리·공급사","policy_ids":["P007","P009","P236","P237","P238","P239","P240","P241","P242"],"policy_summary":"공개 정보만 추천하며 GPS를 사용하지 않고 필요한 지역을 질문한다. 행사와 공고를 구분하고 대화는 메모리에서 지운다. 실제 회원의 외부 전송은 조건 확인 전 보류한다.","actual":"RemoteAiSession은 메시지를 메모리에 두고 화면 이탈 시 clear·abort로 지우고 취소한다. 결과 카드도 공고·행사 타입으로 구분한다. 다만 클라이언트 askAi 자체에는 실제 회원 원문 전송 보류를 집행하는 기능 설정이 없다. 서버 설정·공급사 조건과 실제 회원 검증 금 P249","P250"],"policy_summary":"도움 평가와 문제 신고를 구분한다. 신고 증거는 선택한 답변 최대 500자 또는 본인 캡처 한 개다. Storage·접근 권한·감사·파기 준비 전에는 신고를 비활성화하고 성공 후 해당 답변을 숨긴다.","actual":"RemoteAiFeedback는 requestId만 받아 답변 원문을 자동 첨부하지 않는다. 선택 텍스트 500자와 캡처 한 개를 검사한다. 그러나 문제 있어요·텍스트 신고 버튼은 인증과 입력 조건으로만 활성화되고 운영 준비 상태에 따른 제한이 없다. 서버의 거절과 화면의 활성 상태는 별개다.","classification":"부분 구현","source_refs":[{"path":"apps/mobile/src/screens/RemoteAiFeedback.tsx","line":16,"note":"최소증거"},{"path":"apps/mobile/src/screens/RemoteAiFeedback.tsx","line":130,"note":"준비 게이트없는버튼"},{"path":"apps/mobile/src/screens/RemoteAiFeedback.tsx","line":82,"note":"접수전조건"}],"evidence_refs":[],"wbs":["6.3","5.4b"],"owner":"jonghyun","next_action":"민규의 운영 준비·결과 제공 증거 확인을 연결해 신고 비활성 상태와 안내를 맞춘다. 실제 접수 전 증빙을 확인한다.","acceptance":"준비 전에는 신고 진입·전송이 불가능해야 한다. 전체 대화를 자동 첨부하지 않고 본인 파일만 사용해야 한다. 성공 확인 후에만 답변을 숨겨야 한다.","evidence_level":"정적 소스 대조","runtime_status":"NOT_RUN"},{"id":"C46","title":"AI 한도·서버 기준 A·예산 분리","policy_ids":["P008","P251","P252","P253","P254","P255"],"policy_summary":"회원별 하루 20회·동시 한 요청을 적용한다. 모델 없는 요청은 제외하고 처리 시작 후 실패는 차감한다. 중단 후에는 서버 기준을 유지하고 이용 가능 상태 확인부터 연결한다. 공급사별 예산을 분리한다.","actual":"RemoteAiSession은 화면의 요청 잠금·취소와 여섯 종류의 복구 안내를 사용한다. 자체 횟수나 자정 타이머를 추가하지 않았다. 질문 A를 전송하는 중 새로 쓴 B는 A의 응답으로 지우지 않는다. 이용 가능 상태 확인 계약과 버튼 제어는 연결 대기다. 회원 전체의 동시 요청·비용 차감은 서버 책임이다.","classification":"연동 대기","source_refs":[{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":366,"note":"새 입력 보존"},{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":276,"note":"화면동시요청"},{"path":"apps/mobile/src/screens/RemoteScreens.tsx","line":453,"note":"비모델구분"}],"evidence_refs":[{"path":"docs/collaboration/requests/jonghyun/2026-10-20-night-error-ai-result.md","note":"최종A선택반영과합성검증;실한도집행별도"}],"wbs":["5.4b"],"owner":"jonghyun","next_action":"민규와 상태 확인 방법을 정한 뒤 버튼 제어와 실제 한도·예산 응답을 연결한다. 포텐스닷의 기술 토큰을 Gemini 원화 예산으로 환산하지 않는다.","acceptance":"서버 중단 후 자동 재전송이 없어야 한다. 입력과 일반 검색을 유지하고 중복 차감하지 않아야 한다. 상태를 확인하기 전에 클라이언트 추정으로 이용 제한을 해제하지 않아야 한다.","evidence_level":"정적 function q(x){const a=answers[x.id]||{};return '<article class="card"><div class="meta">'+pill(x.id)+pill(a.choice?'작성됨':'미선택',a.choice?'good':'warn')+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.context)+'</p><div class="callout"><strong>예시</strong><p>'+esc(x.example)+'</p></div>'+(x.options||[]).map((o,i)=>{const title=typeof o==='string'?o:(o.title||o.label||o.text), detail=typeof o==='string'?'':o.detail;return '<label class="option"><input type="radio" name="'+esc(x.id)+'" value="'+String.fromCharCode(65+i)+'" '+(a.choice===String.fromCharCode(65+i)?'checked':'')+'> <strong>'+String.fromCharCode(65+i)+'. '+esc(title)+(i===0?' · 추천':'')+'</strong>'+ (detail?'<p>'+esc(detail)+'</p>':'')+'</label>';}).join('')+'<label class="option"><input type="radio" name="'+esc(x.id)+'" value="other" '+(a.choice==='other'?'checked':'')+'> D. 기타 — 직접 작성</label><textarea data-question="'+esc(x.id)+'" aria-label="'+esc(x.title)+' 기타 의견">'+esc(a.other||'')+'</textarea><p class="small">추천 이유: '+esc(x.recommendation)+'</p></article>';}
function overview(){return '<div class="facts"><div class="fact"><strong>'+model.units.length+'</strong>원문 정책 대조 항목</div><div class="fact"><strong>'+model.groups.length+'</strong>클라이언트·서버 대조 묶음</div><div class="fact"><strong>'+model.cases.length+'</strong>후속 QA 설계 사례</div><div class="fact"><strong>'+model.questions.length+'</strong>새 정책 선택 질문</div></div><article class="card" style="margin-top:16px"><h2>이번 검토에서 구분한 것</h2><p>정책 전체를 읽어 현재 포함·제외·보류 범위와 구현 차이를 연결했습니다. 실제 서버·DB 운영 상태나 회원·기기 검증은 별도 확인이 필요합니다.</p><div class="callout">가입 AI 선택 동의, 직접 입력 행사 서버 저장, KOPIS14분류·공식 대조 같은 확정 정책의 미구현은 다시 선택할 질문으로 돌리지 않습니다. 구현 담당과 완료 조건을 연결합니다.</div>'+list(model.summary||[])+'<p><a href="README.md">인수인계 Markdown</a> · <a href="audit.json">전체 원장 JSON</a> · <a href="../../../../../정책.md">현재 정책.md</a></p></article>';}
function render(){for(const [id,title]of tabs){const b=document.querySelector('[data-tab="'+id+'"]');b.setAttribute('aria-pressed',String(id===tab));}const data={groups:model.groups,units:model.units,gates:model.gates,cases:model.cases,decisions:model.decisions,documents:model.documents,questions:model.questions};let rows=data[tab]||[];const query=$('search').value.trim().toLowerCase(),owner=$('owner').value,kind=$('kind').value;rows=rows.filter(x=>(!query||JSON.stringify(x).toLowerCase().includes(query))&&(!owner||JSON.stringify(x.owner||'').includes(owner))&&(!kind||JSON.stringify(x).includes(kind)));$('count').textContent=tab==='overview'?'현재 기준과 남은 조건을 먼저 확인하세요.':rows.length+'개 항목 표시';if(tab==='overview'){$('content').innerHTML=overview();return;}const draw={groups:group,units:unit,gates:gate,cases:tc,decisions:decision,documents:documentRow,questions:q}[tab];let header=tab==='questions'?'<div class="actions"><button id="save-json">답변 JSON 저장</button><button id="save-html">작성본 HTML 저장</button></div><p class="small">선택은 이 브라우저에 보관되며 외부로 전송되지 않습니다. 자동 적용·승인이 아닙니다.</p>':'';$('content').innerHTML=header+(rows.length?'<div class="cards">'+rows.map(draw).join('')+'</div>':'<p class="empty">'+(tab==='questions'&&model.questions.length===0?'새로 선택할 정책 충돌은 없습니다. 구현·외부 확인 후속은 구현 차이와 출시 조건에서 확인할 수 있습니다.':'조건에 맞는 항목이 없습니다. 검색·필터를 초기화해 주세요.')+'</p>');if(tab==='questions'){$('save-json').onclick=()=>download('유미당_정책구현_답변.json',JSON.stringify({fingerprint:model.fingerprint,answers,savedAt:new Date().toISOString()},null,2),'application/json');$('save-html').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#saved-answers').textContent=JSON.stringify({fingerprint:model.fingerprint,answers,savedAt:new Date().toISOString()}).replace(/</g,'\u003c');download('유미당_정책구현_작성본.html','<!doctype html>'+clone.outerHTML,'text/html');};}}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({fingerprint:model.fingerprint,answers}));}catch{}}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('tabs').innerHTML=tabs.map(([id,title])=>'<button data-tab="'+id+'" aria-pressed="false">'+title+'</button>').join('');$('tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render();}};for(const id of ['search','owner','kind'])$(id).oninput=render;$('content').onchange=e=>{if(e.target.type==='radio'){const id=e.target.name;answers[id]={...(answers[id]||{}),choice:e.target.value,updatedAt:new Date().toISOString()};persist();}};$('content').oninput=e=>{const id=e.target.dataset.question;if(id){answers[id]={...(answers[id]||{}),other:e.target.value,updatedAt:new Date().toISOString()};persist();}};render();
</script></body></html>

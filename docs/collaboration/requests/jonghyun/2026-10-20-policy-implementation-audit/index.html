r:var(--muted);font-weight:700;margin-top:10px}.callout{border-left:4px solid var(--accent);padding:12px 15px;background:#f4effb;border-radius:5px;margin:12px 0}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.fact{padding:18px;background:white;border:1px solid var(--line);border-radius:12px}.fact strong{display:block;font-size:28px;color:var(--accent)}ul,ol{padding-left:22px}li{margin:4px 0}details{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}summary{cursor:pointer;color:var(--accent)}.option{display:block;padding:13px;margin:9px 0;border:1px solid var(--line);border-radius:9px;cursor:pointer}.option:has(input:checked){background:var(--soft);border-color:var(--accent)}textarea{width:100%;min-height:100px;padding:12px;font:inherit;border:1px solid var(--line);border-radius:8px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.small{font-size:13px;color:var(--muted)}code{font-size:13px;background:#f1eef5;padding:2px 4px;border-radius:4px}pre{white-space:pre-wrap;font:13px/1.6 system-ui}.empty{padding:30px;background:white;border:1px dashed var(--line);border-radius:12px}@media(max-width:700px){header{padding:22px 18px}h1{font-size:23px}.toolbar{position:static}.cols{grid-template-columns:1fr;gap:0}.facts{grid-template-columns:1fr 1fr}.card{padding:16px}main{padding:16px 12px}nav{gap:5px}nav button{padding:7px 9px;font-size:13px}}
</style></head><body><header><span class="eyebrow">유미당 / WBS 1.1 · 1.2 · 1.3 · 1.4 · 6.1</span><h1>확정 정책은 어디까지 구현됐을까요?</h1><p class="sub">현재 정책 · 실제 코드 · 기존 검증 · 남은 작업을 연결했습니다. 정책이 정해진 것, 화면에서 보이는 것, 서버와 기기에서 검증된 것은 서로 다른 상태입니다.</p><p class="small" id="baseline"></p></header><div class="toolbar"><nav aria-label="검토 영역" id="tabs"></nav><div class="filters"><input id="search" aria-label="항목 검색" placeholder="예: 선택 동의, 직접 입력, 읽음, P025"><select id="owner" aria-label="담당 필터"><option value="">모든 담당</option><option value="jonghyun">종현</option><option value="minkyu">민규</option><option value="yumi">유미</option><option>공통</option></select><select id="kind" aria-label="상태 필터"><option value="">모든 상태</option><option>일치</option><option>부분 구현</option><option>미구현</option><option>연동 대기</option><option>확인 불가</option><option>제외/보류</option><option>NOT_RUN</option><option>HOLD</option></select></div></div><main><p class="count" id="count" aria-live="polite"></p><section id="content"></section></main><script id="audit-data" type="application/json">{"schema_version":1,"date":"2026-10-20","baseline":"72be7fb7a4af3d24770ea11f3f9e255e85326ccd","authority":"최신 사용자 답변 및 정책.md","policy_sha256":"a8a8ee2c67eb3497b859c38beda21334f306491661ba19a8d630f16ad121152e","summary":["가입 후기 AI 선택3종·전체 동의·독립 철회는 화면/서버 저장 계약에 미구현 차이가 있어 담당별 후속으로 연결했습니다.","KOPIS 최신 A안·14분류와 기존2분류/basedate필수 구현의 차이를 확인했습니다. 일반 행사 개발과 기간 대조는 독립 진행합니다.","직접 입력 행사는 공고 전용 정책이 확정됐지만 실제 서버 저장·비표출/동일 행사 통합/연결 공고 표시는 후속 구현·연동이 남아 있습니다.","포텐스닷 회신 수신·Gemini 테스트 월 예산·합성3건 및 대표 계정 전환 대기를 현재 문서에 구분했습니다.","출시 조건·QA 사례는 실행 설계입니다. 신규 실제 서버·회원·실기기·운영 검증 PASS를 생성하지 않았습니다.","종현 브랜치의 원본 문서 경로를 담당별 정상 커밋으로 통합하고 원격 HEAD/내용까지 별도 검증합니다."],"units":[{"id":"P001","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":13,"text":"**KOPIS 공식 사이트 대조 공개 — 사용자 확정:** KOPIS 순위 선택은 전체 공연(기본), 연극, 뮤지컬, 클래식, 국악, 대중음악, 무용, 대중무용, 서커스/마술, 복합, 아동, 대학로, 내한, 축제의 14항목이다. 표시명은 서양음악(클래식)→클래식, 한국음악(국악)→국악, 무용(서양/한국무용)→무용으로 바꾸되 원천 코드·원래 분류는 보존한다. 아동·대학로·내한·축제는 장르와 구분되는 공식 특성·지역 조건을 따른다. 집계는 어제까지 최근7일, 갱신은 매일이다. 분류마다 공식 사이트에 표시된 실제 기간·공식 분류/지역·정렬 기준과 API 공연ID·순위·순서가 일치한 Top10만 공개한다. basedate가 없어도 이 대조를 통과한 목록은 공개할 수 있으나 API 내부 집계 기간을 증명했다고 안내하지 않는다. 요청 날짜만으로 기간을 확정하거나 일간 순위를 합산한 자체 주간 순위를 만들지 않는다. 동률은 공식 표시 순서 그대로 유지하고 10개 미만이면 검증한 개수만 표시한다. 출처·실제 확인 기간·확인 시각을 표시한다. 갱신 실패 시 마지막 검증 목록의 기존 기간을 그대로 유지하고 갱신 지연을 안내하며 최신 날짜로 바꾸지 않는다. 최초 미검증·미지원 분류는 공식 사이트 링크를 제공하고 자체 순위로 채우지 않는다. 분류별 성공·실패를 독립 관리한다. 현재 API 매핑·자동 대조·저장·서버 응답 구현과 운영 검증은 별도이며 이 정책 변경만으로 연동 완료로 표시하지 않는다. 공급사 문의는 명세 차이 확인 과제로 유지하지만 회신만을 유일한 공개 조건으로 두지 않는다.","group_ids":["C35","B01"],"case_ids":["TC046"],"gate_ids":["G20"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P002","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":14,"text":"**일반 신고의 본인 숨김 구현·운영 검증:** 본인 숨김의 범위·수명·해제 정책과 클라이언트 연결 구현은 승인됐다. 신고 선택값 기록만으로 실제 숨김을 완료했다고 안내하지 않으며 서버의 일치하는 처리 확인 뒤 화면을 이동·갱신한다. 실제 목록·상세·숨김 관리·필수 약속 관리 접근을 통합 검증하기 전 운영 완료로 표시하지 않는다. AI 문제 신고의 별도 비활성 조건은 유지한다.","group_ids":["C21","B02"],"case_ids":[],"gate_ids":["G09"],"scope":"확인 과제/플랫폼별 조건","qa_note":"상위 출시 조건의 자료·범위 점검으로 연결; 독립 실행 통과를 뜻하지 않음"},{"id":"P003","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":15,"text":"**Android 내부 설치 앱 검증 — 사용자 승인:** iPhone 배포 보류와 별도로 Android 내부 설치용 APK의 빌드·설치·독립 실행 검증을 진행한다. 시험용 앱 식별자와 설정은 운영 앱과 구분하며 기존 앱·데이터를 보존한다. 예시 모드 APK 검증은 실제 회원 서버 연결·스토어 배포 완료를 뜻하지 않는다.","group_ids":["C48","B03"],"case_ids":["TC066"],"gate_ids":["G28"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P004","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":16,"text":"**Apple Developer 계정 생성·iPhone 배포 검증 보류 — 사용자 확정:** 현재 Apple Developer 계정은 없으며 계정 생성은 추후로 미룬다. 계정과 서명이 필요한 iPhone 내부 배포·TestFlight·App Store 제출 검증은 계정 준비 후 진행한다. 기존 Expo Go 실기기 검증을 독립 설치 앱의 배포 검증 완료로 표시하지 않는다. 계정 생성·유료 가입을 자동 진행하지 않는다. Android 독립 설치 앱 검증과 계정 없이 가능한 빌드 설계·iOS 심사 요건 확인은 별도 범위로 관리한다.","group_ids":["C48","B03"],"case_ids":["TC067"],"gate_ids":["G28"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P005","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":17,"text":"**실제 앱 실행 검증과 인계:** 실제 공급사 호출, 앱 화면 실행, 회원 서버 통합, 실제 기기·운영 검증을 구분한다. 민규 계약 연결이 필요한 회원·DB·Storage·native 인증과 그 연결 후 통합 검증은 별도 완료 조건이다. Android·iPhone 실행에서 발견된 결함은 수정·재검증 전 완료로 표시하지 않는다. Expo Go의 주소 직접 실행·백그라운드 지원과 실제 배포 앱 실행은 별도로 검증한다. 본인 공고 소유권·채팅 읽음·추가 공개 조회·전용 큐 DB 역할 등 남은 공통 연결은 [민규 연결 요청](docs/collaboration/requests/jonghyun/2026-10-05-current-connection-requests.md)에 따라 연결·재검증한다. 최신 실행 근거와 미검증은 [실제 환경 검증 인계](docs/collaboration/requests/jonghyun/2026-10-05-real-environment-validation.md)에 기록한다.","group_ids":["C48","B03"],"case_ids":["TC066","TC068","TC069","TC070"],"gate_ids":["G04","G28"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P006","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":18,"text":"**서울 열린데이터 보안 연결 보류 — A안 확정:** HTTP 구간에서는 서울 API 키를 가로채거나 행사 응답을 변조할 수 있다. 회원 정보가 전송되지는 않지만, “위험이 없다”고 설명할 수는 없다. [OWASP 전송 보안 설명](https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html)을 근거로 평문 HTTP 수집은 활성화하지 않는다. KOPIS·TourAPI·서울 열린데이터 3개 공급사의 출시 연동 목표는 유지하되, 서울은 안전한 HTTPS 자동 수집 경로와 페이지 재개·진행 중 행사 갱신이 확인될 때까지 보류한다. 공식 HTTPS 미리보기·다운로드 경로는 존재하지만 현재 자동 수집 계약과의 적합성은 미확인이다. 서울 미완료 범위는 인수인계에 명시하며 자동 커밋·푸시·배포를 수행하지 않는다. 출시 목표를 2개 공급사로 변경하거나 서울 연결 완료로 표시하지 않는다.","group_ids":["C48","B04"],"case_ids":["TC044"],"gate_ids":["G19"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P007","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":19,"text":"**AI 공급사와 실회원 전송 조건:** 포텐스닷은 교육·프로토타입 범위로 구분한다. 사용자가 공유한 공급사 회신은 일일 한도·기간 제한, 기능 축소와 보안 우려로 실제 서비스에는 다른 API를 권고했다. 보관·학습·삭제·공동 사용의 구체 조건이 확인됐다는 뜻은 아니며, 실제 회원 대화·후기 전송은 조건 확인 전 보류한다. 무료 공급사를 이어 붙이는 전환도 공급사별 조건·품질·비용 확인 없이 활성화하지 않는다. [회신 및 공급사 전환 기록](docs/collaboration/requests/jonghyun/2026-10-19-gemini-registration-and-fallback.md)을 따른다.","group_ids":["C43","B05"],"case_ids":["TC055"],"gate_ids":["G23"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P008","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":20,"text":"**실제 AI 연결 후 한도 재설정:** 초기 회원 한도는 한국시간 하루 20회·분당 횟수 제한 없음이다. 실제 연결 후 공급사의 일일 한도량, 모델 호출당 입력·출력 토큰과 비용, 사용자 요청당 모델 호출 수를 확인하고 회원 일일 한도와 서비스 전체 예산을 재설정한다. 공급사 응답에 사용량·실제 모델명이 없거나 출력 상한의 공급사 적용이 확인되지 않으면 해당 측정·확인을 완료로 처리하지 않는다. 합성 실측에서 출력 요청 기준을 넘는 공급사 보고 토큰 사례가 확인되어 출력 상한 강제는 미완료다. 공급사의 공식 지원 필드와 실제 적용을 확인하기 전 출력 상한 보장을 안내하지 않는다. 기술 예산 예약량을 실제 토큰 사용량이나 청구금액으로 표시하지 않는다. 20회를 영구 고정값이나 이미 검증된 적정량으로 안내하지 않는다. 실제 회원 원문 전송은 아래 공급사·법률 조건 확인 전 보류하며 먼저 허용된 합성 데이터로 측정한다.","group_ids":["C46","B05"],"case_ids":["TC054","TC056"],"gate_ids":["G23"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P009","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":21,"text":"**Gemini 테스트·지출 상한·대표 계정 전환:** 종현 개인 계정의 테스트 전용 프로젝트에 기존 My Billing Account 결제를 연결하고 월50,000원 사용중단 예산을 설정했다. 선충전·정액 결제가 아니다. 공급사 집계 지연·진행 중 요청·세금 범위 때문에 최종 청구액이 반드시50,000원 이하라고 보장하지 않는다. 앱 서버의 원화 예산 예약·차단은 별도 미구현이며 새로운 하위 한도를 임의 확정하지 않는다. 가상 탐색·후기·지시문 검증3건은 통과했지만 앱 어댑터·실회원·운영 검증을 대신하지 않는다. 대표 유미 계정 전환은 회의·브랜치 통합 때 계정·프로젝트·결제·키를 확인한 뒤 진행하며 자동 실행하지 않는다. 양쪽 계정에 각각5만원으로 총예산을 늘리지 않는다. [월 예산](docs/collaboration/requests/jonghyun/2026-10-19-gemini-monthly-budget.md)·[합성 검증과 전환](docs/collaboration/requests/jonghyun/2026-10-19-gemini-synthetic-validation.md)을 따른다.","group_ids":["C43","B05"],"case_ids":["TC056"],"gate_ids":["G23"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P010","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":22,"text":"**일반 신고 운영 체계:** 일반 신고 실무·책임자는 대표 유미(조유미)다. 운영 목표는 평일 09~18시, 영업일 2일 이내 첫 확인이며 사건별 완료 예정은 별도 안내한다. 대체자는 별도로 지정되지 않았고 운영 배정·처리 목표가 실제 접근권한 설정·운영 준수 검증 완료를 뜻하지 않는다.","group_ids":["C22","B06"],"case_ids":["TC062"],"gate_ids":["G26"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P011","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":23,"text":"**공개 운영 정보:** 서비스명은 유미당, 실제 개인 운영자·책임자는 대표 조유미(유미), 공개 문의·고객지원·안전 메일은 `cumaciki0317@gmail.com`이다. 현재 별도 등록 사업자는 없다. 공개 문서에는 서비스 브랜드와 개인 운영 주체·담당 역할을 구분하며 실제 사업자·법인으로 표시하지 않는다. 삭제 요청의 응답·처리 목표와 보관 종료 조건은 13장을 따른다. 게시 요건·실제 메일 처리 체계는 검증한다.","group_ids":["C49","B06"],"case_ids":["TC062"],"gate_ids":["G26"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P012","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":24,"text":"**AI 동의의 적합성 확인:** AI 탐색은 첫 사용 시 동의·거절 시 일반 검색 유지, 후기 요약은 가입 시 열람·내 프로필 생성/노출·작성 후기 활용의 별도 선택 세 항목이라는 제품 선택을 적용한다. 가입 후 세 동의는 독립 철회하며 일반 동행·계정을 유지한다. 열람 항목의 개인정보 동의로서의 법적 분류는 확인 사항으로 남긴다. AI 미동의를 이유로 가입을 거부하거나 일반 동행·계정을 차단하지 않으며, 미동의 항목에 해당하는 AI 기능만 제한한다. 동의 문구·철회 방식의 법적 정합성과 처리 근거 확인 전 회원 원문 외부 전송은 시행하지 않는다. 기존 테스트 계정의 동의 간주는 실제 회원의 동의 증거가 아니다.","group_ids":["C08","B06"],"case_ids":["TC005"],"gate_ids":["G03","G26"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P013","chapter":"0","section":"실제 확인 대기 — 제품 선택과 구분할 사항","line":25,"text":"**실행 전 외부 확인:** 네이버 식별정보·보관 근거, AI 공급사 조건·정확한 사용량 단위·요금, 개인정보 보관·파기 근거와 백업 동작, iOS 로그인 요건·예외를 확인한다. 선택한 기간은 법정 보관기간이나 실제 삭제 성공을 뜻하지 않는다. 비용 책임자 유미·기술 운영 민규의 역할 배정과 별개로 실제 최소 권한 설정·접근 감사·운영 연결을 검증한다.","group_ids":["C49","B06"],"case_ids":["TC044","TC067"],"gate_ids":["G19","G26","G28"],"scope":"확인 과제/플랫폼별 조건","qa_note":"직접 사례에 연결"},{"id":"P014","chapter":"1","section":"1. 서비스 기본 원칙","line":29,"text":"유미당은 여성·만 19세 이상 사용자를 위한 무료 1:1 동행 서비스다.","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P015","chapter":"1","section":"1. 서비스 기본 원칙","line":30,"text":"현재 유료 동행, 결제, 정산, 수수료, 환불, 수고비 거래를 제공하지 않는다.","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P016","chapter":"1","section":"1. 서비스 기본 원칙","line":31,"text":"동행 모집과 신청 과정에 금액 입력이나 계좌 인증 단계가 없다.","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P017","chapter":"1","section":"1. 서비스 기본 원칙","line":32,"text":"합의 밖 금전 거래, 대가성 요구, 계좌 비밀번호·인증번호 공유는 금지한다.","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P018","chapter":"1","section":"1. 서비스 기본 원칙","line":33,"text":"서비스의 로그인과 자격 확인은 네이버 연동을 기준으로 한다.","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01","G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P019","chapter":"1","section":"1. 서비스 기본 원칙","line":34,"text":"학교·직장 이메일 인증과 1원 계좌 인증은 현재 화면과 이용 흐름에서 제외한다.","group_ids":["C01","B07"],"case_ids":["TC001"],"gate_ids":["G01"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P020","chapter":"2","section":"2. 가입·로그인·계정","line":40,"text":"초기 로그인 수단은 네이버 간편 로그인만 제공한다. 다른 수단은 추후 검토한다.","group_ids":["C02","B08"],"case_ids":["TC001","TC002"],"gate_ids":["G01","G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P021","chapter":"2","section":"2. 가입·로그인·계정","line":41,"text":"가입 자격은 네이버 인증정보만으로 확인하며 별도 휴대폰 본인인증은 추가하지 않는다.","group_ids":["C02","B08"],"case_ids":["TC001","TC002"],"gate_ids":["G01","G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P022","chapter":"2","section":"2. 가입·로그인·계정","line":42,"text":"네이버에서 이름·성별·생일·출생연도를 받아 여성·만 19세 이상 여부를 확인한다.","group_ids":["C02","B08"],"case_ids":["TC002"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P023","chapter":"2","section":"2. 가입·로그인·계정","line":43,"text":"필수 정보가 누락되거나 확인할 수 없으면 가입을 보류하고 네이버 정보 확인과 재시도를 안내한다.","group_ids":["C02","B08"],"case_ids":["TC002"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P024","chapter":"2","section":"2. 가입·로그인·계정","line":44,"text":"만 19세 미만 또는 대상 자격을 충족하지 않으면 가입할 수 없다.","group_ids":["C02","B08"],"case_ids":["TC002"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P025","chapter":"2","section":"2. 가입·로그인·계정","line":45,"text":"네이버 계정 하나에는 유미당 계정 하나를 연결한다.","group_ids":["C02","B08"],"case_ids":["TC002","TC003"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P026","chapter":"2","section":"2. 가입·로그인·계정","line":46,"text":"신규 회원은 S05 로그인·자격 확인 후 S06 가입 프로필로 이동한다.","group_ids":["C02","B08"],"case_ids":["TC002","TC003"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P027","chapter":"2","section":"2. 가입·로그인·계정","line":47,"text":"기존 회원은 로그인 전 시도했던 목적 화면으로 복귀하고, 복귀 대상이 없으면 홈으로 이동한다.","group_ids":["C02","B08"],"case_ids":["TC002","TC003"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P028","chapter":"2","section":"2. 가입·로그인·계정","line":51,"text":"프로필 사진은 필수다. 사진 선택만으로 가입이 완료되지 않으며 `가입 완료`를 눌러야 한다.","group_ids":["C03","B09"],"case_ids":["TC003"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P029","chapter":"2","section":"2. 가입·로그인·계정","line":52,"text":"사진 형식은 JPG·JPEG·PNG, 원본 크기는 10MB 이하로 안내한다.","group_ids":["C03","B09"],"case_ids":["TC003"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P030","chapter":"2","section":"2. 가입·로그인·계정","line":53,"text":"관심사와 대화 방식은 선택이며 기본 선택지와 직접 입력을 지원한다.","group_ids":["C04","B09"],"case_ids":["TC003"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P031","chapter":"2","section":"2. 가입·로그인·계정","line":54,"text":"관심사·대화 방식은 각각 최대 20개, 항목당 40자까지로 표현한다.","group_ids":["C04","B09"],"case_ids":["TC003"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P032","chapter":"2","section":"2. 가입·로그인·계정","line":55,"text":"MBTI는 E/I, S/N, T/F, J/P 네 쌍으로 선택하며 비워둘 수 있다.","group_ids":["C04","B09"],"case_ids":["TC003"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P033","chapter":"2","section":"2. 가입·로그인·계정","line":56,"text":"가입 완료 후 안내 팝업을 확인하면 보존한 목적 화면이 있고 현재 접근 가능한 경우 그 화면으로 복귀한다. 행사 상세에서 시작한 경우 해당 행사 연결 작성으로 돌아가 상태를 다시 확인한다. 목적이 없거나 접근할 수 없으면 S00 홈으로 이동하며 별도 가입 완료 화면은 만들지 않는다.","group_ids":["C03","B09"],"case_ids":["TC003"],"gate_ids":["G02"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P034","chapter":"2","section":"2. 가입·로그인·계정","line":60,"text":"S21에서 네이버 본인·성인 확인 상태, 실명과 마스킹 이름, 성별·나이, 가입일, 제재 내역을 확인한다.","group_ids":["C05","B10"],"case_ids":[],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"상위 출시 조건의 자료·범위 점검으로 연결; 독립 실행 통과를 뜻하지 않음"},{"id":"P035","chapter":"2","section":"2. 가입·로그인·계정","line":61,"text":"계정 상태는 정상, 경고, 이용 정지로 구분한다.","group_ids":["C05","B10"],"case_ids":[],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"상위 출시 조건의 자료·범위 점검으로 연결; 독립 실행 통과를 뜻하지 않음"},{"id":"P036","chapter":"2","section":"2. 가입·로그인·계정","line":62,"text":"확정된 동행을 연속 3번 취소한 사용자에게 첫 경고를 적용한다.","group_ids":["C06","B11"],"case_ids":["TC018"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P037","chapter":"2","section":"2. 가입·로그인·계정","line":63,"text":"취소·완료 결과 확정 직전 양쪽이 합의한 최신 예정 시작 시각 순서로 결과를 집계한다. 시작 시각이 같으면 동행 확정 시각이 빠른 순서, 그것도 같으면 내부 고유번호 순서로 고정한다. 중간 동행의 결과가 미정이면 그 뒤 연속 판정을 보류한다. 취소 버튼을 누른 순서로 제재를 판정하지 않는다.","group_ids":["C06","B11"],"case_ids":["TC018"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P038","chapter":"2","section":"2. 가입·로그인·계정","line":64,"text":"정상 완료하면 연속 취소 횟수를 0으로 초기화한다. 확정 전 철회와 상대방 취소는 본인의 취소 횟수에 포함하지 않는다.","group_ids":["C06","B11"],"case_ids":["TC018"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P039","chapter":"2","section":"2. 가입·로그인·계정","line":65,"text":"첫 경고와 각 제재마다 횟수만 0으로 초기화한다. 정상 완료·탈퇴·재가입으로 경고 이력은 지우지 않는다. 첫 경고 이후 다시 연속 3번 취소할 때마다 7일 제한을 적용한다.","group_ids":["C06","B11"],"case_ids":["TC018"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P040","chapter":"2","section":"2. 가입·로그인·계정","line":66,"text":"7일 동안 신규 공고 작성·신규 신청·재신청·새 확정 요청·수락을 제한한다. 기존 확정 약속 관리·기존 채팅·후기는 허용한다. 복원된 신청에도 새 확정 요청·수락 제한을 적용한다.","group_ids":["C06","B11"],"case_ids":["TC018"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P041","chapter":"2","section":"2. 가입·로그인·계정","line":67,"text":"취소 사유 이의 신청은 취소 처리 후 24시간 이내 접수한다. 취소 횟수는 우선 반영하되 이의 신청 기한 종료까지 해당 취소에 근거한 경고·제재 적용을 보류한다.","group_ids":["C06","B11"],"case_ids":["TC019"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P042","chapter":"2","section":"2. 가입·로그인·계정","line":68,"text":"기한 내 이의 신청이 없으면 기한 종료 후 적용 가능한 경고·제재를 판정한다. 신청이 있으면 운영 검토 종료 후 판정하며 인정된 예외 사유는 제외한다. 예정 시작 시각 순서의 중간 결과가 미정이면 연속 판정 보류도 유지한다.","group_ids":["C06","B11"],"case_ids":["TC019"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P043","chapter":"2","section":"2. 가입·로그인·계정","line":69,"text":"7일 기능 제한은 실제 제재 적용 시각부터 계산한다. 이의 신청 대기·검토 기간을 제재 기간에 포함하지 않는다. 예외 인정 결과는 예정 시작 시각 순서의 집계에 반영한다.","group_ids":["C06","B11"],"case_ids":["TC019"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P044","chapter":"2","section":"2. 가입·로그인·계정","line":70,"text":"취소 제재가 겹치면 각각 실제 적용 시각부터 7일로 계산하고 가장 늦은 종료 시각까지 유지한다. 기간을 단순 합산하지 않는다.","group_ids":["C06","B11"],"case_ids":["TC019"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P045","chapter":"2","section":"2. 가입·로그인·계정","line":71,"text":"예외·오판 정정은 원래 집계 순서로 재계산한다. 잘못된 경고·남은 제한을 즉시 취소하고 정정 이유와 바뀐 상태를 알린다.","group_ids":["C06","B11"],"case_ids":["TC018"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P046","chapter":"2","section":"2. 가입·로그인·계정","line":72,"text":"S21에서 사유·이의 마감·검토 상태·실제 제한 종료를 보여주며 대기·적용·해제 상태 변경을 알린다.","group_ids":["C06","B10"],"case_ids":["TC019"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P047","chapter":"2","section":"2. 가입·로그인·계정","line":73,"text":"정정 재계산 후 같은 취소 제재가 유지되면 기존 시작 시각을 보존한다. 정정으로 새로 생긴 제재만 실제 새 적용 시각부터 계산하며 정정 자체로 기존 기간을 연장하지 않는다.","group_ids":["C06","B11"],"case_ids":["TC018","TC019"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P048","chapter":"2","section":"2. 가입·로그인·계정","line":74,"text":"탈퇴 전 사건이 탈퇴 후 처음 제재로 확정되면 동일 네이버 계정에 경고·기간제·영구 제재를 적용하고 재가입 시 승계한다. 과거 사건의 감점을 새 가입 회차 당도로 이전하지 않는다. 새 회차 당도15 기준과 기존 회차 기록을 구분한다.","group_ids":["C06","B11"],"case_ids":["TC019","TC031","TC059"],"gate_ids":["G08","G25"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P049","chapter":"2","section":"2. 가입·로그인·계정","line":75,"text":"탈퇴 시 작성 공고와 진행 중 신청을 취소한다.","group_ids":["C07","B12"],"case_ids":["TC058"],"gate_ids":["G25"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P050","chapter":"2","section":"2. 가입·로그인·계정","line":76,"text":"진행 중인 확정 약속이 있으면 탈퇴할 수 없다. 후기 작성 기간만 남거나 진행 확정 약속 없이 분쟁만 남았다면 탈퇴할 수 있고 분쟁 처리는 별도로 유지한다.","group_ids":["C07","B12"],"case_ids":["TC058"],"gate_ids":["G25"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P051","chapter":"2","section":"2. 가입·로그인·계정","line":77,"text":"일반·경고·제재 중 모두 재가입을 즉시 허용한다. 기간제 제재는 원래 종료 시각까지 동일 기능 제한을 승계한다. 영구 이용 제한은 종료 시각 없이 승계하며 재가입이 활동 재개를 뜻하지 않는다. 재가입으로 제재 기간을 초기화하거나 연장하지 않는다.","group_ids":["C07","B12"],"case_ids":["TC059"],"gate_ids":["G25"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P052","chapter":"2","section":"2. 가입·로그인·계정","line":78,"text":"동일 네이버 계정의 검증된 식별값으로 제재·경고 이력과 연속 취소 기록을 연결한다. 이름·생일만으로 다른 네이버 계정을 동일인이라고 판단하거나 자동 차단하지 않는다. 식별값 제공·보관의 기술적·법적 가능성은 확인한다.","group_ids":["C07","B12"],"case_ids":["TC059"],"gate_ids":["G25"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P053","chapter":"2","section":"2. 가입·로그인·계정","line":79,"text":"재가입은 새 프로필·당도 초기값 15·완료 횟수 0으로 시작하고 과거 받은 후기·당도를 복구하지 않는다. 안전·제재 기록과 기존 익명 공개 후기는 별도로 유지한다.","group_ids":["C07","B12"],"case_ids":["TC031","TC059"],"gate_ids":["G25"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P054","chapter":"2","section":"2. 가입·로그인·계정","line":80,"text":"네이버 계정당 유미당 계정은 1개이며 연결 계정 변경·계정 간 활동 기록 이전은 제공하지 않는다. S21의 `다른 네이버 계정으로 변경` 항목은 제거한다. 일반 로그인·로그아웃은 유지한다.","group_ids":["C05","B12"],"case_ids":["TC001","TC003","TC059"],"gate_ids":["G01","G25"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P055","chapter":"2","section":"2. 가입·로그인·계정","line":81,"text":"탈퇴 후에도 상대방은 남은 후기 기한까지 작성할 수 있다. 탈퇴 회원으로 표시하고 기존 공개 후기는 익명으로 유지한다.","group_ids":["C07","B12"],"case_ids":["TC058"],"gate_ids":["G25"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P056","chapter":"2","section":"2. 가입·로그인·계정","line":82,"text":"탈퇴한 본인은 신규 후기를 작성할 수 없다. 한쪽 후기 공개는 원래 후기 기한 종료 기준을 유지한다.","group_ids":["C07","B12"],"case_ids":["TC058"],"gate_ids":["G25"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P057","chapter":"2","section":"2. 가입·로그인·계정","line":83,"text":"기존 탈퇴 진입 화면에 `즉시 삭제 / 조건부 보관 / 백업 별도` 세 묶음 요약과 `자세히 보기` 펼침을 둔다. 펼침에는 13장의 자료별 기간·기산점·미확인 조건과 공개 개인정보처리방침 삭제 요청 구역 링크를 연결한다. 새 탈퇴 안내 페이지를 추가하지 않으며 서버가 확인한 처리 중·완료·확인 필요를 구분한다.","group_ids":["C07","B12"],"case_ids":["TC058"],"gate_ids":["G25"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P058","chapter":"2","section":"2. 가입·로그인·계정","line":87,"text":"후기 요약 동의는 가입 시 별도 선택 체크 세 항목으로 받는 제품 의도다: `AI 후기 요약 열람`, `내 프로필의 AI 후기 요약 생성·노출`, `내가 작성한 후기를 상대방 프로필의 AI 후기 요약 생성에 활용`.","group_ids":["C08","B13"],"case_ids":["TC004"],"gate_ids":["G03"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P059","chapter":"2","section":"2. 가입·로그인·계정","line":88,"text":"체크는 기본 미선택이며 짧은 안내와 항목별 `자세히 보기`를 제공한다. 실제 전송 항목·목적·공급사·보관 조건은 상세 안내에 설명한다. 짧은 문구가 구체적인 처리 안내를 대신하지 않는다.","group_ids":["C08","B13"],"case_ids":["TC004"],"gate_ids":["G03"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P060","chapter":"2","section":"2. 가입·로그인·계정","line":89,"text":"같은 가입 화면에 `전체 동의`를 둔다. 체크하면 모든 개별 항목이 선택되고 해제하면 모두 해제된다. 개별 항목을 하나라도 해제하면 전체 동의도 해제되며, 모든 개별 항목이 선택되면 전체 동의도 선택된다. 개별 동의·자세히 보기는 계속 제공한다. AI 탐색 첫 사용 동의는 포함하지 않는다.","group_ids":["C08","B13"],"case_ids":["TC004"],"gate_ids":["G03"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P061","chapter":"2","section":"2. 가입·로그인·계정","line":90,"text":"현재 기존 계정은 모두 테스트 계정이므로 테스트 시나리오에서는 AI 관련 동의 완료로 간주하고 재동의를 생략한다. 신규 가입의 기본 미선택 원칙은 유지한다. 테스트 가정을 실제 회원의 동의 증거 생성·DB 값 변경·외부 전송 승인으로 사용하지 않는다.","group_ids":["C08","B13"],"case_ids":["TC004"],"gate_ids":["G03"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P062","chapter":"2","section":"2. 가입·로그인·계정","line":91,"text":"AI 미동의를 이유로 가입을 거부하거나 일반 동행·계정을 차단하지 않고 미동의 항목에 해당하는 AI 기능만 제한한다. 제품 선택과 법적 적합성·공급사 조건의 확인을 구분하며 확인 전 회원 원문 외부 전송 보류를 유지한다.","group_ids":["C08","B13"],"case_ids":["TC004"],"gate_ids":["G03"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P063","chapter":"3","section":"3. 이름·위치·프로필 공개 범위","line":97,"text":"| 본인 | 홈과 계정 화면에서 본인 실명, 계정 정보, 현재 당도, 활동 내역 |","group_ids":["C09","B14"],"case_ids":["TC006"],"gate_ids":["G04"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P064","chapter":"3","section":"3. 이름·위치·프로필 공개 범위","line":99,"text":"| 로그인·미확정 | 마스킹 이름, 만 나이, 공개 지역, 허용된 성향·후기·현재 당도 |","group_ids":["C09","B14"],"case_ids":["TC006"],"gate_ids":["G04"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P065","chapter":"3","section":"3. 이름·위치·프로필 공개 범위","line":100,"text":"| 동행 확정 완료 | 상대 전체 이름, 정확한 주소와 상세 만남 지점, 확정 약속 정보 |","group_ids":["C09","B14"],"case_ids":["TC006"],"gate_ids":["G04"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P066","chapter":"3","section":"3. 이름·위치·프로필 공개 범위","line":101,"text":"| 확정 공고의 제3자 | 확정 상태만 확인하며 상대 실명과 상세 위치는 볼 수 없음 |","group_ids":["C09","B14"],"case_ids":["TC006"],"gate_ids":["G04"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P067","chapter":"3","section":"3. 이름·위치·프로필 공개 범위","line":102,"text":"| 취소 성립 후 | 전체 이름을 다시 마스킹하고 정확한 주소·상세 지점을 즉시 숨김 |","group_ids":["C09","B14"],"case_ids":["TC006","TC007","TC068"],"gate_ids":["G04"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P068","chapter":"3","section":"3. 이름·위치·프로필 공개 범위","line":104,"text":"공고 목록에는 동까지의 공개 지역만 표시한다. 비로그인 작성자 가드는 실제 개인정보를 HTML·응답에 넣고 CSS로 가리는 방식으로 만들지 않는다.","group_ids":["C09","B14"],"case_ids":["TC006"],"gate_ids":["G04"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P069","chapter":"3","section":"3. 이름·위치·프로필 공개 범위","line":105,"text":"상세 만남 지점은 작성자 확정 요청에 신청자가 수락하여 확정된 뒤 당사자에게만 공개한다.","group_ids":["C09","B14"],"case_ids":["TC006"],"gate_ids":["G04"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P070","chapter":"3","section":"3. 이름·위치·프로필 공개 범위","line":106,"text":"공고 검색은 제목·등록 장소명·등록 주소·연결 행사명을 대상으로 한다.","group_ids":["C10","B15"],"case_ids":["TC006","TC008"],"gate_ids":["G04","G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P071","chapter":"3","section":"3. 이름·위치·프로필 공개 범위","line":107,"text":"소개글, 후기, 비공개 상세 지점은 검색 대상이 아니다.","group_ids":["C10","B15"],"case_ids":["TC006","TC008"],"gate_ids":["G04","G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P072","chapter":"3","section":"3. 이름·위치·프로필 공개 범위","line":108,"text":"프로필 성향은 프로필 열람 권한이 있는 회원에게만 공개한다.","group_ids":["C09","B14"],"case_ids":["TC006","TC008"],"gate_ids":["G04","G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P073","chapter":"4","section":"4. 공고 탐색·작성·관리","line":114,"text":"둘러보기 기본 정렬은 등록일 최신순이며 시작일 빠른순으로 전환할 수 있다.","group_ids":["C10","B15"],"case_ids":["TC008"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P074","chapter":"4","section":"4. 공고 탐색·작성·관리","line":115,"text":"필터는 카테고리, 지역(시·도), 일정, 작성자 만 나이 19~99세 범위를 제공한다.","group_ids":["C10","B15"],"case_ids":["TC008"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P075","chapter":"4","section":"4. 공고 탐색·작성·관리","line":116,"text":"비로그인은 일정과 나이 상세 필터를 사용하지 못하고 전체 범위만 본다.","group_ids":["C10","B15"],"case_ids":["TC008"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P076","chapter":"4","section":"4. 공고 탐색·작성·관리","line":117,"text":"기본 목록은 모집 상태와 관계없이 전부 노출한다. `모집 중` 필터를 활성화하면 모집 중 공고만 노출한다. 삭제된 공고의 기존 비노출 원칙은 유지한다.","group_ids":["C10","B15"],"case_ids":["TC008","TC009"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P077","chapter":"4","section":"4. 공고 탐색·작성·관리","line":118,"text":"필터는 `적용하기`를 눌러야 결과에 반영되며 초기화를 제공한다.","group_ids":["C10","B15"],"case_ids":["TC008","TC009"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P078","chapter":"4","section":"4. 공고 탐색·작성·관리","line":119,"text":"결과 없음과 조회 실패를 구분하고, 실패를 0건으로 표시하지 않는다.","group_ids":["C10","B15"],"case_ids":["TC008","TC009"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P079","chapter":"4","section":"4. 공고 탐색·작성·관리","line":120,"text":"공고·행사는 처음과 추가 조회마다 10개씩, 후기는 5개씩 가져온다. 전체 결과 수와 한 화면의 카드 수를 제한하는 뜻은 아니다.","group_ids":["C10","B15"],"case_ids":["TC009"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P080","chapter":"4","section":"4. 공고 탐색·작성·관리","line":121,"text":"최근 검색어는 같은 기기에 최대 10개를 7일 보관하며 직접 삭제·로그아웃 시 정리한다.","group_ids":["C10","B15"],"case_ids":["TC009"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P081","chapter":"4","section":"4. 공고 탐색·작성·관리","line":122,"text":"공고 카테고리는 지금이당·전시·축제·팝업·공연·영화·맛집·카페·쇼핑·여행·운동·산책·게임·반려동물·스터디·기타 16개다.","group_ids":["C10","B15"],"case_ids":["TC001","TC008"],"gate_ids":["G01","G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P082","chapter":"4","section":"4. 공고 탐색·작성·관리","line":126,"text":"필수 항목은 카테고리, 제목, 소개, 장소, 시작 일시, 종료 일시다.","group_ids":["C11","B16"],"case_ids":["TC010"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P083","chapter":"4","section":"4. 공고 탐색·작성·관리","line":127,"text":"모집 마감은 선택이며 미설정 시 동행 시작 시각에 마감한다.","group_ids":["C11","B16"],"case_ids":["TC010"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P084","chapter":"4","section":"4. 공고 탐색·작성·관리","line":128,"text":"장소는 Kakao Local 기반 장소명 검색 또는 우편번호 기반 주소 검색으로 선택한다.","group_ids":["C11","B16"],"case_ids":["TC010"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P085","chapter":"4","section":"4. 공고 탐색·작성·관리","line":129,"text":"같은 이름의 장소는 주소와 우편번호로 구분한다.","group_ids":["C11","B16"],"case_ids":["TC010"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P086","chapter":"4","section":"4. 공고 탐색·작성·관리","line":130,"text":"공개 지역과 상세 만남 지점을 분리한다.","group_ids":["C11","B16"],"case_ids":["TC006","TC010"],"gate_ids":["G04","G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P087","chapter":"4","section":"4. 공고 탐색·작성·관리","line":131,"text":"행사 연결은 선택이며, 행사 선택이 작성 중인 동행 일정을 자동 변경하지 않는다. 일반 작성은 행사 영역을 맨 아래, 행사 상세에서 시작한 작성은 맨 위에 둔다. 직접 입력 행사는 해당 공고에만 표시한다. 상세 기준은 8장을 따른다.","group_ids":["C11","B17"],"case_ids":["TC010","TC037"],"gate_ids":["G05","G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P088","chapter":"4","section":"4. 공고 탐색·작성·관리","line":132,"text":"제목·본문에서 연락처·계좌·비공개 상세 위치 등 개인정보가 감지되면 등록을 차단하고 수정 또는 오탐 문의를 안내한다.","group_ids":["C11","B16"],"case_ids":["TC010","TC025"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P089","chapter":"4","section":"4. 공고 탐색·작성·관리","line":133,"text":"제목은 50자, 소개는 2,000자, 상세 만남 지점은 300자까지다.","group_ids":["C11","B16"],"case_ids":["TC010"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P090","chapter":"4","section":"4. 공고 탐색·작성·관리","line":134,"text":"작성 초안은 같은 기기 브라우저에 최근 1개만 임시 저장한다. 새 초안으로 대체하기 전에 알리며 마지막 수정부터 7일 뒤 만료한다. 복원 안내에 만료 시각을 표시하고 등록 성공·로그아웃 시 삭제한다.","group_ids":["C12","B16"],"case_ids":["TC010"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P091","chapter":"4","section":"4. 공고 탐색·작성·관리","line":135,"text":"등록 성공 시 별도 완료 화면 없이 생성된 S02 공고 상세로 이동한다.","group_ids":["C11","B16"],"case_ids":["TC010"],"gate_ids":["G05"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P092","chapter":"4","section":"4. 공고 탐색·작성·관리","line":139,"text":"공고 상태는 모집 중, 수동 마감, 최종 동의 대기, 확정, 완료, 삭제 등으로 구분한다.","group_ids":["C13","B18"],"case_ids":["TC013"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P093","chapter":"4","section":"4. 공고 탐색·작성·관리","line":140,"text":"수동 마감은 새 신청만 막고 기존 유효 신청자와의 대화는 보존한다. 기존 와이어프레임의 시작 전 최종 동의 재요청 흐름을 유지한다.","group_ids":["C13","B18"],"case_ids":["TC013"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P094","chapter":"4","section":"4. 공고 탐색·작성·관리","line":141,"text":"확정 전 핵심 조건 변경 시 신청자에게 알리고 기존 최종 동의 요청을 무효화한다. 새 조건으로 다시 요청하고 동의받는다.","group_ids":["C13","B18"],"case_ids":["TC013"],"gate_ids":["G06","G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P095","chapter":"4","section":"4. 공고 탐색·작성·관리","line":142,"text":"확정 전 삭제 시 공개 목록에서 숨기고 미확정 요청을 종료하며 기존 대화는 읽기 전용으로 보존한다.","group_ids":["C13","B18"],"case_ids":["TC013"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P096","chapter":"4","section":"4. 공고 탐색·작성·관리","line":143,"text":"확정 후에는 공고 삭제로 약속 취소를 대신하지 않는다. S18의 확정 동행 취소 절차를 사용한다.","group_ids":["C13","B18"],"case_ids":["TC013"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P097","chapter":"5","section":"5. 신청·채팅·최종 동의","line":149,"text":"별도 신청 메시지 입력·제출 화면을 없앤다. 공고의 신청 버튼을 누르면 작성자와의 1:1 S11 채팅 화면으로 바로 이동한다.","group_ids":["C14","B19"],"case_ids":["TC011"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P098","chapter":"5","section":"5. 신청·채팅·최종 동의","line":150,"text":"첫 채팅이 성공적으로 전송된 시점에 신청이 성립한다. 그 전에는 신청 처리하지 않고 작성자에게 알림을 보내지 않으며 작성자 측 채팅방도 생성하지 않는다.","group_ids":["C14","B19"],"case_ids":["TC011"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P099","chapter":"5","section":"5. 신청·채팅·최종 동의","line":151,"text":"첫 채팅 없이 이탈하면 미신청 상태다. 첫 전송 실패 시에도 신청이 성립하지 않는다.","group_ids":["C14","B19"],"case_ids":["TC011"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P100","chapter":"5","section":"5. 신청·채팅·최종 동의","line":152,"text":"재신청은 동일 공고·상대의 기존 채팅방과 이력을 재사용하며 새 메시지 전송 성공 시 성립한다. 첫 채팅 전 미전송 입력은 현재 화면 메모리에만 유지한다. 화면을 나가면 삭제된다는 안내 후 삭제한다.","group_ids":["C14","B19"],"case_ids":["TC011","TC012"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P101","chapter":"5","section":"5. 신청·채팅·최종 동의","line":153,"text":"일정이 기존 확정 약속과 겹치면 경고하지만 신청 자체는 계속할 수 있다.","group_ids":["C14","B19"],"case_ids":["TC011","TC016"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P102","chapter":"5","section":"5. 신청·채팅·최종 동의","line":154,"text":"첫 채팅 전송과 동시에 작성자에게 채팅이 도착하고 해당 공고의 신청자와 작성자 간 1:1 채팅방이 생성된다.","group_ids":["C14","B19"],"case_ids":["TC011"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P103","chapter":"5","section":"5. 신청·채팅·최종 동의","line":155,"text":"본인이 신청을 철회한 경우 횟수 제한 없이 재신청할 수 있으나, 철회 후 1분 동안은 재신청할 수 없다.","group_ids":["C14","B19"],"case_ids":["TC012"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P104","chapter":"5","section":"5. 신청·채팅·최종 동의","line":156,"text":"작성자에게 거절된 경우 같은 공고에 다시 신청할 수 없다.","group_ids":["C14","B19"],"case_ids":["TC012"],"gate_ids":["G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P105","chapter":"5","section":"5. 신청·채팅·최종 동의","line":157,"text":"신청 단계에는 비용·결제 절차가 없다.","group_ids":["C14","B19"],"case_ids":["TC001"],"gate_ids":["G01","G06"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P106","chapter":"5","section":"5. 신청·채팅·최종 동의","line":161,"text":"여러 신청자와 대화·합의한 뒤 작성자가 확정 요청을 보내고 신청자가 수락하면 확정한다. 작성자 버튼만으로 즉시 확정되지 않는다.","group_ids":["C15","B20"],"case_ids":["TC014"],"gate_ids":["G06","G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P107","chapter":"5","section":"5. 신청·채팅·최종 동의","line":162,"text":"기존 와이어프레임과 같이 한 번에 한 명에게 요청한다. 대기 중인 요청을 철회한 뒤 다른 신청자에게 요청할 수 있다.","group_ids":["C15","B20"],"case_ids":["TC014"],"gate_ids":["G06","G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P108","chapter":"5","section":"5. 신청·채팅·최종 동의","line":163,"text":"확정 요청은 요청 후 6시간과 동행 시작 시각 중 빠른 때 만료된다. 만료 시 미확정으로 돌아가고 신청·대화는 유지한다.","group_ids":["C15","B20"],"case_ids":["TC014"],"gate_ids":["G06","G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P109","chapter":"5","section":"5. 신청·채팅·최종 동의","line":164,"text":"한 명이 확정되면 다른 신청은 모집 종료로 처리하고 해당 채팅을 읽기 전용으로 전환한다. 작성자 거절과 구분한다.","group_ids":["C15","B20"],"case_ids":["TC013","TC014"],"gate_ids":["G06","G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P110","chapter":"5","section":"5. 신청·채팅·최종 동의","line":165,"text":"확정 취소 후 작성자가 모집을 재개하면 이전 유효 신청·채팅을 자동 복원하고 알린다. 거절·본인 철회된 신청은 복원하지 않는다. 취소만으로 자동 모집 재개하지 않는다.","group_ids":["C15","B20"],"case_ids":["TC013"],"gate_ids":["G06","G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P111","chapter":"5","section":"5. 신청·채팅·최종 동의","line":166,"text":"기존 확정 약속과 일정이 겹치면 새 확정을 차단하고 기존 약속을 자동 취소하지 않는다.","group_ids":["C15","B20"],"case_ids":["TC014","TC016"],"gate_ids":["G06","G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P112","chapter":"5","section":"5. 신청·채팅·최종 동의","line":167,"text":"메시지 전송 실패 시 내용을 유지하고 재전송을 제공한다.","group_ids":["C16","B21"],"case_ids":["TC011","TC069"],"gate_ids":["G06","G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P113","chapter":"5","section":"5. 신청·채팅·최종 동의","line":168,"text":"종료된 대화는 읽기 전용으로 보존한다.","group_ids":["C16","B21"],"case_ids":["TC013"],"gate_ids":["G06","G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P114","chapter":"5","section":"5. 신청·채팅·최종 동의","line":169,"text":"대화방 나가기는 본인 목록에서만 숨기며 상대방 기록을 삭제하지 않는다.","group_ids":["C16","B21"],"case_ids":["TC013"],"gate_ids":["G06","G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P115","chapter":"5","section":"5. 신청·채팅·최종 동의","line":173,"text":"양쪽 누구나 일정·장소 변경을 제안하고 상대 수락·일정 충돌 확인 후 변경한다.","group_ids":["C17","B22"],"case_ids":["TC015","TC016"],"gate_ids":["G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P116","chapter":"5","section":"5. 신청·채팅·최종 동의","line":174,"text":"변경 제안은 제안 후 6시간, 기존 시작 시각, 새 시작 시각 중 가장 빠른 때 만료된다.","group_ids":["C17","B22"],"case_ids":["TC015"],"gate_ids":["G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P117","chapter":"5","section":"5. 신청·채팅·최종 동의","line":175,"text":"거절·철회·미응답이면 기존 약속을 유지한다. 상대 수락 전에는 변경을 반영하지 않는다.","group_ids":["C17","B22"],"case_ids":["TC015"],"gate_ids":["G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P118","chapter":"5","section":"5. 신청·채팅·최종 동의","line":176,"text":"수락·후기 제출·이의 신청 등 마감이 있는 요청은 서버 접수 시각으로 판단한다. 마감 시각보다 빠를 때만 허용하고 같거나 늦으면 만료다. 재신청은 별도의 최소 대기 조건이므로 철회 후 1분이 경과하면 허용한다.","group_ids":["C17","B22"],"case_ids":["TC012","TC014","TC015","TC019","TC024","TC028"],"gate_ids":["G07"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P119","chapter":"6","section":"6. 철회·취소·신고","line":180,"text":"확정 전 신청 철회와 확정 후 시작 전 취소를 구분한다.","group_ids":["C18","B23"],"case_ids":["TC012","TC017"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P120","chapter":"6","section":"6. 철회·취소·신고","line":181,"text":"확정 전 철회는 연속 확정 취소 제재에 포함하지 않는다. 재신청은 철회 후 1분 경과 시 횟수 제한 없이 허용하되 작성자 거절 이력이 있으면 차단한다.","group_ids":["C18","B23"],"case_ids":["TC012","TC017"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P121","chapter":"6","section":"6. 철회·취소·신고","line":182,"text":"확정 후 시작 전 취소는 사유를 선택해 처리하고 상대에게 알림을 보낸다.","group_ids":["C18","B23"],"case_ids":["TC017"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P122","chapter":"6","section":"6. 철회·취소·신고","line":183,"text":"취소 성립 즉시 전체 이름을 다시 마스킹하고 상세 주소를 숨긴다.","group_ids":["C18","B23"],"case_ids":["TC007","TC017","TC068"],"gate_ids":["G04","G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P123","chapter":"6","section":"6. 철회·취소·신고","line":184,"text":"시작 이후에는 일방 취소 대신 중단·불발 신고로 접수한다.","group_ids":["C18","B23"],"case_ids":["TC017"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P124","chapter":"6","section":"6. 철회·취소·신고","line":185,"text":"중단·불발 신고에는 상황 설명이 필요하며 운영 검토 후 조치한다.","group_ids":["C18","B23"],"case_ids":["TC017"],"gate_ids":["G08"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P125","chapter":"6","section":"6. 철회·취소·신고","line":188,"text":"차단한 두 사람 사이의 신규 메시지·신청·확정 요청·수락을 막는다. 로그인 상태에서 서로의 공고·프로필을 숨기되 기존 약속 관리에 필요한 정보는 유지한다. 비로그인 공개 접근까지 완전히 막는다고 안내하지 않는다.","group_ids":["C19","B24"],"case_ids":["TC020"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P126","chapter":"6","section":"6. 철회·취소·신고","line":189,"text":"기존 대화는 읽기 전용으로 두고 기록 확인·신고·나가기를 제공한다. 차단은 즉시 처리하며 확정 약속의 취소는 별도 확인과 기존 취소 규칙을 따른다.","group_ids":["C19","B24"],"case_ids":["TC020"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P127","chapter":"6","section":"6. 철회·취소·신고","line":190,"text":"차단은 언제든 해제할 수 있으나 종료 신청·취소 약속을 자동 복원하지 않는다. 차단만으로 후기·당도·칭찬은 바뀌지 않는다.","group_ids":["C19","B24"],"case_ids":["TC020"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P128","chapter":"6","section":"6. 철회·취소·신고","line":191,"text":"차단 해제는 차단 때문에 생긴 숨김만 해제한다. 신고 등에서 본인이 별도로 선택한 콘텐츠 숨김은 유지하며 숨김 관리에서 명시적으로 해제한다. 해제 뒤에도 현재 접근 권한을 다시 확인한다.","group_ids":["C19","B24"],"case_ids":["TC020","TC021"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P129","chapter":"6","section":"6. 철회·취소·신고","line":195,"text":"운영자는 DB의 회원 채팅 원문을 직접 읽지 않는다. 온라인 신고는 상황 설명과 캡처를 필수로 받는다. 대면 위협·노쇼는 설명과 제출 가능한 자료로 접수하며 캡처가 없다는 이유만으로 접수를 막지 않는다. 접수 자체를 사실 인정으로 취급하지 않는다.","group_ids":["C20","B25"],"case_ids":["TC022"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P130","chapter":"6","section":"6. 철회·취소·신고","line":196,"text":"공고·채팅·AI 결과는 전용 신고 양식, 다른 대상은 대상이 연결된 공통 양식으로 접수한다. 성희롱·협박·금전/개인정보 요구·사칭·스팸·노쇼·기타를 복수 선택하고 설명할 수 있다.","group_ids":["C20","B25"],"case_ids":["TC022"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P131","chapter":"6","section":"6. 철회·취소·신고","line":197,"text":"신고자에게 해당 내용 숨김 선택을 제공한다. 전체 공개 제한은 운영 검토 후 결정하며 동행 분쟁의 완료·후기 보류와 구분한다. 신고 자료를 이의 절차 포함 최종 종결 후 90일에 삭제해도 신고자가 선택한 본인 화면의 숨김은 본인이 해제할 때까지 유지한다. 숨김 처리에 필요한 최소 식별 기록만 신고 자료와 분리해 보관하며 신고 설명·캡처·증거를 숨김 유지 목적으로 보관하지 않는다. 차단·운영자의 전체 공개 제한·제재와 별도다. 숨김 요청·해제는 서버 처리 확인 후 반영하고 실패 시 성공으로 표시하지 않는다.","group_ids":["C21","B25"],"case_ids":["TC021","TC022"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P132","chapter":"6","section":"6. 철회·취소·신고","line":198,"text":"본인 숨김은 탐색·콘텐츠 조회에만 적용한다. 확정 동행 일정·취소·신고·판정 안내 등 필수 관리 경로는 유지하며 타인의 공개 상태·검색 일치·제재를 변경하지 않는다. 신고 자료가 파기되어도 최소 숨김 기록은 유지하고 해제하면 현재 권한으로 다시 조회한다.","group_ids":["C21","B25"],"case_ids":["TC021","TC022"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P133","chapter":"6","section":"6. 철회·취소·신고","line":199,"text":"접수·검토 중·추가 자료 요청·처리 완료 및 내 신고 내역을 표시한다. 신고자에게 조치 여부·대표 사유, 제재 당사자에게 본인 위반·제재·이의 절차만 안내한다. 신고자 신원·다른 사건은 공개하지 않는다.","group_ids":["C22","B25"],"case_ids":["TC022"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P134","chapter":"6","section":"6. 철회·취소·신고","line":200,"text":"일반 신고의 첫 확인 목표는 평일 09~18시 운영 기준 영업일 2일 이내다. 담당자는 대표 유미이며 사건별 완료 시한은 별도 안내한다. 위급 상황은 공식 긴급 도움 경로를 안내하고 위험 신고를 우선 검토한다.","group_ids":["C22","B25"],"case_ids":["TC022","TC062"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P135","chapter":"6","section":"6. 철회·취소·신고","line":201,"text":"불인정·증거 부족만으로 신고자를 제재하지 않는다. 조작·보복 목적이 확인된 반복 신고를 심사한다. 양쪽이 불발을 인정하면 간단히 처리하고 다툼이 있으면 분쟁 심사한다.","group_ids":["C22","B25"],"case_ids":["TC022"],"gate_ids":["G09"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P136","chapter":"6","section":"6. 철회·취소·신고","line":205,"text":"경미 위반은 위협·성희롱·개인정보 노출 없는 낮은 위험의 규칙 위반이다. 반복은 안내·경고 후 같은 유형 또는 같은 피해자 대상 위반의 재발이다. 중대 위반은 성희롱·협박·폭력·스토킹·신상 노출·성적 착취 등 안전·권리 침해다. 정당한 비판과 증거 부족 신고 자체는 위반이 아니다.","group_ids":["C23","B26"],"case_ids":["TC023"],"gate_ids":["G10"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P137","chapter":"6","section":"6. 철회·취소·신고","line":206,"text":"경미한 첫 인정은 경고, 그 뒤 첫 재발은 신규 공고 작성·신청·확정 7일 제한, 두 번째 재발부터는 매번 30일 제한한다. 직전 확정 위반 후 12개월 동안 재발이 없으면 일반 위반 단계는 경고부터 다시 센다. 연속취소의 첫 경고 유지 규칙에는 이 초기화를 적용하지 않는다.","group_ids":["C23","B26"],"case_ids":["TC023"],"gate_ids":["G10"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P138","chapter":"6","section":"6. 철회·취소·신고","line":207,"text":"중대 위반이 운영 검토에서 확인되면 경고 없이 해당 계정을 즉시 영구 이용 제한한다. 신고 접수만으로 위반이 확정됐다고 보지 않는다. 심사 중 필요한 접촉 제한과 최종 영구 제재를 구분한다. 기존 약속의 안전 관리·본인 자료 열람·이의 절차는 유지한다.","group_ids":["C23","B26"],"case_ids":["TC023"],"gate_ids":["G10"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P139","chapter":"6","section":"6. 철회·취소·신고","line":208,"text":"취소 외 제재는 당사자가 앱에서 판정·사유·이의 방법을 확인할 수 있도록 안내가 성공적으로 제공된 서버 시각부터 7일 내 이의 신청을 받는다. 최초 열람 시각이나 푸시·메일 발송 시각으로 기산하지 않는다. 앱 안내 제공에 실패하면 기산하지 않으며 안내에 이의 마감 시각을 함께 표시한다. 심사 중 기존 제한은 원칙상 유지하되 명백한 오류가 확인되면 즉시 해제하고 잘못된 이력·당도 영향을 정정한다. 이의 신청으로 제재 기간을 다시 시작하지 않는다. 취소 이의의 24시간·판정 보류 규칙은 별개다.","group_ids":["C23","B26"],"case_ids":["TC024"],"gate_ids":["G10"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P140","chapter":"6","section":"6. 철회·취소·신고","line":212,"text":"성희롱·협박·혐오·인격 모욕·사칭·스팸·허위 모집·금전/민감정보 강요 및 아동 성적 착취·학대 콘텐츠를 금지한다. 사실과 경험에 근거한 부정 평가·비판은 허용한다.","group_ids":["C23","B26"],"case_ids":["TC023","TC025"],"gate_ids":["G01","G10"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P141","chapter":"6","section":"6. 철회·취소·신고","line":213,"text":"공고·공개 프로필·후기는 개인정보와 금지 콘텐츠를 등록 전에 검사한다. 채팅은 정상 약속 안내를 일괄 차단하지 않고 명확한 고위험을 차단한다. 애매한 위험 표현은 전송 전 확인 안내를 하고 수정하거나 그대로 전송할 수 있게 한다.","group_ids":["C23","B27"],"case_ids":["TC025"],"gate_ids":["G10"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P142","chapter":"6","section":"6. 철회·취소·신고","line":214,"text":"자동 검사와 운영자의 원문 직접 열람은 다르다. 자동 검사 때문에 원문 로그 보관·외부 AI 전송·DB 직접 열람을 추가하지 않는다. 오탐 문의와 신고 경로를 제공한다.","group_ids":["C23","B27"],"case_ids":["TC025"],"gate_ids":["G10"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P143","chapter":"7","section":"7. 약속 완료·평가·당도","line":220,"text":"예상 종료 전에는 완료 확인을 할 수 없다.","group_ids":["C24","B28"],"case_ids":["TC026"],"gate_ids":["G11"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P144","chapter":"7","section":"7. 약속 완료·평가·당도","line":221,"text":"종료 후 각 사용자는 본인의 동행 완료를 확인할 수 있다.","group_ids":["C24","B28"],"case_ids":["TC026"],"gate_ids":["G11"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P145","chapter":"7","section":"7. 약속 완료·평가·당도","line":222,"text":"한쪽만 확인한 상태는 개인 확인 완료일 뿐 동행 실제 완료가 아니다.","group_ids":["C24","B28"],"case_ids":["TC026"],"gate_ids":["G11"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P146","chapter":"7","section":"7. 약속 완료·평가·당도","line":223,"text":"양쪽이 확인하거나 예상 종료 시각 +24시간이 지나면 동행을 실제 완료 처리한다.","group_ids":["C24","B28"],"case_ids":["TC026"],"gate_ids":["G11"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P147","chapter":"7","section":"7. 약속 완료·평가·당도","line":224,"text":"취소·노쇼 건은 자동 완료에서 제외하고 신고·분쟁 검토 중에는 자동 완료를 보류한다.","group_ids":["C24","B28"],"case_ids":["TC026"],"gate_ids":["G11"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P148","chapter":"7","section":"7. 약속 완료·평가·당도","line":225,"text":"정상 동행으로 인정되면 두 사람이 합의한 최신 종료 시각 +24시간이 지났을 때 즉시 완료한다. 아직 지나지 않았다면 그 기준을 유지한다. 검토 중 종료 시각을 새로 합의한 경우에도 새 종료 시각 +24시간을 적용하며 검토 시간을 더하지 않는다.","group_ids":["C24","B28"],"case_ids":["TC027"],"gate_ids":["G11"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P149","chapter":"7","section":"7. 약속 완료·평가·당도","line":226,"text":"불발 판정을 정상 동행으로 정정할 때 이미 한 명이 탈퇴했고 실제 완료 기록이 없다면, 탈퇴자를 진행 중 약속으로 복귀시키지 않고 정정 시점에 정상 완료 처리한다. 다른 미결 검토가 있으면 완료를 보류한다. 최초 실제 완료부터7일을 적용하며 탈퇴한 본인은 후기를 작성할 수 없다.","group_ids":["C24","B28"],"case_ids":["TC027"],"gate_ids":["G11"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P150","chapter":"7","section":"7. 약속 완료·평가·당도","line":227,"text":"실제 완료 시 완료 횟수를 즉시 반영한다.","group_ids":["C24","B28"],"case_ids":["TC026","TC027"],"gate_ids":["G11"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P151","chapter":"7","section":"7. 약속 완료·평가·당도","line":228,"text":"이의 검토 중 리뷰 작성·기한 진행·공개를 보류한다. 동행 인정 후 남은 리뷰 기간을 재개하되 최소 24시간을 보장한다.","group_ids":["C25","B29"],"case_ids":["TC027","TC029"],"gate_ids":["G11","G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P152","chapter":"7","section":"7. 약속 완료·평가·당도","line":229,"text":"실제 완료 전에는 리뷰 작성 기한이 시작되지 않는다. 검토 후 처음 완료되었다면 실제 완료 시점부터 7일을 시작한다. 이미 완료된 동행은 검토 직전의 남은 리뷰 기간을 재개하며 최소 24시간을 보장한다.","group_ids":["C25","B29"],"case_ids":["TC027","TC029"],"gate_ids":["G11","G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P153","chapter":"7","section":"7. 약속 완료·평가·당도","line":230,"text":"검토 중에는 양쪽 제출을 포함해 새로운 리뷰 공개를 보류한다. 이미 공개된 후기는 접수·검토 개시만으로 숨기지 않고 운영자가 임시 비공개 필요성을 판단한 때 숨긴다. 검토 종료 후 양쪽 제출이면 공개하고, 한쪽 제출이면 재개·연장된 작성 기한 종료 시 공개한다.","group_ids":["C25","B29"],"case_ids":["TC029"],"gate_ids":["G11","G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P154","chapter":"7","section":"7. 약속 완료·평가·당도","line":234,"text":"본인 완료 확인 후 상대 확인 전에도 후기를 미리 제출할 수 있으나 실제 완료 전에는 비공개다.","group_ids":["C25","B29"],"case_ids":["TC026","TC028"],"gate_ids":["G11","G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P155","chapter":"7","section":"7. 약속 완료·평가·당도","line":235,"text":"평가 경험은 `좋아요`, `보통이에요`, `별로예요` 중 하나다.","group_ids":["C26","B30"],"case_ids":["TC028"],"gate_ids":["G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P156","chapter":"7","section":"7. 약속 완료·평가·당도","line":236,"text":"별점 1~5점은 필수, 한마디는 선택이다.","group_ids":["C26","B30"],"case_ids":["TC028"],"gate_ids":["G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P157","chapter":"7","section":"7. 약속 완료·평가·당도","line":237,"text":"`좋아요`일 때만 공식 칭찬을 최대 3개 선택할 수 있다.","group_ids":["C26","B30"],"case_ids":["TC028"],"gate_ids":["G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P158","chapter":"7","section":"7. 약속 완료·평가·당도","line":238,"text":"공식 칭찬 6종은 `시간을 잘 지켜요`, `약속한 내용을 지켜요`, `소통이 원활해요`, `배려심이 있어요`, `대화가 즐거워요`, `함께하니 편안해요`다.","group_ids":["C26","B30"],"case_ids":["TC028"],"gate_ids":["G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P159","chapter":"7","section":"7. 약속 완료·평가·당도","line":239,"text":"제출 성공 후 수정과 중복 제출은 불가능하다.","group_ids":["C26","B30"],"case_ids":["TC028"],"gate_ids":["G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P160","chapter":"7","section":"7. 약속 완료·평가·당도","line":240,"text":"후기 작성 화면에 `동의한 공개 후기는 상대방의 AI 후기 요약에 활용될 수 있어요`를 짧게 안내한다. 가입 시 받은 작성 후기 활용 동의를 매번 다시 체크하게 하지 않으며, 실제 활용은 현재 동의 상태를 확인한다.","group_ids":["C26","B30"],"case_ids":["TC028"],"gate_ids":["G03","G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P161","chapter":"7","section":"7. 약속 완료·평가·당도","line":241,"text":"후기 작성 기한은 실제 완료 시각 +7일이다.","group_ids":["C27","B29"],"case_ids":["TC028","TC029"],"gate_ids":["G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P162","chapter":"7","section":"7. 약속 완료·평가·당도","line":242,"text":"실제 완료 후 양쪽이 제출하면 즉시 공개하고, 한쪽만 제출하면 후기 작성 기한 종료 시 공개한다.","group_ids":["C27","B29"],"case_ids":["TC029"],"gate_ids":["G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P163","chapter":"7","section":"7. 약속 완료·평가·당도","line":243,"text":"상대 후기가 열람 가능해지는 시점에 당도를 반영한다.","group_ids":["C27","B29"],"case_ids":["TC029"],"gate_ids":["G12"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P164","chapter":"7","section":"7. 약속 완료·평가·당도","line":247,"text":"공개 프로필은 사진, 관계에 따른 이름, 만 나이, 선택 성향, 현재 당도, 칭찬 차트, 후기 원문을 보여준다.","group_ids":["C28","B31"],"case_ids":["TC031"],"gate_ids":["G13"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P165","chapter":"7","section":"7. 약속 완료·평가·당도","line":248,"text":"칭찬은 누적 상위 5개와 횟수를 표시한다.","group_ids":["C28","B31"],"case_ids":["TC031"],"gate_ids":["G13"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P166","chapter":"7","section":"7. 약속 완료·평가·당도","line":249,"text":"프로필 대상자의 요약 생성·노출 동의와 원문 작성자의 후기 활용 동의를 구분한다. 현재 활용이 허용된 한마디가 있는 공개 후기 3개 이상일 때만 AI 요약을 생성·제공한다. 열람 회원의 요약 열람 동의도 확인한다.","group_ids":["C29","B31"],"case_ids":["TC032"],"gate_ids":["G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P167","chapter":"7","section":"7. 약속 완료·평가·당도","line":250,"text":"비공개 후기·텍스트 없는 평가·원문 작성자가 AI 활용을 철회한 후기는 AI 요약 근거에서 제외한다.","group_ids":["C29","B31"],"case_ids":["TC032"],"gate_ids":["G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P168","chapter":"7","section":"7. 약속 완료·평가·당도","line":251,"text":"요약 실패·대기 상태에서도 공개 가능한 칭찬과 원문 후기는 유지한다.","group_ids":["C28","B31"],"case_ids":["TC032"],"gate_ids":["G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P169","chapter":"7","section":"7. 약속 완료·평가·당도","line":252,"text":"숨긴 후기의 칭찬은 차트에서 제외하고 유효하게 재공개되면 복원한다. 다른 공개 후기의 칭찬은 유지한다.","group_ids":["C28","B31"],"case_ids":["TC029","TC031","TC032"],"gate_ids":["G12","G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P170","chapter":"7","section":"7. 약속 완료·평가·당도","line":253,"text":"비공개 후기를 근거로 만든 기존 AI 요약은 즉시 숨긴다. 남은 현재 활용 허용 공개 텍스트 후기 3개 이상이고 대상자의 생성·노출 동의와 처리 조건을 충족하면 정기 주기에 재생성하며, 미만이면 요약 대기를 표시한다.","group_ids":["C28","B31"],"case_ids":["TC029","TC032","TC034"],"gate_ids":["G12","G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P171","chapter":"7","section":"7. 약속 완료·평가·당도","line":254,"text":"검토 종료 후 현재 조건을 다시 확인해 공개 가능한 후기를 복원한다. 복원 자체의 당사자 알림은 보내지 않는다.","group_ids":["C28","B31"],"case_ids":["TC029","TC032"],"gate_ids":["G12","G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P172","chapter":"7","section":"7. 약속 완료·평가·당도","line":255,"text":"공개 AI 요약은 최대 300자다. 표시하거나 다시 펼칠 때 서버의 현재 공개 조건을 조회하며 별도 공개 결과 캐시는 두지 않는다.","group_ids":["C29","B31"],"case_ids":["TC032"],"gate_ids":["G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P173","chapter":"7","section":"7. 약속 완료·평가·당도","line":259,"text":"세 동의는 각각 독립적으로 철회할 수 있고 다른 두 동의를 자동 철회하지 않는다. 계정·일반 동행·일반 후기 원문·별점·당도는 AI 동의 철회만으로 바꾸지 않는다. 일반 후기의 삭제·숨김·최종 무효 정책은 별도 적용한다.","group_ids":["C30","B32"],"case_ids":["TC033"],"gate_ids":["G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P174","chapter":"7","section":"7. 약속 완료·평가·당도","line":260,"text":"열람 동의 철회는 본인의 요약 열람만 중단한다. 다른 회원에게 공개되는 본인 요약과 본인이 작성한 후기의 활용은 별도 동의가 유지되면 자동 중단하지 않는다.","group_ids":["C30","B32"],"case_ids":["TC033"],"gate_ids":["G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P175","chapter":"7","section":"7. 약속 완료·평가·당도","line":261,"text":"내 프로필 생성·노출 동의 철회는 본인 요약을 숨기고 신규 생성·갱신을 중단한다. 다른 회원의 허용된 요약 열람과 타인에게 쓴 후기의 활용은 각각의 동의 상태를 따른다.","group_ids":["C30","B32"],"case_ids":["TC033"],"gate_ids":["G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P176","chapter":"7","section":"7. 약속 완료·평가·당도","line":262,"text":"원문 활용 동의 철회는 본인이 작성한 기존·향후 후기를 모두 AI 요약 재료에서 제외한다. 해당 후기를 사용한 기존 요약은 우선 숨긴다. 남은 허용 공개 텍스트 후기 3개 이상, 대상자의 생성·노출 동의, 기존 공개·처리 조건을 모두 충족할 때만 재생성 후 공개한다. 부족·미확인·실패 시 숨김을 유지한다.","group_ids":["C30","B32"],"case_ids":["TC033","TC034"],"gate_ids":["G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P177","chapter":"7","section":"7. 약속 완료·평가·당도","line":263,"text":"철회한 처리의 새 외부 전송을 중단하고 AI 처리용 원문 복제본·외부 사본·관련 생성물의 필요한 삭제를 추적한다. 일반 후기 저장 원문과 AI 처리용 사본을 구분하며 공급사의 실제 삭제를 확인하기 전 삭제 완료로 표시하지 않는다.","group_ids":["C30","B32"],"case_ids":["TC033","TC034"],"gate_ids":["G14"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P178","chapter":"7","section":"7. 약속 완료·평가·당도","line":267,"text":"초기값은 15, 표시는 0~100의 정수다. 아직 평가가 없는 초기값임을 안내한다. 완료 횟수와 칭찬은 당도에 가산하지 않는다.","group_ids":["C31","B33"],"case_ids":["TC030","TC031"],"gate_ids":["G13"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P179","chapter":"7","section":"7. 약속 완료·평가·당도","line":268,"text":"후기 반응은 좋아요 +1·보통 0·별로 −2, 별점은 1~2점 −2·3점 0·4~5점 +1로 각각 계산해 합산한다. 미작성 평가는 0이다.","group_ids":["C31","B33"],"case_ids":["TC030"],"gate_ids":["G13"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P180","chapter":"7","section":"7. 약속 완료·평가·당도","line":269,"text":"확정된 운영 감점은 취소 제재 1회 −2, 노쇼 1건 −3, 중대 위반 1건 −10이다. 같은 사건에 여러 운영 위반이 겹치면 가장 큰 운영 감점 하나만 적용한다. 개별 취소 한 번을 곧바로 취소 제재 1회로 세지 않는다.","group_ids":["C31","B33"],"case_ids":["TC030"],"gate_ids":["G13"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P181","chapter":"7","section":"7. 약속 완료·평가·당도","line":270,"text":"유효 후기와 운영 감점이 같은 사건에 함께 있으면 둘 다 합산한다. 노쇼 등으로 동행·후기 자격이 무효라면 해당 후기 기여를 제외한다.","group_ids":["C31","B33"],"case_ids":["TC030"],"gate_ids":["G13"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P182","chapter":"7","section":"7. 약속 완료·평가·당도","line":271,"text":"초기 15에 모든 유효 가감 내역을 합산하고 마지막 표시값만 0~100으로 제한한다. 사건마다 상·하한으로 잘라 누적하지 않는다. 원 평가·가감 내역을 유지해 무효·해제 시 재계산한다.","group_ids":["C31","B33"],"case_ids":["TC030"],"gate_ids":["G13"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P183","chapter":"7","section":"7. 약속 완료·평가·당도","line":272,"text":"후기 점수는 상대 후기의 열람이 가능해지는 시점에 반영한다. 양쪽 제출은 실제 완료 조건을 충족한 공개 시점, 한쪽 제출은 작성 기한 종료 공개 시점이다. 운영 감점은 해당 위반·제재가 확정된 때 적용한다.","group_ids":["C31","B33"],"case_ids":["TC030","TC031"],"gate_ids":["G12","G13"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P184","chapter":"7","section":"7. 약속 완료·평가·당도","line":273,"text":"임시 후기 숨김 중에는 이미 반영한 당도를 유지하고 최종 무효 판정 때 해당 기여를 제외한다. 공개 복원·운영 오판 정정과 연결해 재계산한다.","group_ids":["C31","B33"],"case_ids":["TC030","TC031"],"gate_ids":["G12","G13"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P185","chapter":"7","section":"7. 약속 완료·평가·당도","line":274,"text":"계산 예: 초기 15에서 좋아요와 별점 5는 17, 별로와 별점 1은 11이다. 후자가 유효한 실제 완료 동행에서 중대 위반 −10도 확정되면 1이다. 이는 산식 예시이며 실제 회원 결과가 아니다.","group_ids":["C31","B33"],"case_ids":["TC030","TC031"],"gate_ids":["G13"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P186","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":278,"text":"홈 배너·기본 행사 목록은 `이번 주 신규 중 미종료` 행사만 제공하고 화면에 이 기준을 안내한다. 이번 주에 시작했어도 이미 끝났으면 기본 목록에서 제외하며 과거 기간 조회에서 찾을 수 있다.","group_ids":["C32","B34"],"case_ids":["TC035"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P187","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":279,"text":"`진행 중 포함`을 선택하면 이전 주에 시작해 아직 진행 중인 행사도 포함한다.","group_ids":["C32","B34"],"case_ids":["TC035"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P188","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":280,"text":"한 주는 한국시간 월요일 00:00부터 다음 월요일 00:00 미만으로 본다.","group_ids":["C32","B34"],"case_ids":["TC035"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P189","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":281,"text":"행사 배너·목록의 `○월 ○주차`는 그 주의 목요일이 속한 달에 귀속한다. 해당 월의 날짜가 4일 이상 포함된 주를 그 달의 주차로 세며, 월 경계에서 한 주를 나누지 않는다.","group_ids":["C32","B34"],"case_ids":["TC035"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P190","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":282,"text":"해당 월의 첫 번째 목요일이 포함된 주를 1주차로 하고 이후 월요일마다 2주차·3주차로 순서대로 계산한다. 월말의 주도 같은 기준으로 다음 달에 귀속될 수 있으며, 연말·연초에는 귀속 연도도 함께 바뀐다.","group_ids":["C32","B34"],"case_ids":["TC035"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P191","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":283,"text":"매월 1일이 월~목요일이면 그날이 속한 주가 해당 월 1주차다. 금~일요일이면 그날이 속한 주는 전월 마지막 주차이며, 다음 월요일부터 해당 월 1주차다.","group_ids":["C32","B34"],"case_ids":["TC035"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P192","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":284,"text":"예: 2026년 9월 1일은 화요일이므로 8월 31일~9월 6일은 `9월 1주차`다. 2023년 9월 1일은 금요일이므로 8월 28일~9월 3일은 `8월 5주차`, 9월 4일~10일은 `9월 1주차`다.","group_ids":["C32","B34"],"case_ids":["TC035"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P193","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":285,"text":"이번 주 신규 행사는 해당 주의 월요일 00:00부터 다음 월요일 00:00 미만에 시작한 행사로 판단한다. 달이 다른 날짜도 같은 주간 범위에 포함하며, 월별 주차 표기를 위해 범위를 월초·월말에서 자르지 않는다. KOPIS 공식 순위의 `어제까지 최근 7일` 집계는 별도 기준을 유지한다.","group_ids":["C32","B34"],"case_ids":["TC035"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P194","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":286,"text":"표준과 서비스 규칙을 구분한다. ISO 8601-1의 주 달력은 연도 기준 주차를 정의하며, 위 월별 주차는 월요일 시작·목요일 귀속 원칙을 유미당의 월별 표시 규칙으로 적용한 것이다. 월별 주차 자체가 ISO의 직접 규정이라고 표기하지 않는다. 참고: [ISO 8601-1:2019 3.1.1.23 주 달력 정의](https://cdn.standards.iteh.ai/samples/70907/5e8d00e639cf4f849462bd63062f4cd8/ISO-8601-1-2019.pdf).","group_ids":["C32","B34"],"case_ids":["TC035"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P195","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":287,"text":"행사 유형은 공연·전시·축제·팝업 등 제공처의 실제 분류를 따른다.","group_ids":["C33","B35"],"case_ids":["TC036"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P196","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":288,"text":"공연은 콘서트·뮤지컬·연극 하위 장르 필터를 제공한다.","group_ids":["C33","B35"],"case_ids":["TC036"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P197","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":289,"text":"종료된 행사는 조회할 수 있으나 새 동행 모집 대상으로 연결하지 않는다.","group_ids":["C33","B34"],"case_ids":["TC035","TC036"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P198","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":290,"text":"작성용 행사 선택은 연결 가능한 진행 중·예정 행사 전체를 대상으로 한다. 만남 일정과 행사 기간의 겹침을 강제하거나 검색 범위를 자동으로 좁히지 않고 달력에 행사 진행 날짜만 색으로 안내한다.","group_ids":["C33","B34"],"case_ids":["TC036","TC037"],"gate_ids":["G15","G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P199","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":291,"text":"행사 상세는 명칭, 기간, 장소, 입장료, 출처, 운영 안내, 연결 공고를 제공한다. KOPIS·TourAPI·서울 데이터는 기존 공통 행사 계약에 맞춰 정규화하되 원천 ID·출처·누락·날짜 정밀도를 보존한다. 실제 확보한 값만 표시하고 미제공 요금을 무료로, 행사 기간을 동행 약속으로 대신하지 않는다.","group_ids":["C34","B35"],"case_ids":["TC036","TC044"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P200","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":292,"text":"행사장을 공고 작성의 장소 후보로 전달할 수 있다.","group_ids":["C34","B35"],"case_ids":["TC036"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P201","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":293,"text":"KOPIS 순위 선택은 전체 공연(기본), 연극, 뮤지컬, 클래식, 국악, 대중음악, 무용, 대중무용, 서커스/마술, 복합, 아동, 대학로, 내한, 축제의 14항목이다. 표시명은 서양음악(클래식)→클래식, 한국음악(국악)→국악, 무용(서양/한국무용)→무용으로 바꾸되 원천 코드·원래 분류는 보존한다. 아동·대학로·내한·축제는 장르와 구분되는 공식 특성·지역 조건을 따른다.","group_ids":["C35","B01"],"case_ids":["TC046"],"gate_ids":["G20"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P202","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":294,"text":"집계는 어제까지 최근7일, 갱신은 매일이다. 분류마다 공식 사이트에 표시된 실제 기간·공식 분류/지역·정렬 기준과 API 공연ID·순위·순서가 일치한 Top10만 공개한다. basedate가 없어도 이 대조를 통과한 목록은 공개할 수 있으나 API 내부 집계 기간을 증명했다고 안내하지 않는다. 요청 날짜만으로 기간을 확정하거나 일간 순위를 합산한 자체 주간 순위를 만들지 않는다. 동률은 공식 표시 순서 그대로 유지하고 10개 미만이면 검증한 개수만 표시한다.","group_ids":["C35","B01"],"case_ids":["TC046"],"gate_ids":["G20"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P203","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":295,"text":"출처·실제 확인 기간·확인 시각을 표시한다. 갱신 실패 시 마지막 검증 목록의 기존 기간을 그대로 유지하고 갱신 지연을 안내하며 최신 날짜로 바꾸지 않는다. 최초 미검증·미지원 분류는 공식 사이트 링크를 제공하고 자체 순위로 채우지 않는다. 분류별 성공·실패를 독립 관리한다. 현재 API 매핑·자동 대조·저장·서버 응답 구현과 운영 검증은 별도이며 이 정책 변경만으로 연동 완료로 표시하지 않는다.","group_ids":["C35","B01"],"case_ids":["TC047"],"gate_ids":["G20"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P204","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":296,"text":"초기 과거 수집은 최근 1개월, 미래 수집은 오늘부터 31일이며 이미 진행 중인 행사도 별도 갱신한다. 처리 한도에 도달하면 진행 위치를 보존해 다음 실행에 이어 수집하고 미수집 범위를 운영 상태에 표시한다.","group_ids":["C33","B36"],"case_ids":["TC044","TC045"],"gate_ids":["G19"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P205","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":300,"text":"일반 공고 작성은 행사 영역을 맨 아래, 행사 상세의 이 행사로 동행 구하기에서 시작하면 맨 위에 둔다. 행사 연결은 선택이다.","group_ids":["C36","B17"],"case_ids":["TC037"],"gate_ids":["G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P206","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":301,"text":"행사 선택은 만남 일정과의 겹침을 강제하지 않는다. 만남 날짜가 달라도 연결 가능하고 행사 검색도 동행 일정으로 자동 축소하지 않는다. 달력에서 연결 행사의 진행 날짜를 색으로 표시하되 사용자 선택/작성 일정을 자동 변경하지 않는다. 기존 확정 약속끼리의 일정 충돌 제한은 유지한다.","group_ids":["C36","B17"],"case_ids":["TC037"],"gate_ids":["G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P207","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":302,"text":"일반 행사 기본 목록은 이번 주 신규 중 미종료, 진행 중 포함 선택·과거 조회 유지. 검색은 실제 조회 가능한 전체 기간에서 찾고 범위를 표시한다. 작성용은 연결 가능한 예정·진행 중 전체에서 검색·탐색,10개씩 더보기. 0건과 조회 실패를 구분하고0건에 조건 변경/직접 입력 제공.","group_ids":["C36","B34"],"case_ids":["TC035","TC037"],"gate_ids":["G15","G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P208","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":303,"text":"직접 입력은 행사명 필수, 장소명·공개 행사장 주소 선택. 주소는 기존 장소·주소 검색으로 선택하고 공개 확인·개인 주소 금지 안내·기존 의심정보 검사를 적용한다. 찾지 못하면 행사 주소 생략 가능. 공고 자체의 필수 약속 장소는 별개다.","group_ids":["C37","B17"],"case_ids":["TC038"],"gate_ids":["G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P209","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":304,"text":"직접 입력은 공고 안에만 표시하고 공통 행사 목록·독립 행사 상세·검수 후 공용화 절차를 만들지 않는다. 개인 취미 공연·외부 원데이클래스도 가능. 별도 행사 기간·이미지·요금 입력은 받지 않고 필요하면 공고 소개에 작성한다.","group_ids":["C37","B17"],"case_ids":["TC038"],"gate_ids":["G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P210","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":305,"text":"연결 카드 버튼은 변경·삭제. 삭제는 해당 공고의 행사 연결만 제거하고 원천 행사는 삭제하지 않는다.","group_ids":["C37","B17"],"case_ids":["TC037"],"gate_ids":["G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P211","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":309,"text":"행사명은 목록 최대2줄·말줄임, 상세 전체. 카드 순서는 대표 이미지(있을 때)→분류·상태→이름→기간→지역·행사장→요금. 대표 이미지는 전체가 보이게 자르지 않고, 없거나 로딩 실패면 영역 자체를 생략해 글만 표시한다.","group_ids":["C34","B35"],"case_ids":["TC036"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P212","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":310,"text":"날짜는 하루 YYYY.MM.DD, 같은 해 기간 YYYY.MM.DD ~ MM.DD, 연도 경계 YYYY.MM.DD ~ YYYY.MM.DD. 진행 중·예정·종료는 기간 상태이며 개장·잔여석·예약 가능 보장이 아니다.","group_ids":["C34","B35"],"case_ids":["TC036"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P213","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":311,"text":"장소는 카드에 지역·행사장, 상세에 공개 행사장 전체 주소. 상세주소를 행사장명으로 오인하지 않는다. 공고 목록 공개 지역은 동까지이며 공개 행사장 주소와 확정 당사자만 보는 상세 만남 지점은 별도다.","group_ids":["C34","B35"],"case_ids":["TC036"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P214","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":312,"text":"요금은 명시 무료/명확한 단일 금액/요금 상세 확인/요금 정보 없음. 빈값을 무료로 표시하지 않고 상세에 원래 안내를 표시한다. 외부 입장료와 무료1:1 동행은 별개다.","group_ids":["C34","B35"],"case_ids":["TC036"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P215","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":313,"text":"분류는 명확한 대응만 통일해 클래식·국악·무용을 사용하고 세부 분류 없으면 행사 등 넓은 이름. TourAPI에서 실제 수신된 관광타입15 전체(축제6·공연10·행사4)를 포함한다. 시설타입14로 확대하지 않는다.","group_ids":["C34","B35"],"case_ids":["TC036"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P216","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":314,"text":"행사 상세 순서: 명칭·분류·상태→이미지→기간·시간·장소·공개 주소·요금→소개→제공된 추가 관람 안내→유효한 공식/예매 링크→연결 공고. 기본 정보 누락은 안내, 선택 부가 정보는 없으면 생략.","group_ids":["C34","B35"],"case_ids":["TC036"],"gate_ids":["G15"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P217","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":315,"text":"연결 공고는 내부 행사 관계로 조회해 전체 상태·등록 최신순 기본, 모집 중 필터,10개씩 더보기. 삭제/차단/본인 숨김/비로그인 개인정보 등 기존 권한 유지.0건이면 아직 이 행사에 등록된 동행 공고가 없어요 안내.","group_ids":["C38","B37"],"case_ids":["TC039"],"gate_ids":["G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P218","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":316,"text":"행사 상세에서 이 행사로 동행 구하기는 해당 행사를 미리 연결한다. 비로그인은 로그인/가입 완료 후 원래 행사 연결 작성으로 복귀하고 현재 연결 가능 상태를 확인한다. 미완료/취소 로그인은 작성 권한을 주지 않는다.","group_ids":["C36","B37"],"case_ids":["TC039"],"gate_ids":["G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P219","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":317,"text":"공고 상세에는 연결 행사 종류·이름·행사기간·행사장·이미지(있을 때)와 행사 정보 보기. 직접 입력은 별도 상세로 이동하지 않는다. 행사 연결 없으면 영역 생략.","group_ids":["C38","B37"],"case_ids":["TC038"],"gate_ids":["G16"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P220","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":321,"text":"새 연결은 예정/진행 중 가능, 종료/공식취소 불가, 연기 일정 미정 불가, 변경 일정 확인 뒤 조건에 맞으면 가능. 공식 취소 시 취소된 행사예요 안내. 확인된 비표출은 새 선택에서 제외한다.","group_ids":["C39","B38"],"case_ids":["TC040"],"gate_ids":["G17"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P221","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":322,"text":"취소·연기는 의미가 검증된 공식 원천 값만 표시한다. 취소·연기·원천 일정 변경으로 기존 동행을 자동 취소/변경하지 않는다. 단순 검색 누락은 취소/삭제/비표출의 근거가 아니다.","group_ids":["C39","B38"],"case_ids":["TC040","TC041"],"gate_ids":["G17"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P222","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":323,"text":"취소 여부 미제공은 별도 보존하고 정상 수집·유효 기간 등 기본 조건을 충족하면 연결 허용. 공식 정상 개최 확인으로 표시하지 않고 개최 여부는 공식 안내 확인을 안내한다. API 오류·손상·상태 해석 실패를 미제공으로 바꿔 허용하지 않는다.","group_ids":["C39","B38"],"case_ids":["TC040"],"gate_ids":["G17"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P223","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":324,"text":"등록 직전 우리 서버의 최신 연결 가능 상태 확인. 확인 실패 시 입력을 보존하고 다시 확인 또는 사용자가 행사 연결 삭제 후 등록 가능. 선택 행사 자동 삭제·외부API 매 등록 직접호출 없음.","group_ids":["C39","B38"],"case_ids":["TC039","TC040"],"gate_ids":["G16","G17"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P224","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":325,"text":"작성자의 행사 교체·삭제·직접 입력 행사명/장소의 실질 변경은 핵심 조건 변경. 확정 전 기존 알림·최종 동의 무효화/재요청, 확정 후 기존 상대 수락 절차 적용. 수락 전 기존 약속 유지. 기관 자동 갱신은 작성자의 변경과 구분한다.","group_ids":["C40","B38"],"case_ids":["TC038","TC041"],"gate_ids":["G16","G17"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P225","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":326,"text":"확인된 취소·연기·변경 일정은 연결 공고 작성자와 진행 중 동행의 확정 상대에게 앱 안 알림. 동일 변화 중복 방지. 단순 조회자/종료 동행 전체 알림·새푸시 도입은 하지 않는다.","group_ids":["C40","B38"],"case_ids":["TC041"],"gate_ids":["G17"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P226","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":327,"text":"비표출: 연결된 행사 정보를 현재 제공할 수 없어요 / 행사 취소를 의미하지는 않아요 안내 카드로 대체. 해당 원천의 행사명·이미지·설명·주소와 상세 이동 숨김. 공고·약속·내부 연결 보존. 직접 입력에는 적용하지 않는다.","group_ids":["C41","B39"],"case_ids":["TC041"],"gate_ids":["G17"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P227","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":328,"text":"재표출은 명시 상태/공개 조건과 최신 자료를 검증한 뒤 자동 복원. 종료된 행사도 기존 공고 과거 열람은 가능하나 새 연결은 막는다. 취소/연기 상태가 남으면 그 안내를 유지한다.","group_ids":["C41","B39"],"case_ids":["TC041"],"gate_ids":["G17"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P228","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":332,"text":"행사 단위의 공식 공통 식별자·정확한 공식 행사 상세 링크 등 확실한 근거로 동일 개최 단위임을 확인할 수 있는 원천들만 통합해 대표 카드·상세·연결 공고를 제공한다. 공통 기관 홈페이지·제목/날짜/장소 유사성만으로 합치지 않는다. 근거 부족이면 출처별 유지한다. 상시 수동 검수 업무는 만들지 않는다.","group_ids":["C41","B40"],"case_ids":["TC042"],"gate_ids":["G18"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P229","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":333,"text":"모든 provider+sourceId, 원천별 공고 관계·통합 근거·통합/분리 기록을 보존한다. 기존 링크·공고를 잃지 않고 통합을 되돌릴 수 있어야 한다. 실제 공통 식별 근거 확보는 별도이며 초기 통합 건수가0이어도 검증 없이 묶지 않는다.","group_ids":["C41","B40"],"case_ids":["TC042"],"gate_ids":["G18"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P230","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":334,"text":"먼저 통합 검증을 통과한 공개 원천을 대표로 유지하고, 비어 있는 항목만 다른 검증된 공개 원천으로 보완하며 필드별 출처를 남긴다. 대표가 비표출이면 그 값을 재사용하지 않고 다른 유효 공개 원천으로 전환한다.","group_ids":["C41","B40"],"case_ids":["TC043"],"gate_ids":["G18"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P231","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":335,"text":"비표출된 원천 자료만 숨기고 다른 유효 공개 원천은 유지한다. 공개 원천이 하나도 없으면 비표출 안내 카드. 기간·장소·취소/연기 등 핵심 충돌은 기관별 정보가 달라 확인이 필요해요 안내와 새 연결 제한, 기존 약속 유지. 조용히 원천 값을 혼합하거나 미제공을 정상으로 조작하지 않는다.","group_ids":["C41","B40"],"case_ids":["TC043"],"gate_ids":["G18"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P232","chapter":"8","section":"8. 행사 탐색과 공식 순위","line":336,"text":"KOPIS 공식 순위는 일반 행사 통합과 별개다. 집계기간 대조·공식 분류별 Top10 목표를 변경하거나 공급사 순위를 합치지 않는다.","group_ids":["C35","B01"],"case_ids":["TC043"],"gate_ids":["G18","G20"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P233","chapter":"9","section":"9. AI 동행 탐색","line":340,"text":"S20 AI 탐색은 로그인 회원만 이용할 수 있다.","group_ids":["C42","B41"],"case_ids":["TC005"],"gate_ids":["G03","G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P234","chapter":"9","section":"9. AI 동행 탐색","line":341,"text":"AI 탐색은 첫 사용 시 기능별 동의를 받고 동의 확인 전 모델 처리·질문 외부 전송을 시작하지 않는다. 거절하면 일반 검색·일반 동행·계정을 유지한다. 가입 화면의 후기 요약 세 선택 동의·전체 동의와 분리한다.","group_ids":["C42","B41"],"case_ids":["TC005"],"gate_ids":["G03","G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P235","chapter":"9","section":"9. AI 동행 탐색","line":342,"text":"AI 화면의 설명 영역과 함께 첫 사용 동의 안내를 제공한다. 철회 요청 시 AI 탐색의 새 전송을 중단하며 일반 검색·일반 동행·계정은 유지한다. AI 처리용 사본의 필요한 삭제를 추적하고 실제 삭제 확인 전 완료로 표시하지 않는다. 후기 요약의 독립 철회는 7-3-1을 따른다.","group_ids":["C42","B41"],"case_ids":["TC005","TC034"],"gate_ids":["G03","G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P236","chapter":"9","section":"9. AI 동행 탐색","line":343,"text":"실명·전화번호·비공개 상세 주소 등 개인 식별 정보는 추천 입력·결과에서 제외한다.","group_ids":["C43","B41"],"case_ids":["TC048","TC051"],"gate_ids":["G04","G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P237","chapter":"9","section":"9. AI 동행 탐색","line":344,"text":"GPS는 사용하지 않으며 사용자가 설정한 지역을 추천에 사용한다. 지역을 설정하지 않았으면 지역명을 묻는다.","group_ids":["C43","B41"],"case_ids":["TC048"],"gate_ids":["G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P238","chapter":"9","section":"9. AI 동행 탐색","line":345,"text":"행사 카드와 동행 공고 카드를 명확히 구분하며, 연결 공고가 없는 행사를 신청 가능한 동행처럼 표시하지 않는다.","group_ids":["C43","B41"],"case_ids":["TC036","TC048","TC049"],"gate_ids":["G15","G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P239","chapter":"9","section":"9. AI 동행 탐색","line":346,"text":"공고 결과에는 비공개 주소·상세 만남 지점·거리(km)를 표시하지 않는다.","group_ids":["C43","B41"],"case_ids":["TC048","TC049"],"gate_ids":["G04","G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P240","chapter":"9","section":"9. AI 동행 탐색","line":347,"text":"현재 프로토타입은 카테고리·주요 지역·무료·주말 조건을 다룬다. 세부 운영시간, 실시간 날짜 계산, 미등록 지역 인식은 후속 과제다.","group_ids":["C43","B41"],"case_ids":["TC048"],"gate_ids":["G01","G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P241","chapter":"9","section":"9. AI 동행 탐색","line":348,"text":"초기 AI 대화는 기기 메모리에만 유지하고 화면 종료·로그아웃 시 삭제한다. 서비스 서버나 브라우저 영구 저장소에는 저장하지 않는다.","group_ids":["C43","B41"],"case_ids":["TC048"],"gate_ids":["G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P242","chapter":"9","section":"9. AI 동행 탐색","line":349,"text":"실제 외부 전송, 공급사 보관 조건, 암호화, 법적 동의 문구는 연동 전에 별도 검토·확인이 필요하다.","group_ids":["C43","B41"],"case_ids":["TC005","TC048"],"gate_ids":["G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P243","chapter":"9","section":"9. AI 동행 탐색","line":350,"text":"현재 대화는 사용자·AI 메시지 합계 20개, 메시지별 500자, 전체 4,000자로 제한하는 설계다. 초과 전에 알리고 사용자가 확인한 필터로 새 탐색한다. 원문을 몰래 잘라내거나 영구 저장하지 않는다.","group_ids":["C44","B42"],"case_ids":["TC048"],"gate_ids":["G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P244","chapter":"9","section":"9. AI 동행 탐색","line":351,"text":"실제 검색 후보는 10개씩 최대 3쪽(30개) 확인하고 최대 5개를 표시한다. 반환 직전 현재 정보를 재조회한다. 공개 정보만 바뀐 카드는 최신 정보와 함께 낡은 설명을 제거하고, 성향 근거가 바뀌거나 권한을 잃은 카드는 제외한다.","group_ids":["C44","B42"],"case_ids":["TC049"],"gate_ids":["G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P245","chapter":"9","section":"9. AI 동행 탐색","line":352,"text":"확인을 마친 일부 카드만 제공할 때는 일부 확인 결과라고 안내한다. 확인 카드가 0개면 결과 없음이 아닌 확인 미완료로 표시한다. 설명 생성 실패 시 확인된 실제 카드와 정형 안내는 제공한다.","group_ids":["C44","B42"],"case_ids":["TC049"],"gate_ids":["G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P246","chapter":"9","section":"9. AI 동행 탐색","line":353,"text":"공급사 전송 전 미전송이 확인된 일시 오류만 같은 회원 요청 전체에서 자동 1회 재시도한다. 전송 후 오류·응답 유실·전송 여부 불명은 자동 재전송하지 않고 입력을 유지해 직접 재시도·일반 탐색을 안내한다. 입력에서 개인정보를 발견하면 전송을 막고 수정 또는 사용자가 선택한 최소 구간의 오탐 문의를 제공한다. 출력에서 발견하면 답변을 숨기고 사용자 재시도 1회를 제공하며 반복 시 일반 탐색을 안내한다.","group_ids":["C44","B42"],"case_ids":["TC050","TC051"],"gate_ids":["G21"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P247","chapter":"9","section":"9. AI 동행 탐색","line":354,"text":"AI 결과에 `도움이 됐어요`를 제공하며 `문제 있어요`의 실제 접수는 아래 준비 조건 충족 전 비활성화한다.","group_ids":["C45","B43"],"case_ids":["TC052"],"gate_ids":["G21","G22"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P248","chapter":"9","section":"9. AI 동행 탐색","line":355,"text":"AI helpful 평가와 중복 접수 기록은 접수 후 90일 또는 회원 탈퇴 중 먼저 발생한 때 삭제한다. 만료된 AI 요청의 새 helpful 접수는 거절한다. AI 신고는 이의 절차를 포함한 최종 종결+90일 파기를 따른다.","group_ids":["C45","B43"],"case_ids":["TC052"],"gate_ids":["G21","G22"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P249","chapter":"9","section":"9. AI 동행 탐색","line":356,"text":"AI 신고 증거는 회원이 확인해 제출한 답변 일부 최대 500자 또는 본인 업로드 완료 캡처 하나다. 생성 원문 일치를 서버가 보증하지 않으며 전체 대화를 저장하지 않는다.","group_ids":["C45","B43"],"case_ids":["TC053"],"gate_ids":["G21","G22"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P250","chapter":"9","section":"9. AI 동행 탐색","line":357,"text":"AI 신고는 Storage 소유권·담당자 ACL·접근 감사·파기 연결과 결과 제공 증거·주기적 파기 준비를 확인하기 전 비활성화한다. 준비 이후 접수 성공 시 본인 화면의 해당 답변을 숨긴다. 서버 검증·앱 연결·공급사 승인·운영 활성화는 별도이며 서버는 민규, 앱 상태 소비는 종현 담당이다.","group_ids":["C45","B43"],"case_ids":["TC053"],"gate_ids":["G21","G22"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P251","chapter":"9","section":"9. AI 동행 탐색","line":358,"text":"공급사 예산은 공급사별 계약과 원장을 분리한다. 기존 포텐스닷 프로토타입의 계정별 한국시간 하루320만 토큰·등록 계정 상한 합계는 기술 토큰 예산이며 Gemini의 원화 월 예산으로 환산하지 않는다. 다계정 전환은 공급사 공동 사용 조건 확인·전송 전 계정별/전체 원자 예약·미확인 사용량 보존을 전제로 하며 운영 활성화는 미완료다. 종현 Gemini 테스트는 월50,000원 사용중단 예산을 별도로 적용하고 대표 계정 전환 전 총예산을 늘리지 않는다. 공급사 간 무료 자동 전환과 추가 결제는 자동 승인하지 않는다. 전체 허용 예산이 부족하거나 확인되지 않으면 새 모델 전송을 중단하고 일반 검색·공개 가능한 원문 이용을 유지한다.","group_ids":["C46","B44"],"case_ids":["TC055","TC056"],"gate_ids":["G23"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P252","chapter":"9","section":"9. AI 동행 탐색","line":359,"text":"회원별 초기 AI 한도는 한국시간 하루 20회이며 자정에 초기화한다. 분당 횟수 제한은 두지 않는다. 같은 회원의 요청은 한 번에 하나만 처리하며 응답 뒤 바로 다음 요청이 가능하다.","group_ids":["C46","B44"],"case_ids":["TC054"],"gate_ids":["G23"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P253","chapter":"9","section":"9. AI 동행 탐색","line":360,"text":"정해진 조건 버튼·일반 더보기를 모델 없이 처리하면 AI 횟수에서 차감하지 않는다. 자연어 해석·의미 비교·생성 설명을 위해 모델 처리를 시작하는 새 요청은 1회다. 내부의 여러 모델 호출·같은 요청의 자동 재시도는 추가 차감하지 않는다. 창 열기·새 대화·모델 호출 전 차단은 제외한다. 처리 시작 후 실패한 요청도 1회이며 사용자가 다시 보내는 새 요청은 새 1회다.","group_ids":["C46","B44"],"case_ids":["TC054"],"gate_ids":["G23"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P254","chapter":"9","section":"9. AI 동행 탐색","line":361,"text":"AI 한도 소진·동의 필요 등 중단 응답 뒤 보내기는 서버 판단을 유지한다. 안내·입력을 보존하며 자동 재전송하지 않는다. 이용 가능 상태 확인 수단을 민규와 먼저 맞춘 뒤 종현이 버튼 제어를 연결한다. 클라이언트 자체 횟수·자정 타이머·재진입만으로 이용 가능을 확정하지 않는다.","group_ids":["C46","B44"],"case_ids":["TC050","TC054"],"gate_ids":["G23"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P255","chapter":"9","section":"9. AI 동행 탐색","line":362,"text":"전체 계정 예산이 먼저 소진되면 개인 한도가 남아도 AI 이용을 중단한다. 실제 연결 후 일일 한도량·호출당 토큰 비용과 사용량을 측정해 상단 기준대로 한도를 재설정한다.","group_ids":["C46","B44"],"case_ids":["TC054","TC055"],"gate_ids":["G23"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P256","chapter":"10","section":"10. 알림·안심 수칙","line":366,"text":"알림은 첫 채팅 도착, 확정 요청, 동행 확정, 조건 변경, 취소, 완료·평가 요청 등을 제공한다.","group_ids":["C47","B45"],"case_ids":["TC057"],"gate_ids":["G24"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P257","chapter":"10","section":"10. 알림·안심 수칙","line":367,"text":"전체/읽지 않음 필터와 모두 읽음을 제공한다.","group_ids":["C47","B45"],"case_ids":["TC057"],"gate_ids":["G24"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P258","chapter":"10","section":"10. 알림·안심 수칙","line":368,"text":"알림 클릭 시 대상 화면의 최신 상태를 다시 확인한다.","group_ids":["C47","B45"],"case_ids":["TC057","TC069"],"gate_ids":["G24"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P259","chapter":"10","section":"10. 알림·안심 수칙","line":369,"text":"알림 클릭만으로 동의·확정·완료가 실행되지 않는다.","group_ids":["C47","B45"],"case_ids":["TC057"],"gate_ids":["G24"],"scope":"현재 정책에 따른 포함·조건","qa_note":"직접 사례에 연결"},{"id":"P260","chapter":"10","section":"10. 알림·안심 수칙","line":370,"text":"기존 S12 알림 진입의 공통 상태 영역에서 대상 없음·접근 제한·일시 실패와 안전한 다음 행동을 안내한다. 서버가 확인하지 않은 원인을 403/404만으로 단정하지 않으며 사유 미확인은 중립 안내와 목록·현재 허용 경로를 제공한다. 일시 통신 실패는 다시 시도·이전 화면을 제공하고 권한 확인 전 캐시의 실명·상세 지점을 표시하지 않는다. 별도 안내 페이지는 추가하지 않는다.","group

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종현 구현 남은 질문</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1d1d1f;--muted:#5d5d63;--line:#dcdcd6;--accent:#2f5d9e;--accent-soft:#e8eef8;--warn:#8a5a00;--warn-soft:#fff4dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1e1e22;--text:#ececef;--muted:#a3a3ad;--line:#34343b;--accent:#8fb2ec;--accent-soft:#223149;--warn:#f0c46b;--warn-soft:#3a2f17}}
:root[data-theme="dark"]{--bg:#141416;--card:#1e1e22;--text:#ececef;--muted:#a3a3ad;--line:#34343b;--accent:#8fb2ec;--accent-soft:#223149;--warn:#f0c46b;--warn-soft:#3a2f17}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:1.5rem;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 20px}
.note{background:var(--warn-soft);color:var(--text);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;margin-bottom:20px}
fieldset{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 18px}
legend{font-weight:700;font-size:1.05rem;padding:0 6px}
.meta{font-size:.9rem;color:var(--muted);margin:4px 0 10px}
dl{margin:0 0 12px}dt{font-weight:600;margin-top:8px}dd{margin:2px 0 0}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-right:8px}
.opt b{display:inline}
.opt small{display:block;color:var(--muted);margin:4px 0 0 26px}
textarea{width:100%;min-height:70px;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px}
.bar div{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
#status{color:var(--muted)}
#out{width:100%;min-height:160px;margin-top:10px;display:none}
</style>
</head>
<body>
<main>
<h1>종현 잔여 작업 구현 — 남은 질문 9개</h1>
<p class="lead">2026-09-30 구현·검증 후, 코드·기존 결정·공식 자료로 해결하지 못한 선택만 모았습니다. 각 질문에서 하나를 고르거나 D에 직접 적어 주세요. 아래 “답변 복사”로 전체 답변을 복사해 대화에 붙여 넣으면 됩니다.</p>
<p class="note">선택하지 않은 질문은 “미응답”으로 복사되며 승인으로 처리하지 않습니다. 이 페이지는 아무 데도 전송하지 않습니다. 이미 확정된 선택(C 의미 비교, 정렬, 24시간 주기, 포텐스닷 Sonnet 5, 0원·합성 입력, 화면 담당 유미·성호)은 다시 묻지 않습니다.</p>
<form id="f"></form>
<textarea id="out" readonly aria-label="복사할 답변"></textarea>
</main>
<div class="bar"><div><button type="button" id="copy">답변 전체 복사</button><span id="status" role="status"></span></div></div>
<script>
const Q=[
{id:"Q1",title:"AI 탐색이 한도에 먼저 닿았을 때 이미 찾은 카드를 보여줄까요?",where:"AI 탐색 결과 화면 · 설계 5.3 · lane C Q-C1",
fact:"지금은 설계 문구대로, 설정한 페이지·판단 호출 한도 안에 반환 분량을 못 채우면 찾은 카드가 있어도 전부 숨기고 ‘탐색을 완료하지 못했다(unavailable)’로 답합니다. 0건으로 표시하지는 않습니다.",
impact:"보여주면 사용자가 일부 결과라도 활용하지만 ‘전부 찾은 결과’로 오해하지 않도록 안내와 새 응답 필드가 필요합니다. 숨기면 단순하지만 찾은 결과를 버립니다.",
opts:[["A. 찾은 카드를 ‘일부만 확인했어요’ 안내와 함께 보여준다 (추천)","가치 있는 결과를 버리지 않고 0건 오표시도 막습니다. 한계: 응답에 ‘부분 결과’ 표시 필드를 추가하고 유미·성호 화면 문구를 바꿔야 합니다."],
["B. 지금처럼 숨기고 unavailable로 안내한다","설계 원문 그대로. 결과가 있어도 사용자는 다시 시도하거나 일반 탐색으로 이동합니다."],
["C. 찾은 카드를 보여주고 ‘더 찾기’로 이어서 탐색한다","가장 친절하지만 서버가 대화를 저장하지 않으므로 이어 찾기 위치를 화면이 들고 와야 해서 구현 범위가 커집니다."]]},
{id:"Q2",title:"“~는 싫어요” 같은 제외 조건이 여러 개일 때 어떻게 결합할까요?",where:"AI 조건 해석 · 설계 5.3 · lane C Q-C2",
fact:"지금은 제외 조건은 항상 모두 적용(하나라도 비슷하면 제외)하고, 원하는 조건이 2개 이상일 때만 ‘하나라도/모두’를 묻습니다. ‘A와 B 둘 다인 사람만 싫다’ 같은 결합 제외는 지원하지 않습니다.",
impact:"결합 방식에 따라 제외되는 후보 수가 달라집니다.",
opts:[["A. 지금 규칙 유지: 제외는 항상 모두 적용, 애매하면 질문 (추천)","사용자가 싫다고 한 성향을 놓치지 않는 보수적 규칙. 한계: ‘둘 다인 경우만 제외’ 요청은 표현할 수 없습니다."],
["B. 제외 조건에도 ‘하나라도/모두’를 똑같이 적용한다","표현력은 늘지만 조건 해석이 복잡해지고 질문이 늘 수 있습니다."],
["C. 제외 조건은 한 번에 하나만 받고 여러 개면 질문한다","가장 단순하지만 대화가 길어집니다."]]},
{id:"Q3",title:"응답 직전 재확인에서 모집 상태 등 공개 정보만 바뀐 카드는?",where:"AI 탐색 결과 · 설계 5.3 · lane C Q-C3",
fact:"성향 판정에 쓴 정보가 바뀌거나 공고가 사라지면 제외합니다. 성향은 그대로이고 모집→마감처럼 공개 정보만 바뀐 카드는 최신 값으로 보여주고 생성 설명만 뺍니다(‘모집 중만 보기’면 제외).",
impact:"유지하면 결과 수가 안정적이고, 제외하면 결과가 줄 수 있습니다.",
opts:[["A. 최신 값으로 유지하고 설명만 뺀다 (추천, 현재 동작)","사용자는 실제 최신 상태를 봅니다. 한계: 마감 카드가 섞여 보일 수 있으나 ‘모집 중만 보기’로 거를 수 있습니다."],
["B. 바뀐 카드는 모두 제외한다","보수적이지만 사용자가 실제로 있는 공고를 못 볼 수 있습니다."],
["C. 유지하되 ‘방금 상태가 바뀌었어요’ 표시를 붙인다","투명하지만 응답 필드·화면 표시가 추가됩니다."]]},
{id:"Q4",title:"공식 상세 링크가 없는 행사(KOPIS) 카드를 어떻게 보여줄까요?",where:"행사 목록·AI 행사 결과 · 설계 5.4 · lane E Q-E1",
fact:"KOPIS 목록 API와 공식 가이드에는 공식 상세 페이지 주소 규칙이 없어 sourceUrl을 비워(null) 저장합니다. 반면 AI 결과 카드 코드는 행사에 공식 링크를 필수로 요구해, 그대로 연결하면 행사 AI 결과 전체가 실패합니다(현재 행사 AI는 미연결).",
impact:"링크 없는 카드를 허용하면 행사 목록·AI를 바로 연결할 수 있고, 불허하면 링크 규칙이 확인될 때까지 행사 노출이 막힙니다.",
opts:[["A. 링크 없이 ‘출처: KOPIS’만 표시하고 AI 카드도 null을 허용한다 (추천)","곧바로 연결 가능하고 링크를 추정하지 않습니다. 한계: 사용자가 상세 정보를 보려면 직접 검색해야 합니다."],
["B. 공식 링크 규칙을 KOPIS에 확인할 때까지 AI 결과에서는 행사를 빼고 일반 목록만 연결한다","링크 필수 원칙 유지. 행사 AI 연결이 늦어집니다."],
["C. KOPIS 상세 API를 추가 조사·호출해 제공되는 공식 링크가 있을 때만 표시한다","정확하지만 공급사 호출·규격 조사가 늘어납니다."]]},
{id:"Q5",title:"KOPIS를 공식 문서에 없는 HTTPS 주소로 운영 연결해도 될까요?",where:"행사 수집 · 설계 5.4 · lane E",
fact:"공식 가이드 v5.0은 HTTP 주소만 적고 ‘SSL 없음’으로 표기합니다. 키 없이 확인한 결과 https://kopis.or.kr 이 같은 API 응답을 주고 인증서도 유효(만료 2026-12-13)해, 이 주소로 검증 기간 1페이지(5건)를 실제 호출했습니다. 키를 HTTP로 보내지는 않았습니다.",
impact:"허용하면 KOPIS를 첫 행사 공급사로 바로 운영할 수 있습니다. 보류하면 HTTPS가 확인된 다른 공급사가 없어 행사 연결이 멈춥니다(서울은 HTTPS 없음, TourAPI는 키 형식 미확인).",
opts:[["A. HTTPS 주소를 사용하고 KOPIS에 공식 확인을 요청·인증서 만료를 점검한다 (추천)","키를 암호화 전송하며 실제 동작도 확인됨. 한계: 문서화되지 않은 경로라 공급사 변경 시 끊길 수 있습니다."],
["B. 공식 확인 전까지 운영 연결을 보류하고 로컬 검증만 유지한다","가장 보수적. 행사 기능 일정이 늦어집니다."],
["C. TourAPI 키 형식을 먼저 확인해 TourAPI를 첫 공급사로 바꾼다","공식 HTTPS 공급사로 대체하지만 키 형식 확인·새 어댑터 작업이 필요합니다."]]},
{id:"Q6",title:"첫 실제 AI 합성 평가를 위해 ‘추가 지출 0원’ 근거를 어떻게 확보할까요?",where:"포텐스닷 연결·합성 평가 · 설계 5.2·5.7",
fact:"공개 자료에서 포텐스닷 요금·무료 API 포함 여부·최대 출력 제한·token_usage 하위 필드 이름을 찾지 못했습니다. 계정 화면은 제가 볼 수 없어 실제 AI 호출은 미실행입니다. 호출 경로·예산 상한·합성 평가 실행기(호출 10회 계획)는 준비됐습니다.",
impact:"근거가 확보되면 합성 사례 10회 호출로 C 판단·요약의 첫 결과를 함께 볼 수 있고, 그 응답에서 사용량 필드 이름도 확인됩니다.",
opts:[["A. 팀이 포텐스닷 마이페이지의 요금제·일일 한도·API 포함 여부 화면(키 제외)을 공유하면, 그 근거로 합성 10회만 실행한다 (추천)","가장 빠르고 확인 가능한 근거. 한계: 화면이 출력 상한·과금 단위를 보여주지 않으면 여전히 보류될 수 있습니다."],
["B. 포텐스닷에 요금·출력 제한·token_usage 규격을 공식 문의한 뒤 진행한다","근거가 명확하지만 답변을 기다려야 합니다."],
["C. 실제 AI 평가를 미루고 민규 연결·화면 연결을 먼저 진행한다","비용 위험 0. AI 품질 기준 확정이 늦어집니다."]]},
{id:"Q7",title:"24시간 일일 실행(행사 갱신·요약 등록)의 시작 시각은?",where:"일일 실행 등록 · 설계 5.6",
fact:"24시간 주기는 확정이지만 시작 시각·시간대는 ‘운영 설정 때 명시’로 남아 있어 cron을 등록하지 않았습니다. 같은 날 두 번 실행돼도 중복 등록은 없습니다(DB 중복 방지).",
impact:"시각에 따라 새 행사·요약이 반영되는 시점과 트래픽 겹침이 달라집니다.",
opts:[["A. 매일 새벽 03:00 (Asia/Seoul) (추천)","이용이 적은 시간에 처리하고 아침에 결과가 반영됩니다. 한계: 공급사 점검 시간과 겹치면 다음 날로 밀릴 수 있습니다."],
["B. 매일 00:10 (Asia/Seoul)","날짜 경계 직후 반영. 심야 이용과 겹칠 수 있습니다."],
["C. 운영 환경 준비 시 민규·팀이 정한다(지금은 미정 유지)","결정을 미룹니다. 실제 등록도 그때 진행합니다."]]},
{id:"Q8",title:"행사의 지역·분류를 앱 필터와 어떻게 연결할까요?",where:"행사 목록 필터 · 설계 5.4 · lane E 열린 질문 5",
fact:"KOPIS는 지역을 ‘서울특별시’, 분류를 ‘서양음악(클래식)’처럼 원문으로 주며, 이를 그대로 저장했습니다. 앱의 공고 분류(전시·공연 등)나 동 단위 지역과 매핑하지 않았습니다.",
impact:"매핑 방식에 따라 필터 칩 구성과 검색 결과가 달라집니다.",
opts:[["A. 행사 전용 필터로 제공처 원문 값을 그대로 보여준다 (추천)","추정 매핑 없이 정확합니다. 한계: 공급사가 늘면 필터 값 체계가 섞입니다."],
["B. 앱 분류(공연·전시 등)로 매핑표를 만들어 공고와 같은 필터를 쓴다","일관된 화면. 매핑표 작성·유지가 필요합니다."],
["C. 지역·분류 필터 없이 키워드·기간만 제공한다","가장 단순. 필터 기능이 줄어듭니다."]]},
{id:"Q9",title:"성향(관심사·대화 방식) 입력 개수·길이 상한은?",where:"S06·S15-2 성향 입력 · 설계 5.3",
fact:"화면 정책이 없어 DB에는 입력 크기 방지용 기술 상한(종류별 20개, 값 40자, 중복 불가)만 두었습니다. AI 요청 조건은 10개·40자 기술 상한입니다.",
impact:"화면 칩 선택 UI와 저장 검사 값이 이 결정에 맞춰 조정됩니다.",
opts:[["A. 기술 상한을 그대로 제품 기준으로 쓴다(종류별 최대 20개·40자) (추천)","추가 작업 없음. 한계: 화면에서 20개는 많을 수 있습니다."],
["B. 종류별 최대 5개·20자로 줄인다","화면이 간결해집니다. DB 제약·검사 값 수정이 필요합니다."],
["C. 유미·성호 화면 설계 후 결정한다","화면에 맞춰 정하지만 저장 경로 연결이 늦어질 수 있습니다."]]}];
const f=document.getElementById("f");
for(const q of Q){
  const fs=document.createElement("fieldset");
  fs.innerHTML=`<legend>${q.id}. ${q.title}</legend><p class="meta">관련: ${q.where}</p>
  <dl><dt>현재 확인된 사실</dt><dd>${q.fact}</dd><dt>선택에 따른 영향</dt><dd>${q.impact}</dd></dl>`;
  q.opts.forEach(([label,desc],i)=>{
    const l=document.createElement("label");l.className="opt";
    l.innerHTML=`<input type="radio" name="${q.id}" value="${"ABC"[i]}"><b>${label}</b><small>${desc}</small>`;fs.appendChild(l);
  });
  const d=document.createElement("label");d.className="opt";
  d.innerHTML=`<input type="radio" name="${q.id}" value="D"><b>D. 기타 — 직접 작성</b><textarea name="${q.id}-other" aria-label="${q.id} 기타 답변" placeholder="원하는 방식을 적어 주세요"></textarea>`;
  d.querySelector("textarea").addEventListener("input",e=>{if(e.target.value.trim())d.querySelector("input").checked=true;});
  fs.appendChild(d);f.appendChild(fs);
}
document.getElementById("copy").addEventListener("click",async()=>{
  const lines=["[종현 구현 남은 질문 답변 — 2026-09-30]"];let n=0;
  for(const q of Q){
    const v=f.querySelector(`input[name="${q.id}"]:checked`)?.value;
    const other=f.querySelector(`textarea[name="${q.id}-other"]`).value.trim();
    if(!v){lines.push(`${q.id}: 미응답`);continue;}n++;
    if(v==="D")lines.push(`${q.id}: D(기타) — ${other||"(내용 없음)"}`);
    else lines.push(`${q.id}: ${q.opts["ABC".indexOf(v)][0]}`);
  }
  const text=lines.join("\n");const out=document.getElementById("out");out.value=text;out.style.display="block";
  let ok=false;try{await navigator.clipboard.writeText(text);ok=true;}catch{out.select();try{ok=document.execCommand("copy");}catch{}}
  document.getElementById("status").textContent=(ok?"복사했습니다":"아래 상자의 내용을 직접 복사해 주세요")+` · 응답 ${n}/${Q.length}`;
});
</script>
